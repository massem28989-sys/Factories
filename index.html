function dispenseOut(itemId, qty, date, party, reason, force=false){
  // بيسجل حركة منصرف لصنف واحد، وبيشغّل وصفته تلقائيًا لو موجودة. لو الرصيد مش كفاية (للصنف نفسه أو لأي خامة في وصفته)، بيرفض ومايسجّلش أي حاجة خالص —
  // إلا لو force=true (بتُستخدم في أدوات المطابقة مع الصرف الفعلي، لأن الشيت بيمثل حقيقة مؤكدة حصلت فعلاً حتى لو الخامات عندنا رصيدها ناقص)
  const r=S.recipes.find(x=>x.outItemId===itemId);
  if(r && r.outQty>0){
    const b = qty / r.outQty;
    const shortages=[];
    for(const l of r.lines){
      const need = n2(l.qty*b);
      const li = item(l.itemId);
      const bal = li ? calc(li).book : 0;
      if(need > bal){
        if(!force) return {move:null, auto:false, error:`الرصيد مش كفاية لخامة "${li?li.name:'غير معروفة'}" (متاح ${fmt(bal)}، مطلوب ${fmt(need)})`};
        shortages.push({name: li?li.name:'غير معروفة', need, bal});
      }
    }
    const runId=uid('run');
    for(const l of r.lines) S.moves.push({id:uid('m'),dir:'out',itemId:l.itemId,qty:n2(l.qty*b),date,price:0,party:r.name,reason:'صرف للإنتاج (تلقائي)',runId});
    const cost=recipeCost(r)*b, outQty=n2(r.outQty*b);
    S.moves.push({id:uid('m'),dir:'in',itemId:r.outItemId,qty:outQty,date,price: outQty? n2(cost/outQty):0,party:'إنتاج تلقائي: '+r.name,runId});
    S.runs=S.runs||[]; S.runs.push({id:runId,date,name:r.name,batches:n2(b),outQty,cost,auto:true});
    const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
    S.moves.push(m);
    return {move:m, auto:true, shortages: shortages.length?shortages:undefined};
  }
  const it=item(itemId);
  const bal = it ? calc(it).book : 0;
  if(qty > bal){
    if(!force) return {move:null, auto:false, error:`الرصيد مش كفاية (متاح ${fmt(bal)} بس، والمطلوب ${fmt(qty)})`};
  }
  const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
  S.moves.push(m);
  return {move:m, auto:false, shortages: (qty>bal && force)?[{name:it?it.name:'غير معروف', need:qty, bal}]:undefined};
}
async function boSaveOrder(order){
  if(!order || !order._key) { toast('تعذر تحديد الطلبية',1); return false; }
  const payload = {...order};
  delete payload._key;
  const ok = await faroojSet(order._key, JSON.stringify(payload)).catch(()=>false);
  if(!ok){ toast('حصل خطأ أثناء الحفظ في طلبية الفرع',1); return false; }
  // نعيد حساب الإجماليات بعد التعديل عشان جدول "الإجمالي المطلوب" يبان صح
  const totals={};
  BO.orders.forEach(o=>(o.items||[]).forEach(it=>{
    if(!totals[it.name]) totals[it.name]={name:it.name, unit:it.unit, qty:0};
    totals[it.name].qty = n2(totals[it.name].qty + (+it.qty||0));
  }));
  BO.totals=totals;
  return true;
}

// جدول فروع × أصناف قابل للتعديل، بنفس شكل شيت الإكسل الأصلي
// بيحسب المواد الخام اللازمة لتلبية إجمالي طلبيات الفروع كلها، بناءً على الوصفات المسجلة
function buildProductionPlan(){
  const products = [];   // كل منتج مطلوب: المطلوب، الجاهز، المحتاج إنتاجه، عدد التشغيلات، التكلفة
  const needed = {};      // rawItemId -> { it, qty }
  const unmatched = [];

  Object.values(BO.totals).forEach(r=>{
    const match = findMatchingLocalItem(r.name);
    if(!match){ unmatched.push({name:r.name, qty:r.qty, unit:r.unit, reason:'مالوش صنف مطابق في المخزن'}); return; }

    // لازم نحوّل كمية الفرع لوحدة المصنع الأول، وإلا الحساب كله هيطلع غلط
    const cf = convFactorOf(r.name);
    if(cf===null){ unmatched.push({name:r.name, qty:r.qty, unit:r.unit, reason:`وحدة الفرع (${r.unit}) مختلفة عن وحدة المصنع (${match.unit}) — حدد معامل التحويل`}); return; }
    const demand = n2(r.qty * cf);

    const onHand = calc(match).book;                    // المخزون الجاهز من المنتج ده
    const toProduce = n2(Math.max(0, demand - onHand)); // المحتاج إنتاجه فعلًا = المطلوب − الجاهز
    const rec = S.recipes.find(x=>x.outItemId===match.id);

    if(!rec || !(rec.outQty>0)){
      // مفيش وصفة: يا إما جاهز في المخزن (يتصرف مباشرة) يا إما ناقص ومحتاج توريد
      products.push({ name:r.name, item:match, demand, onHand, toProduce, batches:null, cost:0, rec:null,
                      status: toProduce>0 ? 'no_recipe_short' : 'ready' });
      if(toProduce>0) unmatched.push({name:r.name, qty:toProduce, unit:r.unit, reason:'مالوش وصفة إنتاج — لازم يتورّد جاهز'});
      return;
    }

    const batches = toProduce>0 ? toProduce/rec.outQty : 0;
    const cost = n2(recipeCost(rec) * batches);
    products.push({ name:r.name, item:match, demand, onHand, toProduce, batches:n2(batches), cost, rec,
                    status: toProduce>0 ? 'produce' : 'ready' });

    if(batches>0){
      rec.lines.forEach(l=>{
        const li = item(l.itemId); if(!li) return;
        if(!needed[l.itemId]) needed[l.itemId]={it:li, qty:0};
        needed[l.itemId].qty = n2(needed[l.itemId].qty + l.qty*batches);
      });
    }
  });

  const rows = Object.values(needed).map(n=>{
    const bal = calc(n.it).book;
    const short = n2(Math.max(0, n.qty-bal));
    return {...n, bal, short, shortCost: n2(short*(n.it.price||0)) };
  }).sort((a,b)=> b.short - a.short || a.it.name.localeCompare(b.it.name,'ar'));

  products.sort((a,b)=> b.toProduce - a.toProduce);
  return {products, rows, unmatched};
}

/* ================= مقارنة الصرف الفعلي (استيراد شيت مبيعات/صرف مجمّع) ================= */
// الشيت المتوقع: تاريخ | اسم الصنف | الوحدة | الكمية — كل سطر عملية واحدة، ومفيش عمود فرع،
// فبنجمع كل الأسطر بنفس اسم الصنف عشان نطلع الإجمالي الفعلي، ونقارنه بالمطلوب والمسجل عندنا
let ACTUAL_PARSED = null; // {byBranchItem, hasBranch, branches, dateFrom, dateTo, rowsCount, errors}
let CMP_Q = ''; // بحث في شاشة المقارنة

function parseDateFlexible(s){
  s = String(s||'').trim();
  s = s.split(/[T ]/)[0]; // نشيل أي وقت ملحق بالتاريخ (زي "9/10/2026 0:00:00" أو "2026-09-10 00:00:00")
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // M/D/YYYY
  if(m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // YYYY-M-D
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); // D-M-YYYY
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

// كلمات مفتاحية للتعرف على كل عمود من اسمه، بغض النظر عن ترتيبه في الشيت
const COL_KEYWORDS = {
  branch: ['فرع','account','branch'],
  date:   ['تاريخ','date','issue'],
  name:   ['صنف','منتج','item','name','product'],
  unit:   ['وحده','وحدة','unit'],
  qty:    ['كميه','كمية','qty','quantity'],
};
function detectColumnMap(headerCells){
  const map = {};
  headerCells.forEach((cell,i)=>{
    const norm = String(cell||'').trim().toLowerCase();
    if(!norm) return;
    for(const [field,keywords] of Object.entries(COL_KEYWORDS)){
      if(map[field]!==undefined) continue; // أول عمود يطابق الكلمة المفتاحية بس اللي بياخده
      if(keywords.some(k=>norm.includes(k))){ map[field]=i; break; }
    }
  });
  // لازم نلاقي على الأقل صنف وكمية عشان نعتبره صف عناوين حقيقي
  return (map.name!==undefined && map.qty!==undefined) ? map : null;
}

// نسخة async بتعالج على دفعات صغيرة (بدل حلقة واحدة طويلة) عشان المتصفح يفضل مستجيب مهما كان حجم البيانات،
// وبتنادي onProgress كل دفعة عشان نعرض تقدّم حقيقي بدل رسالة ثابتة
async function parseActualDispenseSheetAsync(text, onProgress){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));

  // وقف أمان: لو الشيت فيه صفوف أكتر بكتير من المعقول (زي بقايا تنسيق قديمة في ملفات إكسل)، نحذّر بدل ما نعالج آلاف الصفوف الفاضية
  if(lines.length > 100000){
    return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[],
      errors:[`الشيت فيه ${lines.length.toLocaleString('en-US')} سطر — ده أكتر من المتوقع بكتير وممكن يبقى فيه بيانات فاضية زيادة من الملف. راجع الملف الأول.`]};
  }

  let colMap = detectColumnMap(firstCells);
  let start = colMap ? 1 : 0;
  if(!colMap){
    const hasBranch = firstCells.length>=5 && !parseDateFlexible(firstCells[0]) && parseDateFlexible(firstCells[1])!=='';
    colMap = hasBranch ? {branch:0,date:1,name:2,unit:3,qty:4} : {date:0,name:1,unit:2,qty:3};
    start = parseDateFlexible(firstCells[colMap.date]) ? 0 : 1;
  }

  const hasBranch = colMap.branch!==undefined;
  const byBranchItem = {};
  const byDateBranchItem = {};
  const branchesSet = new Set();
  const errors = [];
  let dateFrom='', dateTo='';
  let rowsCount=0;

  const CHUNK = 500; // نعالج 500 سطر ونوقف نلحق نفَس للمتصفح، بدل ما نكمل مليون سطر مرة واحدة
  const t0 = Date.now();
  const HARD_LIMIT_MS = 30000; // لو المعالجة عدت 30 ثانية، نوقف بدل ما نسيب المتصفح معلّق للأبد

  for(let i=start;i<lines.length;i++){
    const cells = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const branch = hasBranch ? (cells[colMap.branch]||'—') : '—';
    const rawDate = colMap.date!==undefined ? cells[colMap.date] : '';
    const name    = cells[colMap.name];
    const unit    = colMap.unit!==undefined ? cells[colMap.unit] : '';
    const qty     = cells[colMap.qty];
    if(name){
      const date = parseDateFlexible(rawDate);
      const q = +qty;
      if(!(q>0)){ if(errors.length<20) errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); }
      else{
        branchesSet.add(branch);
        if(!byBranchItem[branch]) byBranchItem[branch]={};
        if(!byBranchItem[branch][name]) byBranchItem[branch][name] = { name, unit: unit||'', qty:0, rows:0 };
        byBranchItem[branch][name].qty = n2(byBranchItem[branch][name].qty + q);
        byBranchItem[branch][name].rows++;
        rowsCount++;
        if(date){
          if(!byDateBranchItem[date]) byDateBranchItem[date]={};
          if(!byDateBranchItem[date][branch]) byDateBranchItem[date][branch]={};
          if(!byDateBranchItem[date][branch][name]) byDateBranchItem[date][branch][name]={name,unit:unit||'',qty:0};
          byDateBranchItem[date][branch][name].qty = n2(byDateBranchItem[date][branch][name].qty + q);
          if(!dateFrom || date<dateFrom) dateFrom=date; if(!dateTo || date>dateTo) dateTo=date;
        }
      }
    }

    if(i % CHUNK === 0){
      if(Date.now()-t0 > HARD_LIMIT_MS){
        errors.push(`⚠️ المعالجة وقفت بعد 30 ثانية عشان ماتجمّدش المتصفح — اتعالج ${i} من ${lines.length} سطر بس. الشيت كبير جدًا، جرّب تقسمه لأجزاء أصغر.`);
        break;
      }
      if(onProgress) onProgress(Math.round((i/lines.length)*100));
      await new Promise(r=>setTimeout(r,0)); // نسيب نفَس للمتصفح يرسم ويستجيب قبل ما نكمل الدفعة اللي بعدها
    }
  }
  if(onProgress) onProgress(100);
  return {byBranchItem, byDateBranchItem, hasBranch, branches:[...branchesSet].sort((a,b)=>a.localeCompare(b,'ar')), dateFrom, dateTo, rowsCount, errors};
}
// النسخة القديمة المتزامنة لسه موجودة لأي استخدام تاني في النظام محتاجها بشكل مباشر
function parseActualDispenseSheet(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));

  // أولوية أولى: نحاول نتعرف على الأعمدة من عناوينها (بيشتغل مهما كان ترتيب الأعمدة في الشيت)
  let colMap = detectColumnMap(firstCells);
  let start = colMap ? 1 : 0;

  // لو مفيش صف عناوين واضح، نرجع للتخمين بالترتيب القديم كحل بديل (توافق مع شيتات قديمة)
  if(!colMap){
    const hasBranch = firstCells.length>=5 && !parseDateFlexible(firstCells[0]) && parseDateFlexible(firstCells[1])!=='';
    colMap = hasBranch ? {branch:0,date:1,name:2,unit:3,qty:4} : {date:0,name:1,unit:2,qty:3};
    const dateColIdx = colMap.date;
    start = parseDateFlexible(firstCells[dateColIdx]) ? 0 : 1;
  }

  const hasBranch = colMap.branch!==undefined;
  const byBranchItem = {}; // branch -> { itemName -> {name,unit,qty,rows} }
  const byDateBranchItem = {}; // date -> branch -> itemName -> {name,unit,qty}
  const branchesSet = new Set();
  const errors = [];
  let dateFrom='', dateTo='';
  let rowsCount=0;

  for(let i=start;i<lines.length;i++){
    const cells = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const branch = hasBranch ? (cells[colMap.branch]||'—') : '—';
    const rawDate = colMap.date!==undefined ? cells[colMap.date] : '';
    const name    = cells[colMap.name];
    const unit    = colMap.unit!==undefined ? cells[colMap.unit] : '';
    const qty     = cells[colMap.qty];
    if(!name) continue;
    const date = parseDateFlexible(rawDate);
    const q = +qty;
    if(!(q>0)){ if(errors.length<20) errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); continue; }
    branchesSet.add(branch);
    if(!byBranchItem[branch]) byBranchItem[branch]={};
    if(!byBranchItem[branch][name]) byBranchItem[branch][name] = { name, unit: unit||'', qty:0, rows:0 };
    byBranchItem[branch][name].qty = n2(byBranchItem[branch][name].qty + q);
    byBranchItem[branch][name].rows++;
    rowsCount++;
    // بنحافظ على تفاصيل كل يوم لوحده كمان (مش بس الإجمالي)، عشان عملية "الاستبدال الكامل" تقدر تسجّل كل يوم بتاريخه الحقيقي
    if(date){
      if(!byDateBranchItem[date]) byDateBranchItem[date]={};
      if(!byDateBranchItem[date][branch]) byDateBranchItem[date][branch]={};
      if(!byDateBranchItem[date][branch][name]) byDateBranchItem[date][branch][name]={name,unit:unit||'',qty:0};
      byDateBranchItem[date][branch][name].qty = n2(byDateBranchItem[date][branch][name].qty + q);
    }
    if(date){ if(!dateFrom || date<dateFrom) dateFrom=date; if(!dateTo || date>dateTo) dateTo=date; }
  }
  return {byBranchItem, byDateBranchItem, hasBranch, branches:[...branchesSet].sort((a,b)=>a.localeCompare(b,'ar')), dateFrom, dateTo, rowsCount, errors};
}

function buildDispenseComparison(){
  if(!ACTUAL_PARSED) return null;
  const {byBranchItem, hasBranch, branches, dateFrom, dateTo} = ACTUAL_PARSED;
  const norm = s => String(s||'').trim().toLowerCase();

  // المسجل فعليًا عندنا في المصنع (صرف للفروع) في نفس مدى التواريخ، مقسّم بالفرع (m.party) والصنف
  const recordedByBranchItem = {};
  if(dateFrom && dateTo){
    S.moves.filter(m=>m.dir==='out' && m.reason==='صرف للفروع' && m.date>=dateFrom && m.date<=dateTo).forEach(m=>{
      const it=item(m.itemId); if(!it) return;
      const br = hasBranch ? (m.party||'—') : '—';
      if(!recordedByBranchItem[br]) recordedByBranchItem[br]={};
      recordedByBranchItem[br][it.name] = n2((recordedByBranchItem[br][it.name]||0) + (+m.qty||0));
    });
  }

  // المطلوب من طلبيات الفروع — لو عندنا تفاصيل الطلبيات بالفرع (BO.orders) نطابق بالفرع، وإلا نرجع للإجمالي العام بس
  const findRequested = (branch, itemName) => {
    if(hasBranch && BO.orders && BO.orders.length){
      const order = BO.orders.find(o=>norm(o.branch)===norm(branch));
      if(order){ const line=(order.items||[]).find(x=>norm(x.name)===norm(itemName)); return line ? +line.qty : null; }
      return null;
    }
    const entry = Object.entries(BO.totals||{}).find(([n])=>norm(n)===norm(itemName));
    return entry ? entry[1].qty : null;
  };

  const rows = [];
  Object.entries(byBranchItem).forEach(([branch, items])=>{
    Object.values(items).forEach(actual=>{
      const match = findMatchingLocalItem(actual.name);
      const recorded = match ? ((recordedByBranchItem[branch]||{})[match.name]||0) : 0;
      const requested = findRequested(branch, actual.name);
      const diff = n2(actual.qty - recorded);
      rows.push({ branch, ...actual, match, recorded, requested, diff });
    });
  });
  rows.sort((a,b)=> Math.abs(b.diff)-Math.abs(a.diff));

  return { rows, hasBranch, branches, dateFrom, dateTo };
}

}

function extraItemsList(){
  const norm = s => String(s||'').trim().toLowerCase();
  const known = new Set([...CORE_ITEMS, ...APPETIZER_ITEMS, ...NADER_SAUCES].map(x=>norm(x.name)));
  const seen = new Set(); const list = [];
  BO.orders.forEach(o=>(o.items||[]).forEach(it=>{
    const n = norm(it.name);
    if(known.has(n) || seen.has(n)) return;
    seen.add(n);
    list.push({ label: it.name, name: it.name });
  }));
  return list.sort((a,b)=>a.label.localeCompare(b.label,'ar'));
}

function boMatrixHtml(itemsList, title){

  // بحث بيفلتر الأصناف (الأعمدة) والفروع (الصفوف) مع بعض — عشان توصل بسرعة للخانة اللي عايز تعدلها
  const q = String(BO.matrixQ||'').trim().toLowerCase();
  const cols = q ? itemsList.filter(ci=> ci.label.toLowerCase().includes(q) || ci.name.toLowerCase().includes(q)) : itemsList;
  const matchedBranches = q ? allBranches.filter(b=>b.toLowerCase().includes(q)) : [];
  // لو البحث طابق أصناف، نعرض كل الفروع. لو طابق فروع بس، نعرض الفروع دي بكل الأصناف
  const branches = (q && cols.length===0 && matchedBranches.length) ? matchedBranches : allBranches;
  const showCols = (q && cols.length===0 && matchedBranches.length) ? itemsList : cols;

  const totalsCol = {}; showCols.forEach(ci=>totalsCol[ci.name]=0);
  let body='';
  branches.forEach(br=>{
    const oi = BO.orders.findIndex(o=>o.branch===br);
    const o = BO.orders[oi];
    body += `<tr><td><div class="iname">${esc(br)}</div></td>`;
    showCols.forEach(ci=>{
      const ji = (o.items||[]).findIndex(x=>x.name===ci.name);
      const qty = ji>=0 ? o.items[ji].qty : '';
      if(ji>=0) totalsCol[ci.name] += (+o.items[ji].qty||0);
      body += `<td class="n"><input type="number" step="any" min="0" value="${qty}" placeholder="—"
        data-bocell="${oi}:${esc(ci.name)}" style="padding:4px 5px;font-size:12px;width:62px;text-align:center"></td>`;
    });
    body += '</tr>';
  });

  const noResult = q && showCols.length===0 && branches.length===0;

  return `<div class="panel">
    <h2>${title} <em>${branches.length} فرع · ${showCols.length} صنف</em>
      <span class="hint" style="margin-inline-start:auto">أي تعديل بيتكتب فعليًا في طلبية الفرع</span></h2>
    <div class="pad">
      <div class="bar">
        <input type="text" class="grow" id="bo-matrix-q" placeholder="دور باسم الصنف أو الفرع…" value="${esc(BO.matrixQ||'')}">
        ${q?`<button class="btn sm" data-act="bo-matrix-clear">مسح البحث</button>`:''}
      </div>
    </div>
    ${noResult?`<div class="empty">مفيش صنف ولا فرع مطابق للبحث</div>`:`
    <div class="tblwrap"><table class="gridcols" style="min-width:${Math.max(420, 180 + showCols.length*90)}px">
      <thead><tr><th>الفرع</th>${showCols.map(ci=>`<th class="n" style="font-size:11px">${esc(ci.label)}</th>`).join('')}</tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr style="font-weight:700"><td>الإجمالي</td>${showCols.map(ci=>`<td class="n hl">${totalsCol[ci.name]?fmt(n2(totalsCol[ci.name])):'—'}</td>`).join('')}</tr></tfoot>
    </table></div>`}
  </div>`;
}

    if(!empty.length) return toast('كل الأصناف متعدّة');
    const sample=empty.slice(0,8).map(i=>'• '+i.name).join('\n');
    if(!confirm(`${empty.length} صنف لسه ما اتكتبلوش رقم:\n${sample}${empty.length>8?`\n… و${empty.length-8} كمان`:''}\n\nهيتسجلوا «صفر» (يعني مش موجودين في المخزن). اتأكد إنك عدّيت كل حاجة الأول.\n\nتكمل؟`)) return;
    empty.forEach(it=>{ S.counts[it.id]=0; COUNT_TOUCHED[it.id]=Date.now(); });
    await saveTx(); toast(`اتسجل صفر لـ ${empty.length} صنف`); return render();
  }
  if(a==='settle-count-now'){
    const counted = S.items.filter(it=>S.counts[it.id]!==undefined);
    const withDiff = counted.filter(it=>Math.abs(calc(it).diff)>0.001);
    if(!withDiff.length) return toast('مفيش فروق تتسوّى',1);
    const preview = withDiff.slice(0,10).map(it=>{ const c=calc(it); return `• ${it.name}: ${c.diff>0?'+':''}${fmt(c.diff)} ${it.unit}`; }).join('\n');
    if(!confirm(`هيتم تسجيل ${withDiff.length} حركة تصحيح بتاريخ النهاردة عشان الرصيد الدفتري يطابق اللي عددته:\n\n${preview}${withDiff.length>10?`\n… و${withDiff.length-10} كمان`:''}\n\nالشهر مش هيتقفل ولا الفترة هتتغيّر — بس الأرقام هتتظبط من دلوقتي. تكمل؟`)) return;
    const d = today();
    const batchId = uid('settle'); // بيربط كل حركات التسوية دي مع بعض عشان نقدر نطبع سجلها حتى بعد ما الفرق يرجع صفر
    const snapshot = []; // نسخة ثابتة من الفروق وقت التسوية، تفضل صالحة للطباعة حتى بعد ما الرصيد يتساوى
    withDiff.forEach(it=>{
      const c = calc(it);
      snapshot.push({name:it.name, unit:it.unit, book:c.book, actual:S.counts[it.id], diff:c.diff, value:n2(c.diff*(it.price||0))});
      if(c.diff>0){ S.moves.push({id:uid('m'),dir:'in',itemId:it.id,qty:n2(c.diff),date:d,price:+it.price||0,party:'تسوية جرد (تلقائي)',reason:'',settleBatch:batchId}); }
      else { S.moves.push({id:uid('m'),dir:'out',itemId:it.id,qty:n2(-c.diff),date:d,price:0,party:'',reason:'تسوية جرد',settleBatch:batchId}); }
    });
    await saveTx();
    // بنحفظ سجل التسوية دي في القاعدة (مش بس في الذاكرة) عشان يفضل موجود حتى لو قفلت الصفحة وفتحتها تاني بعدين
    try{
      const rows = await sb('stock_settings?'+fEq()+'&k=eq.settlements&select=v',{prefer:'return=representation'});
      const list = (rows && rows[0] && rows[0].v && rows[0].v.list) || [];
      list.unshift({ date:d, items:snapshot, takenAt:new Date().toISOString() });
      await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:'settlements',v:{list:list.slice(0,20)}}]});
    }catch(e){ /* فشل الحفظ التاريخي ما يوقفش التسوية نفسها، هي اتسجلت خلاص */ }
    toast(`اتسوّت ${withDiff.length} صنف — الرصيد الدفتري بقى مطابق للفعلي من دلوقتي`);
    render();
    if(confirm('التسوية اتسجلت ✓\n\nتمسح أرقام الجرد دي من الورقة، عشان الجرد الجاي (للمدير أو ليك) يبدأ على ورقة فاضية؟')){
      const keep=window.confirm; window.confirm=()=>true; try{ await act('count-reset',{}); } finally{ window.confirm=keep; }
    }
    return;
  }
  if(a==='close-month'){
    { const empty=S.items.filter(it=>S.counts[it.id]===undefined).length;
      if(!confirm(`إقفال ${periodLabel(S.period)}؟ الجرد الفعلي هيبقى أول المدة للشهر الجاي.`+
        (empty?`\n\n⚠️ فيه ${empty} صنف ما اتكتبلوش رقم في الجرد — هياخدوا رصيدهم الدفتري زي ما هو (مش صفر).\nلو دول مش موجودين فعلًا، دوس «إلغاء» ودوس «اللي فاضي = صفر» الأول.`:''))) return; }
    const t=totals(); const closedPeriod=S.period; const closedMoves=S.moves.filter(m=>m.dir==='in'&&m.invoice).map(m=>({...m}));
    S.closed.push({period:closedPeriod,value:t.value,date:today(),
      items:S.items.map(i=>({id:i.id,name:i.name,unit:i.unit,openingBefore:i.opening,closing:(S.counts[i.id]!==undefined?+S.counts[i.id]:calc(i).book),price:i.price}))});
    for(const it of S.items){ const c=calc(it); it.opening = c.has? c.real : c.book; }
    S.moves=[]; S.counts={}; S.runs=[];
    const [y,m]=closedPeriod.split('-').map(Number); const nd=new Date(y,m,1);
    S.period=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    await saveMain(); await saveTx(); await sset(KEY_HIST,{periods:S.closed});
    toast('الشهر اتقفل — بدأنا '+periodLabel(S.period)); render();
    if(DB.on){
      try{
        toast('بيجهّز ملف صور فواتير '+periodLabel(closedPeriod)+'…');
        const r = await invoiceArchiveRun(closedPeriod, closedMoves);
        const msg = invoiceArchiveSummary(r); if(msg) toast(msg);
      }catch(e){ alert('الشهر اتقفل تمام، بس أرشفة صور الفواتير ما خلصتش:\n'+e.message+'\n\nتقدر تعيدها من «أرشيف الفواتير» ← «أرشِف الشهور المقفولة».'); }
    }
    return;
  }
  if(a==='archive-size'){
    if(!DB.on) return toast('لازم تكون متصل بالقاعدة الأول',1);
    const period = d.period;
    try{
      const mv = await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(period)+'&select=id',{prefer:'return=representation'}) || [];
      ARCHIVE_SIZES[period] = mv.length;
      render();
    }catch(e){ toast('تعذر الحساب: '+e.message,1); }
    return;
  }
  if(a==='archive-delete'){
    if(!DB.on) return toast('لازم تكون متصل بالقاعدة الأول',1);
    const period = d.period;
    const n = ARCHIVE_SIZES[period];
    const label = periodLabel(period);
    if(!confirm(`هيتم حذف ${n} حركة تفصيلية من شهر ${label} نهائيًا من قاعدة البيانات.\n\nقيمة المخزون النهائية للشهر ده هتفضل محفوظة في الأرشيف، بس مش هتقدر تشوف تفاصيل الحركات ولا تعمل "تراجع عن الإقفال" ليه بعد كده.\n\nمتأكد؟`)) return;
    const typed = prompt(`للتأكيد النهائي، اكتب اسم الشهر بالظبط زي ما هو ظاهر:\n\n${label}`);
    if(typed !== label){ toast('الاسم مطابقش، اتلغت العملية',1); return; }
    try{
      await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(period),{method:'DELETE'});
      await sb('stock_counts?'+fEq()+'&period=eq.'+encodeURIComponent(period),{method:'DELETE'});
      delete ARCHIVE_SIZES[period];
      toast(`اتحذفت حركات شهر ${label}`);
      render();
    }catch(e){ toast('حصل خطأ أثناء الحذف: '+e.message,1); }
    return;
  }
  if(a==='undo-close'){
    if(!S.closed.length) return;
    const last = S.closed[S.closed.length-1];
    if(!confirm(`تراجع عن إقفال ${periodLabel(last.period)}؟ هيرجّع الوارد والمنصرف والجرد اللي كان مسجّل وقتها، ويشيل الإقفال ده من الأرشيف.`)) return;
    DB.busy=true; render();
    try{
      let mv=[], ct=[];
      if(DB.on){
        mv = await sb('stock_moves?factory=eq.'+encodeURIComponent(FACTORY)+'&period=eq.'+encodeURIComponent(last.period)+'&select=*',{prefer:'return=representation'}) || [];
        ct = await sb('stock_counts?factory=eq.'+encodeURIComponent(FACTORY)+'&period=eq.'+encodeURIComponent(last.period)+'&select=*',{prefer:'return=representation'}) || [];
      }
      const snapMap = {}; last.items.forEach(x=>snapMap[x.id]=x);
      for(const it of S.items){
        const snap = snapMap[it.id];
        if(snap && snap.openingBefore!==undefined && snap.openingBefore!==null){
          it.opening = snap.openingBefore;   // القيمة الدقيقة المحفوظة وقت الإقفال
        }else{
          // إقفال قديم من غير قيمة محفوظة — نرجع بأفضل تقدير (الرصيد الحالي ناقص صافي حركة الشهر)
          let net=0;
          for(const m of mv){ if(m.item_id===it.id){ net += (m.dir==='in'? +m.qty : -m.qty); } }
          it.opening = n2(it.opening - net);
        }
      }
      S.moves = mv.map(m=>({id:m.id,dir:m.dir,itemId:m.item_id,qty:+m.qty,price:+m.price,party:m.party,reason:m.reason,date:m.move_date}));
      S.counts = {}; ct.forEach(c=>S.counts[c.item_id]=+c.qty);
      S.runs = [];
      S.period = last.period;
      S.closed = S.closed.slice(0,-1);
      if(DB.on){
        try{ await sb('stock_periods?'+fEq()+'&period=eq.'+encodeURIComponent(last.period),{method:'DELETE'}); }catch(e){}
      }
      await saveMain(); await saveTx(); await sset(KEY_HIST,{periods:S.closed});
      DB.busy=false;
      toast('اترجعنا لـ '+periodLabel(S.period)+' — راجع الأرقام قبل ما تقفل تاني');
    }catch(e){ DB.busy=false; toast('التراجع فشل: '+e.message,1); }
    return render();
  }
  if(a==='check-db-size'){
    if(!DB.on || DB_SIZE_CHECKING) return;
    DB_SIZE_CHECKING=true; render();
    const tables = [
      ['stock_items','الأصناف'],['stock_moves','الحركات (وارد/منصرف)'],['stock_counts','سطور الجرد'],
      ['stock_recipes','الوصفات'],['stock_runs','تشغيلات الإنتاج'],['stock_periods','الشهور المقفولة'],['stock_settings','الإعدادات والإشعارات']
    ];
    try{
      const counts = await Promise.all(tables.map(([t])=>sbCount(t).catch(()=>null)));
      const rows = tables.map(([t,label],i)=>({name:label, count: counts[i]==null? 0 : counts[i], failed: counts[i]==null}));
      const total = rows.reduce((s,r)=>s+r.count,0);
      const biggest = rows.slice().sort((a,b)=>b.count-a.count)[0] || {name:'—',count:0};
      DB_SIZE_INFO = { rows, total, biggest, checkedAt: new Date().toLocaleString(LANG==='en'?'en-GB':'ar-EG') };
    }catch(e){ toast('حصل خطأ أثناء الفحص: '+e.message,1); }
    DB_SIZE_CHECKING=false; render();
    return;
  }
  if(a==='db-retry'){
    DB.busy=true; render();
    const ok=await connectDB();
    if(ok){ await loadFactories(); await pullAll(true); }
    DB.busy=false; render();
    return toast(ok?'الاتصال تمام':'لسه مش شغال',!ok);
  }
  if(a==='db-push'){ return void pushAll(false); }
  if(a==='switch-fac'){
    location.search = (QS.get('manager')!==null?'?manager&':'?') + 'factory=' + encodeURIComponent(d.id);
    return;
  }
  if(a==='add-fac'){
    const name=$('#new-fac-name').value.trim();
    if(!name) return toast('اكتب اسم المصنع',1);
    const id=name.trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'-').replace(/^-+|-+$/g,'')||('f'+Date.now());
    if(FACTORIES.some(f=>f.id===id)) return toast('فيه مصنع بنفس الاسم قبل كده',1);
    try{ await addFactory(id,name); toast('اتضاف — بتنقل ليه دلوقتي'); location.search='?factory='+encodeURIComponent(id); }
    catch(e){ toast('فشلت الإضافة: '+e.message,1); }
    return;
  }
  if(a==='copy-link'){
    const el=$('#mgr-link'); el.select();
    try{ await navigator.clipboard.writeText(el.value); toast('اتنسخ الرابط'); }
    catch(e){ document.execCommand('copy'); toast('اتنسخ الرابط'); }
    return;
  }
  if(a==='db-pull-quiet'){ await pullAll(true); return render(); }
  if(a==='mgr-submit'){
    DB.busy=true; render();
    const ok=await pushAll(true);
    DB.busy=false;
    if(ok){
      S.submittedAt=new Date().toLocaleString('en-GB');
      try{ await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:'manager_submission',v:{at:S.submittedAt,period:S.period}}]}); }catch(e){}
      toast('اتبعت الجرد لصاحب المصنع');
    }
    return render();
  }
  if(a==='db-pull'){ if(!confirm('هيتم استبدال البيانات اللي على الجهاز ده باللي في القاعدة. متأكد؟')) return; return void pullAll(); }
  if(a==='backup'){
    const data={v:1,savedAt:new Date().toISOString(),period:S.period,items:S.items,recipes:S.recipes,
      locks:S.locks,moves:S.moves,counts:S.counts,runs:S.runs||[],closed:S.closed};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    const a3=document.createElement('a'); a3.href=url; a3.download=`نسخة-احتياطية-مخزن-${S.period}.json`; a3.click(); URL.revokeObjectURL(url);
    BK.dirty=0; BK.lastAt=new Date().toLocaleString('en-GB');
    toast('النسخة الاحتياطية اتنزّلت — احفظها في مكان ثابت'); return render();
  }
  if(a==='export'){
    const rows=[['الصنف','الوصف','القسم','الوحدة','أول المدة','وارد','منصرف','دفتري','فعلي','الفرق','سعر الوحدة','القيمة']];
    for(const it of S.items){const c=calc(it);
      rows.push([it.name,it.desc,it.cat,it.unit,it.opening,c.inQ,c.outQ,c.book,c.has?c.real:'',c.has?c.diff:'',it.price||0,c.value]);}
    const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a2=document.createElement('a'); a2.href=url; a2.download=`جرد-${S.period}.csv`; a2.click(); URL.revokeObjectURL(url);
    return toast('اتنزّل الملف');
  }
  if(a==='reset'){
    if(!confirm('هيتم مسح كل الحركات والأسعار والرجوع لبيانات جرد شهر 7 الأصلية. متأكد؟')) return;
    try{ await window.storage.delete(KEY_MAIN); await window.storage.delete(KEY_TX); await window.storage.delete(KEY_HIST);}catch(e){}
    S={items:[],recipes:[],period:'',closed:[],moves:[],counts:{}}; await load(); toast('اترجع للأصل'); return render();
  }
}
 
async function boot(){
  if(QS.has('branch')) return branchPortal(); // صفحة طلبيات الفروع: من غير حساب — الفرع بيدخل بالباسورد بتاعه
  try{ if(!(await authGate())) return; }
  catch(e){ console.error(e); renderLogin('مشكلة في الاتصال: '+e.message); return; }
  try{ await load(); }
  catch(e){
    console.error(e);
    STORAGE_OK=false;
    if(ROLE!=='manager' && (!S.items || !S.items.length)){
      S.items = SEED.map(x=>({...x, opening:x.qty, price:x.price||0, min:0}));
      S.recipes=[]; S.locks={}; S.period='2026-07';
    }
  }
  try{ render(); }
  catch(e){ console.error(e); document.getElementById('root').innerHTML='<div class="boot">مشكلة في العرض: '+esc(e.message)+'</div>'; }
  if(DB.on){ fetchFactoryInbox(FACTORY).then(list=>{ MY_INBOX=list; if(pendingInboxCount()) render(); }); }
  if(ROLE==='owner' && DB.on){
    setInterval(async ()=>{
      const typing = document.activeElement && document.activeElement.hasAttribute('data-count');
      // كان التحديث التلقائي مقصور على تبويب الجرد بس — وسّعناه لكل الشاشات اللي بتعتمد على بيانات حية
      // (وارد، منصرف، طلبيات الفروع، استلام من مصانع) عشان صاحب النظام يشوف أي حركة يسجّلها المدير من غير ما يعمل ريفريش يدوي
      const liveTabs = ['count','in','out','branchorders','inbox','dailystock','korders'];
      // لو المستخدم واقف في أي خانة (بيختار صنف أو بيكتب كمية/سعر) ما نحدّثش الشاشة خالص — كانت بتمسح الصنف اللي اختاره
      const ae=document.activeElement, inField = ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName) && ae.id!=='lang-select';
      if(liveTabs.includes(tab) && !typing && !inField && !SUBMITTING && !DB.busy && !ui.modal){
        const draft=captureMoveDraft();
        await pullAll(true);
        const ae2=document.activeElement; // ممكن يكون بدأ يكتب وإحنا بنسحب
        if((ae2 && /^(INPUT|SELECT|TEXTAREA)$/.test(ae2.tagName) && ae2.id!=='lang-select') || SUBMITTING) return;
        render(); restoreMoveDraft(draft);
      }
    }, 25000);
  }
}
boot();
window.addEventListener('beforeunload', e => {
  // بنحذّر لو فيه أي حاجة لسه ما اتحفظتش: مزامنة شغالة، أو رفع مؤجل لسه ما اتنفذش، أو تعديلات محلية بس
  if(PENDING_SYNCS>0 || DB.busy || (DB.on && DB.dirty) || (BK.dirty>0 && MODE!=='cloud' && !DB.on)){
    e.preventDefault(); e.returnValue = '';
  }
});
</script>
