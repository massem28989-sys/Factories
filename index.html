:root{
  --bg:#E8ECEE; --surface:#fff; --ink:#14181C; --brand:#14181C; --brand-bg:#EEF1F3; --muted:#69747E; --line:#CFD8DD;
  --green:#2E6B4F; --amber:#A96A0E; --red:#B23B2E; --blue:#23506E;
  --greenbg:#E4EFE8; --amberbg:#F7EDDC; --redbg:#F6E4E1; --bluebg:#E3EBF1;
  --r:10px;
}
*{box-sizing:border-box}
#root{
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; padding:0 0 60px;
  font-size:14px; line-height:1.5;
}
.boot{padding:40px;text-align:center;color:var(--muted)}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; direction:ltr; display:inline-block}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
 
/* ---------- header ---------- */
header{background:var(--brand);color:#fff;padding:14px 0 0}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px}
.warnbar{background:#B87514;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:8px;margin-bottom:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#93A0AA;letter-spacing:0}
.hstat{margin-inline-start:auto;display:flex;gap:22px;flex-wrap:wrap}
.hstat div{text-align:center}
.hstat b{display:block;font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr}
.hstat span{font-size:11px;color:#93A0AA}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:13.5px}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
nav .lk{font-size:11px;margin-inline-end:5px;opacity:.85}
nav .lk.open{opacity:.5}
nav.subnav{background:rgba(0,0,0,.16);border-radius:8px;margin-top:6px;padding:2px}
nav.subnav button{padding:7px 12px;font-size:12.5px;border-bottom:0;border-radius:6px;color:rgba(255,255,255,.7)}
nav.subnav button.on{background:#fff;color:var(--brand);border-bottom:0}
.lockrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #EDF1F3;flex-wrap:wrap}
.lockrow:last-child{border-bottom:0}
.lockrow .nm{font-weight:500;flex:1 1 150px}
 
/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.panel>h2{font-size:14.5px;font-weight:700;padding:12px 14px;border-bottom:2px solid var(--brand-bg);background:#F6F8F9;display:flex;align-items:center;gap:10px}
.panel>h2 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.pad{padding:14px}
 
/* ---------- ledger strip (signature) ---------- */
.ledger{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;flex-wrap:wrap}
.ledger .cell{flex:1 1 110px;padding:10px 12px;border-inline-start:1px solid var(--line);min-width:0}
.ledger .cell:first-child{border-inline-start:0}
.ledger .op{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;background:#F6F8F9;border-inline-start:1px solid var(--line)}
.ledger .k{font-size:11px;color:var(--muted);white-space:nowrap}
.ledger .v{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:start}
.ledger .cell.book{background:var(--bluebg)}
.ledger .cell.real{background:#F6F8F9}
.ledger .cell.diff.ok{background:var(--greenbg)} .ledger .cell.diff.ok .v{color:var(--green)}
.ledger .cell.diff.bad{background:var(--redbg)} .ledger .cell.diff.bad .v{color:var(--red)}
 
/* ---------- table ---------- */
.tblwrap{overflow:auto;max-height:min(66vh,720px)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#F6F8F9;text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:7px 10px;border-bottom:1px solid #EDF1F3;vertical-align:middle}
tbody tr:hover{background:#FAFCFC}
tr.catrow td{background:#EEF2F4;color:var(--muted);font-weight:600;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.catrow:hover td{background:#EEF2F4}
input.cell.syncing{background:#FCF6EA;border-color:#EDD9AE}
input.cell.sync-err{background:#F6E4E1;border-color:#E6C6C1}
td.n{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:end}
/* فواصل رأسية للأعمدة الرقمية عشان كل رقم يبان تحت عنوانه بالظبط */
table.gridcols th, table.gridcols td{border-inline-start:1px solid #EDF1F3}
table.gridcols th:first-child, table.gridcols td:first-child{border-inline-start:none}
table.gridcols td.n{padding-inline:14px}
table.gridcols th.n{padding-inline:14px}
table.gridcols td.hl{background:#F7FAFB;font-weight:700}
table.gridcols tbody tr:hover td.hl{background:#EEF4F6}
.iname{font-weight:500}
.idesc{font-size:11px;color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:#EEF2F4;color:var(--muted);white-space:nowrap}
.chip.g{background:var(--greenbg);color:var(--green)} .chip.a{background:var(--amberbg);color:var(--amber)}
.chip.r{background:var(--redbg);color:var(--red)} .chip.b{background:var(--brand-bg);color:var(--brand)}
.lowrow{background:var(--redbg)}
.pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--muted)}
 
/* ---------- controls ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFDFD}
.cattabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.cattab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cattab:hover{background:var(--brand-bg)}
.cattab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cattab .ct-n{opacity:.75;font-weight:400}
input[type=text],input[type=number],input[type=date],select{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
input.cell{width:88px;text-align:start;font-family:'IBM Plex Mono',monospace;direction:ltr;padding:5px 7px}
input.cell.filled{border-color:var(--green);background:#F4FAF6}
.grow{flex:1 1 180px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;color:var(--ink)}
.btn:hover{background:#F2F6F7}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#2A333B}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#E6C6C1}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
 
/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:23px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;margin-top:3px}
.card .s{font-size:11.5px;color:var(--muted);margin-top:2px}
 
/* ---------- toast / modal ---------- */
#toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--brand);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(15,22,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line);background:#FAFCFC}
.rlines{display:flex;flex-direction:column;gap:7px}
.rline{display:flex;gap:7px;align-items:center}
.rline select{flex:1 1 auto;min-width:0}
@media(max-width:640px){
  .hstat{width:100%;margin:0;gap:14px;justify-content:space-between}
  .ledger .cell{flex:1 1 84px;padding:8px} .ledger .v{font-size:16px}
}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;top:0;left:0;width:100%;padding:20px}
  .modal{position:static;background:none;padding:0}
  .modal .box{box-shadow:none;max-width:100%}
  .foot,.modal h3{display:none}
}

/* ================= v2: الشكل الجديد ================= */
:root{
  --bg:#F2F3EF; --surface:#fff; --ink:#1E2622; --muted:#69726C; --line:#DCDFD8; --seam:#EAECE6;
  --r:14px; --rc:9px;
  --font:'Readex Pro','IBM Plex Sans Arabic',system-ui,sans-serif;
}
body{margin:0;background:var(--bg)}
#root{font-family:var(--font);font-size:14px;line-height:1.55;background:var(--bg);display:flow-root}
.num,td.n,.hstat b,.card .v,.ledger .v,input.cell{font-family:var(--font);font-variant-numeric:tabular-nums lining-nums;letter-spacing:-.01em}

/* الهيدر: شريط لون المصنع، والقايمة الفرعية درج أبيض راكب على حافته */
header{padding:18px 0 0}
.hrow{padding-bottom:16px}
.brand{font-size:22px;font-weight:600;letter-spacing:-.3px;line-height:1.3}
.brand small{font-size:12px;font-weight:300;color:rgba(255,255,255,.68);margin-top:2px}
.hstat{gap:26px}
.hstat b{font-size:19px;font-weight:500}
.hstat span{font-size:11px;color:rgba(255,255,255,.64)}
nav button{font-size:14px;font-weight:400;color:rgba(255,255,255,.72);padding:11px 16px}
nav button.on{background:none;color:#fff;font-weight:600;border-bottom-color:#fff}
nav.subnav{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;margin:12px 0 -24px;position:relative;z-index:3}
nav.subnav button{color:var(--muted);font-weight:500;font-size:13px;padding:8px 14px;border-radius:9px}
nav.subnav button:hover{color:var(--ink);background:var(--seam)}
nav.subnav button.on{background:var(--brand);color:#fff}
header + .wrap{padding-top:14px}

/* اللوحات: من غير خلفيات رمادية، خطوط فاصلة هادية */
.panel{border-radius:var(--r);border-color:var(--line);margin-top:18px}
.panel>h2{background:none;border-bottom:1px solid var(--seam);font-size:15px;font-weight:600;padding:14px 16px}
.panel>h2 em{font-size:12.5px}
.pad{padding:16px}

/* معادلة المخزون: العنصر البارز في النظام */
.ledger{border-radius:var(--r);border-color:var(--line)}
.ledger .cell{padding:14px 16px;border-inline-start-color:var(--seam)}
.ledger .k{font-size:12px}
.ledger .v{font-size:clamp(17px,1.9vw,24px);font-weight:600;letter-spacing:-.02em;margin-top:4px;white-space:nowrap}
.ledger .op{flex:0 0 34px;background:none;border-inline-start-color:var(--seam);font-size:24px;font-weight:300;color:#A3AAA5}
.ledger .cell.book{background:var(--brand-bg)} .ledger .cell.book .v{color:var(--brand)}
.ledger .cell.real{background:#fff}

/* كروت الأرقام: شريط واحد مقسوم بخطوط بدل مربعات منفصلة */
.cards{gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card{border:0;border-radius:0;padding:14px 16px;box-shadow:-1px 0 0 var(--seam),0 1px 0 var(--seam)}
.card .k{font-size:12px}
.card .v{font-size:24px;font-weight:600;letter-spacing:-.02em}

/* الجداول */
th{background:#FAFAF8;font-size:12px;font-weight:500;padding:10px 12px}
td{padding:9px 12px;border-bottom-color:var(--seam)}
tbody tr:hover{background:#F7F8F5}
table.gridcols th,table.gridcols td{border-inline-start-color:var(--seam)}
table.gridcols td.hl{background:#FAFAF8;font-weight:600}
table.gridcols tbody tr:hover td.hl{background:#F2F3EF}
tr.catrow td{background:var(--bg);color:var(--brand);font-weight:600;font-size:12.5px;padding:8px 12px;border-bottom-color:var(--line)}
tr.catrow:hover td{background:var(--bg)}

/* الأدوات */
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select{
  border:1px solid var(--line);border-radius:var(--rc);padding:8px 11px;background:#fff;color:var(--ink);transition:border-color .12s,box-shadow .12s}
input:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
input.cell{padding:6px 9px}
.btn{border-color:var(--line);border-radius:var(--rc);padding:8px 14px}
.btn:hover{background:var(--seam)}
.btn.p:hover{background:var(--brand);filter:brightness(.88)}
.btn.g:hover{background:var(--green);filter:brightness(.9)}
.btn.danger:hover{background:var(--redbg)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:focus-visible,.cattab:focus-visible,nav button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.bar,.cattabs{background:none;border-bottom-color:var(--seam);padding:12px 16px}
.cattab{border-radius:999px;padding:6px 14px;font-weight:500}
.chip{font-size:11px;padding:2px 8px}
.empty{padding:40px 16px}

/* الرسايل والنوافذ */
.toast{background:var(--ink);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px rgba(30,38,34,.25)}
.modal{background:rgba(30,38,34,.5)}
.modal .box{border-radius:16px}
.modal h3{font-weight:600;padding:16px 18px;border-bottom-color:var(--seam)}
.foot{background:#FAFAF8;border-top-color:var(--seam);padding:12px 18px}

@media(max-width:640px){
  .brand{font-size:18px}
  .ledger .cell{padding:10px 12px} .ledger .v{font-size:19px}
  .ledger .op{flex-basis:24px;font-size:18px}
  nav.subnav{margin-bottom:-20px}
}

/* لو شريط الأرقام لوحده جوه لوحة، اللوحة نفسها هي البرواز (من غير برواز جوه برواز) */
.panel>.pad>.cards:only-child{border:0;border-radius:0}
.panel>.pad:has(>.cards:only-child){padding:0}
@media(max-width:640px){
  /* المعادلة على الموبايل: شبكة عمودين، من غير علامات + − = اللي بتتلخبط لما السطر يتكسر */
  .ledger{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--seam)}
  .ledger .op{display:none}
  .ledger .cell{border-inline-start:0;background:#fff}
  .ledger .v{font-size:20px}
  .cards{grid-template-columns:1fr 1fr!important}
}

/* ================= جلد البراند لكل مصنع ================= */
header{position:relative;isolation:isolate}
/* ظل اللوجو كعلامة مائية كبيرة في الشريط — مقصوص جوه حدود الشريط بس، ما بيتخطاش للدرج الأبيض */
header::before{content:"";position:absolute;z-index:-1;inset-inline-end:3%;bottom:30px;height:96px;width:240px;
  background:var(--wm) no-repeat left bottom/contain;opacity:.13;filter:brightness(0) invert(1);pointer-events:none}
.hlogo{width:54px;height:54px;object-fit:contain;border-radius:50%;background:#fff;padding:6px;flex:0 0 auto;
  box-shadow:0 0 0 3px var(--brand),0 0 0 5px var(--hdr-ring,rgba(255,255,255,.55))}
.brand{font-family:var(--display,var(--font))}
.brand small{font-family:var(--font);font-weight:300}

/* فروج أبو العبد: نفس هوية الموقع الرسمي — أبيض نضيف، بانر أحمر، شريط أسود متحرك، أزرار بإطار وردي */
html[data-skin="farooj"]{
  --brand:#C8222A;--brand-deep:#8E1A20;--brand-bg:#FBEAEA;
  --bg:#FFFFFF;--surface:#FFFFFF;--ink:#1A0A0A;--muted:#7A5555;--line:#E8D0D0;--seam:#F3E3E3;--tint:#FDF6F6;
  --hs-ok:#2E7A4F;--hs-bad:#C8222A;--hs-neutral:#7A5555;
  --hero:var(--hero-f);
}
html[data-skin="farooj"] body,html[data-skin="farooj"] #root{background:var(--bg);color:var(--ink);overflow-x:clip}
html[data-skin="farooj"] header{background:#fff;color:var(--ink);padding-top:12px}
html[data-skin="farooj"] header::before{display:none}
html[data-skin="farooj"] .hrow{padding-bottom:12px}
html[data-skin="farooj"] .hlogo{width:52px;height:52px;padding:4px;background:#fff;box-shadow:none;outline:0}
html[data-skin="farooj"] .brand{font-family:var(--font);font-size:24px;font-weight:600;letter-spacing:-.2px;line-height:1.25;color:var(--ink)}
html[data-skin="farooj"] .brand small{color:var(--muted);font-size:12.5px;font-weight:400}
html[data-skin="farooj"] .hstat b{color:var(--ink)}
html[data-skin="farooj"] .hstat span{color:var(--muted)}
html[data-skin="farooj"] .hstat{flex:1 1 100%;margin:0;gap:0;align-items:stretch;border-top:1px solid var(--line);padding-top:12px}
html[data-skin="farooj"] .hstat>div{text-align:start;padding-inline:18px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
html[data-skin="farooj"] .hstat>div:first-child{padding-inline-start:0;border-inline-start:0}
html[data-skin="farooj"] .hstat>.hs-act{border:0;padding-inline:0 0;margin-inline-start:8px;flex-direction:row;align-items:center}
html[data-skin="farooj"] .hstat>div:not(.hs-act)+.hs-act{margin-inline-start:auto}
html[data-skin="farooj"] #lang-select{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:6px 10px!important}
html[data-skin="farooj"] .warnbar{background:var(--brand-bg);color:var(--brand-deep);border:1px solid var(--line)}
/* البانر: بعرض الشاشة كله زي الموقع */
.heroband{display:none}
html[data-skin="farooj"] .heroband{display:block;margin-inline:calc(50% - 50vw);border-top:1px solid var(--line)}
html[data-skin="farooj"] .heroband .hb-img{height:clamp(120px,21vw,300px);background:var(--hero) center/cover no-repeat,#8E1A20}
/* القايمة: أزرار بيضا بإطار وردي، واللي مفتوح أحمر */
html[data-skin="farooj"] nav{flex-wrap:wrap;gap:8px;overflow:visible;padding:16px 0 4px}
html[data-skin="farooj"] nav button{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 16px;font-size:14px;font-weight:500}
html[data-skin="farooj"] nav button:hover{background:var(--brand-bg)}
html[data-skin="farooj"] nav button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
html[data-skin="farooj"] nav button[data-act="lock-all"]{color:var(--brand)!important}
html[data-skin="farooj"] nav.subnav{background:var(--tint);border:1px solid var(--line);border-radius:10px;padding:5px;margin:10px 0 -24px;box-shadow:0 4px 14px rgba(26,10,10,.05)}
html[data-skin="farooj"] nav.subnav button{background:transparent;border-color:transparent;padding:6px 14px;font-size:13px;color:var(--muted)}
html[data-skin="farooj"] nav.subnav button:hover{background:#fff;color:var(--ink);border-color:var(--line)}
html[data-skin="farooj"] nav.subnav button.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* اللوحات: أبيض بإطار وردي فاتح وخطوط فاصلة رفيعة زي قايمة الفروع في الموقع */
html[data-skin="farooj"] .panel{background:#fff;border-color:var(--line);border-radius:10px}
html[data-skin="farooj"] .panel>h2{font-size:16px;font-weight:600;color:var(--ink);border-bottom-color:var(--line)}
html[data-skin="farooj"] .panel>h2 em{color:var(--muted)}
html[data-skin="farooj"] .cards,html[data-skin="farooj"] .ledger{border-color:var(--line);border-radius:10px}
html[data-skin="farooj"] .ledger .op{background:var(--tint)}
html[data-skin="farooj"] .ledger .cell.book{background:var(--brand-bg)}
html[data-skin="farooj"] .ledger .cell.book .v{color:var(--brand)}
html[data-skin="farooj"] th{background:var(--tint);color:var(--muted)}
html[data-skin="farooj"] td{border-bottom-color:var(--seam)}
html[data-skin="farooj"] tbody tr:hover{background:var(--tint)}
html[data-skin="farooj"] tr.catrow td,html[data-skin="farooj"] tr.catrow:hover td{background:var(--brand-bg);color:var(--brand-deep)}
html[data-skin="farooj"] table.gridcols td.hl{background:var(--tint)}
/* الأزرار والحقول */
html[data-skin="farooj"] .btn{background:#fff;border-color:var(--line);border-radius:8px;color:var(--ink)}
html[data-skin="farooj"] .btn:hover{background:var(--brand-bg)}
html[data-skin="farooj"] .btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-skin="farooj"] .btn.p:hover{background:var(--brand-deep);filter:none}
html[data-skin="farooj"] .cattab{background:#fff;border-color:var(--line);color:var(--ink);border-radius:8px}
html[data-skin="farooj"] .cattab:hover{background:var(--brand-bg)}
html[data-skin="farooj"] .cattab.on{background:var(--brand);border-color:var(--brand);color:#fff}
html[data-skin="farooj"] input[type=text],html[data-skin="farooj"] input[type=number],html[data-skin="farooj"] input[type=date],
html[data-skin="farooj"] input[type=email],html[data-skin="farooj"] input[type=password],html[data-skin="farooj"] select{border-color:var(--line);border-radius:8px}
html[data-skin="farooj"] input:focus,html[data-skin="farooj"] select:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-bg)}
html[data-skin="farooj"] .bar,html[data-skin="farooj"] .cattabs{border-bottom-color:var(--line)}
html[data-skin="farooj"] .foot{background:var(--tint);border-top-color:var(--line)}
html[data-skin="farooj"] .toast{background:#1A0A0A}
html[data-skin="farooj"] .btn:focus-visible,html[data-skin="farooj"] .cattab:focus-visible,html[data-skin="farooj"] nav button:focus-visible{outline-color:var(--brand)}
@media(max-width:640px){
  html[data-skin="farooj"] .hlogo{width:44px;height:44px}
  html[data-skin="farooj"] .hstat{display:grid;grid-template-columns:repeat(2,1fr);row-gap:10px}
  html[data-skin="farooj"] .hstat>div{padding-inline:12px}
  html[data-skin="farooj"] .hstat>div:nth-child(odd){padding-inline-start:0;border-inline-start:0}
  html[data-skin="farooj"] .hstat>.hs-act{margin:0!important;grid-column:auto}
}

/* بابا كنافة: نفس هوية الموقع الرسمي — كريمي فاتح، عنوان نسخ كبير، أزرار كبسولة بيج وبرتقالي الكنافة */
html[data-skin="kunafa"]{
  --brand:#D4751A;--orange:#D4751A;--orange-deep:#B25E10;
  --bg:#FFFDF7;--surface:#FFF8EE;--ink:#1A1008;--muted:#86684C;--line:#E8D0A8;--seam:#F1E2C8;
  --pill:#F5E6CC;--pill-ink:#6E4A26;--brand-bg:#FBEBD3;
  --display:'Amiri',serif;
  --hs-ok:#2E7A4F;--hs-bad:#B23B2E;--hs-neutral:#86684C;
  --hero:var(--hero-k);
}
html[data-skin="kunafa"] body,html[data-skin="kunafa"] #root{background:var(--bg);color:var(--ink)}
/* الهيدر: صورة الكنافة فوق زي بانر الموقع، وتحتها كل حاجة على الكريمي */
html[data-skin="kunafa"] header{background:var(--bg);color:var(--ink);padding-top:calc(clamp(120px,17vw,230px) + 22px)}
html[data-skin="kunafa"] header::after{content:"";position:absolute;z-index:-1;top:0;inset-inline:0;height:clamp(120px,17vw,230px);
  background:var(--hero) center 55%/cover no-repeat,#5b6552}
html[data-skin="kunafa"] header::before{display:none}
html[data-skin="kunafa"] .hlogo{background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(120,70,20,.12);margin-top:calc(-1 * clamp(40px,5vw,62px));width:84px;height:84px;padding:8px}
html[data-skin="kunafa"] .brand{font-family:var(--display);font-size:clamp(30px,3.6vw,44px);font-weight:700;letter-spacing:0;line-height:1.25;color:var(--ink);text-shadow:none}
html[data-skin="kunafa"] .brand small{font-family:var(--font);color:var(--muted);font-size:13px;font-weight:400;margin-top:4px}
html[data-skin="kunafa"] .hstat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 14px;gap:20px;align-items:center}
html[data-skin="kunafa"] .hstat b{color:var(--ink);text-shadow:none}
html[data-skin="kunafa"] .hstat span{color:var(--muted)}
html[data-skin="kunafa"] header .btn{background:#fff;border-color:var(--line);border-radius:999px;color:var(--ink)}
html[data-skin="kunafa"] header .btn.p{background:var(--orange);border-color:var(--orange);color:#fff}
html[data-skin="kunafa"] #lang-select{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:999px!important;padding:6px 10px!important}
html[data-skin="kunafa"] .warnbar{background:#FBEBD3;color:#7A4A12;border:1px solid var(--line)}
/* القايمة الرئيسية: كبسولات زي تصنيفات المنيو في الموقع */
html[data-skin="kunafa"] nav{flex-wrap:wrap;gap:8px;overflow:visible;padding:4px 0}
html[data-skin="kunafa"] nav button{background:var(--pill);color:var(--pill-ink);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px;font-weight:500;
  box-shadow:0 1px 2px rgba(120,70,20,.08);transition:background .12s,color .12s}
html[data-skin="kunafa"] nav button:hover{background:#F0DCB8;color:var(--ink)}
html[data-skin="kunafa"] nav button.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:600;text-shadow:none;box-shadow:0 3px 10px rgba(212,117,26,.28)}
html[data-skin="kunafa"] nav button[data-act="lock-all"]{color:var(--hs-bad)!important;background:#fff}
/* القايمة الفرعية: درج كريمي بإطار بيج */
html[data-skin="kunafa"] nav.subnav{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;margin:12px 0 -24px;box-shadow:0 6px 18px rgba(120,70,20,.07)}
html[data-skin="kunafa"] nav.subnav button{background:transparent;border-color:transparent;box-shadow:none;padding:6px 14px;font-size:13px}
html[data-skin="kunafa"] nav.subnav button:hover{background:var(--pill)}
html[data-skin="kunafa"] nav.subnav button.on{background:var(--orange);border-color:var(--orange);color:#fff;text-shadow:none}
/* اللوحات: كارت كريمي بإطار بيج وعنوان بخط النسخ زي "افضل العروض" */
html[data-skin="kunafa"] .panel{background:var(--surface);border-color:var(--line);border-radius:16px}
html[data-skin="kunafa"] .panel>h2{font-family:var(--display);font-size:24px;font-weight:700;color:var(--ink);border-bottom-color:var(--seam);padding:14px 20px 10px}
html[data-skin="kunafa"] .panel>h2 em{font-family:var(--font);color:var(--muted)}
html[data-skin="kunafa"] .modal h3{font-family:var(--display);font-size:22px}
html[data-skin="kunafa"] .cards,html[data-skin="kunafa"] .ledger{background:#fff;border-color:var(--line)}
html[data-skin="kunafa"] .card{background:#fff}
html[data-skin="kunafa"] .ledger .cell.real{background:#fff}
html[data-skin="kunafa"] .ledger .op{background:var(--surface)}
html[data-skin="kunafa"] .ledger .cell.book{background:var(--brand-bg)}
html[data-skin="kunafa"] .ledger .cell.book .v{color:var(--orange-deep)}
/* الجداول */
html[data-skin="kunafa"] .tblwrap{background:#fff}
html[data-skin="kunafa"] th{background:#FFF4E2;color:var(--pill-ink)}
html[data-skin="kunafa"] tbody tr:hover{background:#FFF6E8}
html[data-skin="kunafa"] tr.catrow td,html[data-skin="kunafa"] tr.catrow:hover td{background:var(--pill);color:var(--orange-deep)}
html[data-skin="kunafa"] table.gridcols td.hl{background:#FFF8EE}
/* الأزرار والحقول: بيضا مدورة بإطار بيج، والأساسي برتقالي */

let _trRe=null;
function trStr(v){

    const L='\\u0621-\\u063A\\u0640-\\u065F\\u0671-\\u06D3';
    _trRe=new RegExp('(?<!['+L+'])(?:'+keys.join('|')+')(?!['+L+'])','g'); }
  return v.replace(_trRe,m=>EN_DICT[m]!==undefined?EN_DICT[m]:m).replace(/\u061F/g,'?').replace(/\u060C/g,',').replace(/\u061B/g,';');
}

const TR_ATTRS=['placeholder','title','aria-label','data-l'];
function trNode(root){
  if(LANG!=='en' || !root) return;
  if(root.nodeType===3){ trText(root); return; }
  if(root.nodeType!==1) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const list=[]; let n; while((n=w.nextNode())) list.push(n);
  list.forEach(trText);
  const els=[root,...root.querySelectorAll('[placeholder],[title],[aria-label],[data-l]')];
  for(const e of els){ if(!e.getAttribute) continue; for(const a of TR_ATTRS){ const v=e.getAttribute(a); if(v && /[\u0600-\u06FF]/.test(v)){ const nv=trStr(v); if(nv!==v) e.setAttribute(a,nv); } } }
}
function trText(t){
  const v=t.nodeValue; if(!v || !/[\u0600-\u06FF]/.test(v)) return;
  const p=t.parentElement; if(p && p.closest('.iname,[data-notr],script,style,textarea')) return;
  if(_trItemNames().has(v.trim())) return;
  let nv=trStr(v);
  // أول الجملة بحرف كبير لو النص كان بادئ بكلمة عربي اتترجمت
  if(nv!==v && /^[\u0600-\u06FF]/.test(v) && /^[a-z]/.test(nv)) nv=nv[0].toUpperCase()+nv.slice(1);
  if(nv!==v) t.nodeValue=nv;
}

(function(){

const FACTORY_THEME = {
  'kunafa':      { skin:'kunafa', brand:'#D4751A' },   // بابا كنافة: كريمي الموقع الرسمي + برتقالي الكنافة
  'مصنع-الفروج': { skin:'farooj', brand:'#C8222A' }    // فروج أبو العبد: أحمر اللهب الحقيقي من اللوجو
};
(function applyTheme(){
  const th = FACTORY_THEME[FACTORY]; if(!th) return;
  const rootEl = document.documentElement, bc = th.brand;
  rootEl.dataset.skin = th.skin;
  rootEl.style.setProperty('--brand', bc);
  const r=parseInt(bc.slice(1,3),16), g=parseInt(bc.slice(3,5),16), b=parseInt(bc.slice(5,7),16);
  const tint = c => Math.round(c + (255-c)*0.88);
  if(th.skin!=='kunafa') rootEl.style.setProperty('--brand-bg', `rgb(${tint(r)},${tint(g)},${tint(b)})`);
})();
 
if(typeof FACTORY_LOGOS!=='undefined' && FACTORY_LOGOS[FACTORY]) document.documentElement.style.setProperty('--wm', `url("${FACTORY_LOGOS[FACTORY]}")`);

/* ---------- storage ---------- */
let MODE = 'memory';   // cloud | browser | memory
const MEM = {};
const hasStore = () => typeof window!=='undefined' && window.storage && typeof window.storage.set==='function';
function lsOK(){ try{ const k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } }
 
async function sget(k){
  if(hasStore()){
    try{ const r=await window.storage.get(k); if(r&&r.value){ MODE='cloud'; return JSON.parse(r.value); } }catch(e){}
  }
  if(lsOK()){
    try{ const v=window.localStorage.getItem(k); if(v){ if(MODE!=='cloud') MODE='browser'; return JSON.parse(v); } }catch(e){}
  }
  return MEM[k]!==undefined? MEM[k] : null;
}
async function sset(k,v){
  MEM[k]=v; const txt=JSON.stringify(v); let saved=false;
  if(hasStore()){ try{ await window.storage.set(k,txt); MODE='cloud'; saved=true; }catch(e){} }
  if(!saved && lsOK()){ try{ window.localStorage.setItem(k,txt); MODE='browser'; saved=true; }catch(e){} }
  if(!saved){ const was=MODE; MODE='memory'; if(was!=='memory' && $('#root') && $('#root').dataset.ready) render(); }
  return saved;
}

// كل طلب للقاعدة بيروح بتوكن المستخدم المسجّل. قبل ما الحماية (RLS) تتفعّل، النظام بيشتغل عادي حتى من غير دخول —
// بعد التفعيل، Supabase نفسه بيرفض أي طلب من غير حساب، وكل مدير بيشوف مصانعه بس.
const AUTH_KEY='fac_auth_v1';
let AUTH=(()=>{ try{ return JSON.parse(localStorage.getItem(AUTH_KEY)||'null'); }catch(e){ return null; } })();
let PROFILE=null, AUTH_REQUIRED=false, AUTH_TABLE_READY=false;

const _authBase=()=>SUPABASE_URL.replace(/\/+$/,'');
function authSave(){ try{ if(AUTH) localStorage.setItem(AUTH_KEY,JSON.stringify(AUTH)); else localStorage.removeItem(AUTH_KEY); }catch(e){} }
function authStore(d){
  if(!d||!d.access_token) throw new Error('رد غير متوقع من Supabase');
  AUTH={ access_token:d.access_token, refresh_token:d.refresh_token||(AUTH&&AUTH.refresh_token),
    expires_at: d.expires_at || Math.floor(Date.now()/1000)+(+d.expires_in||3600),
    user:{ id:d.user?d.user.id:(AUTH&&AUTH.user.id), email:d.user?d.user.email:(AUTH&&AUTH.user.email) } };
  authSave();
}
async function authCall(grant, body){
  const r=await fetch(_authBase()+'/auth/v1/token?grant_type='+grant,{method:'POST',
    headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return d;
}
async function authLogin(email,password){ authStore(await authCall('password',{email:String(email).trim(),password})); }
let _refreshing=null;
async function authRefresh(){
  if(!AUTH||!AUTH.refresh_token) return false;
  if(!_refreshing) _refreshing=(async()=>{
    try{ authStore(await authCall('refresh_token',{refresh_token:AUTH.refresh_token})); return true; }
    catch(e){ if(/invalid|expired|not.?found|revoked/i.test(e.message)){ AUTH=null; authSave(); } return false; } // مشكلة نت مؤقتة ماتطلّعكش من حسابك
  })().finally(()=>{ _refreshing=null; });
  return _refreshing;
}
async function authToken(){
  if(!AUTH) return null;
  if(AUTH.expires_at - Math.floor(Date.now()/1000) < 90) await authRefresh(); // بنجدد الجلسة قبل ما تنتهي بدقيقة ونص
  return AUTH? AUTH.access_token : null;
}
function authLogout(){
  const tok=AUTH&&AUTH.access_token;
  if(tok) fetch(_authBase()+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok}}).catch(()=>{});
  AUTH=null; authSave(); try{ sessionStorage.removeItem('fac_guest'); }catch(e){}
  location.href=location.pathname+'?'+(ROLE==='manager'?'manager&':'')+'factory='+encodeURIComponent(FACTORY);
}
async function fetchAuthRequired(){
  try{ const r=await fetch(_authBase()+'/rest/v1/rpc/app_auth_required',{method:'POST',
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:'{}'});
    if(!r.ok) return false; return (await r.json())===true; }catch(e){ return false; }
}
// بتتنادى قبل تحميل أي بيانات: بتقرر هل نعرض شاشة الدخول، ولو مدير — بتتأكد إنه فاتح مصنع من مصانعه بس
async function authGate(){
  if(!DB_CONFIGURED) return true;
  AUTH_REQUIRED = await fetchAuthRequired();
  let guest=false; try{ guest = sessionStorage.getItem('fac_guest')==='1'; }catch(e){}
  if(AUTH) await authToken();
  if(!AUTH){
    if(!AUTH_REQUIRED && guest) return true;
    renderLogin(); return false;
  }
  try{
    const rows=await sb('app_users?user_id=eq.'+encodeURIComponent(AUTH.user.id)+'&select=role,factories,email',{prefer:'return=representation'});
    AUTH_TABLE_READY=true; PROFILE=(rows&&rows[0])||null;
  }catch(e){ AUTH_TABLE_READY=false; PROFILE=null; }
  if(!PROFILE){
    if(AUTH_REQUIRED){ renderNoAccess(`حسابك (${AUTH.user.email}) لسه متربطش بأي صلاحيات. كلّم صاحب النظام يضيفك من تبويب "المستخدمين".`); return false; }
    return true; // لسه في المرحلة الانتقالية — النظام بيشتغل زي الأول
  }
  if(PROFILE.role==='manager'){
    const allowed=PROFILE.factories||[];
    if(!allowed.length){ renderNoAccess('حسابك مالوش أي مصنع متحدد. كلّم صاحب النظام.'); return false; }

    if(ROLE!=='manager'||target!==FACTORY){ location.replace(location.pathname+'?manager&factory='+encodeURIComponent(target)); return false; }
  }
  return true;
}

async function sb(path,opts={}){
  const base=DB.url.replace(/\/+$/,'');
  const go=tok=>fetch(base+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:{apikey:DB.key,Authorization:'Bearer '+(tok||DB.key),'Content-Type':'application/json',
             Prefer:opts.prefer||'return=minimal'},
    body:opts.body?JSON.stringify(opts.body):undefined});
  let r=await go(await authToken());
  if(r.status===401 && AUTH && await authRefresh()) r=await go(AUTH.access_token); // الجلسة خلصت في النص — نجددها ونعيد الطلب مرة
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,180)||('HTTP '+r.status)); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
// بيرجّع العدد الحقيقي لصفوف جدول من غير ما ينزّل البيانات نفسها (بيستخدم هيدر Content-Range من Supabase)
async function sbCount(table){
  const base=DB.url.replace(/\/+$/,'');
  const tok=await authToken();
  const r=await fetch(base+'/rest/v1/'+table+'?select=id',{
    method:'GET',
    headers:{apikey:DB.key,Authorization:'Bearer '+(tok||DB.key),Prefer:'count=exact',Range:'0-0'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const range=r.headers.get('content-range')||'';
  const m=range.match(/\/(\d+)$/);
  return m? +m[1] : 0;
}

async function fetchFactorySummary(fid){

    const approxValue = n2(items.reduce((s,i)=>s+(+i.opening||0)*(+i.price||0),0));

// الطريقة القديمة (مسح الفترة وإعادة كتابتها) — بتستخدم بس كخطة بديلة لو القاعدة مش بتدعم الحفظ صف بصف
async function pushMovesLegacy(F,P,errors){
  try{
    // قبل أي حذف أو كتابة: لازم نسحب آخر نسخة موجودة فعليًا على السيرفر للفترة دي الأول، ونضمّها لنسختنا المحلية —
    // عشان لو جهاز تاني (زي المدير) كان سجّل حركة جديدة قبلنا بلحظات ولسه ما سحبناهاش، متتمسحش من غير قصد.
    // **مهم جدًا**: لو السحب ده فشل لأي سبب (مشكلة نت مثلاً)، لازم نوقف تمامًا وما نلمسش حركات السيرفر خالص —
    // لأننا لو كملنا بنسختنا المحلية وهي فاضية أو ناقصة، ممكن نمسح حركات حقيقية من غير أي بديل يتسجل مكانها.
    let fetchOk = false;
    let mergedMoves = S.moves;
    try{
      const serverMoves = await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(P)+'&select=*',{prefer:'return=representation'}) || [];
      const localIds = new Set(S.moves.map(m=>m.id));
      const extra = serverMoves
        .filter(m=>!localIds.has(m.id) && !DELETED_MOVE_IDS.has(m.id))
        .map(m=>({id:m.id,dir:m.dir,itemId:m.item_id,qty:+m.qty,price:+m.price,party:m.party,reason:m.reason,date:m.move_date,
          runId:m.run_id||undefined,prodDate:m.prod_date||'',temp:m.temp!=null?+m.temp:null,
          notifyId:m.notify_id||undefined,notifyFactory:m.notify_factory||undefined,invoice:m.invoice||undefined,expDate:m.exp_date||''}));
      mergedMoves = extra.length ? [...S.moves, ...extra] : S.moves;
      if(extra.length) S.moves = mergedMoves;
      fetchOk = true;
    }catch(e){ fetchOk = false; }

    if(!fetchOk){
      errors.push('الحركات: اتأجّل الحفظ عشان محتاج نتأكد من آخر نسخة موجودة على السيرفر الأول (مشكلة اتصال مؤقتة) — هيتحفظ تلقائي أول ما الاتصال يرجع، وحركاتك الحالية آمنة عندك.');
    } else {
      await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(P),{method:'DELETE'});
      if(mergedMoves.length){
      const fullBody = mergedMoves.map(m=>({
        id:m.id,factory:F,period:P,dir:m.dir,item_id:m.itemId,qty:+m.qty||0,price:+m.price||0,
        party:m.party||'',reason:m.reason||'',move_date:m.date,run_id:m.runId||null,
        prod_date:m.prodDate||null,temp:(m.temp!=null&&m.temp!=='')?+m.temp:null,
        notify_id:m.notifyId||null,notify_factory:m.notifyFactory||null,invoice:m.invoice||null,exp_date:m.expDate||null}));
      try{
        await sb('stock_moves',{method:'POST',body:fullBody});
      }catch(e){
        // لو فشل بسبب أعمدة جديدة (تاريخ الإنتاج/الحرارة/الإشعارات) لسه ما اتضافتش في القاعدة، نرجع نحفظ بالأعمدة الأساسية بس عشان الحفظ مايتوقفش خالص
        const basicBody = mergedMoves.map(m=>({
          id:m.id,factory:F,period:P,dir:m.dir,item_id:m.itemId,qty:+m.qty||0,price:+m.price||0,
          party:m.party||'',reason:m.reason||'',move_date:m.date,run_id:m.runId||null}));
        await sb('stock_moves',{method:'POST',body:basicBody});
        errors.push('تنبيه: أعمدة تاريخ الإنتاج/الحرارة/الإشعارات لسه مش مضافة في القاعدة — الحركات اتحفظت من غيرها. شغّل أوامر SQL اللي بعتهالك عشان تتفعّل.');
      }
      }
      DELETED_MOVE_IDS.clear();
    }
  }catch(e){ errors.push('الحركات: '+e.message); }
}
async function pushAll(quiet){
  if(!DB.on||DB.busy) return false;
  DB.busy=true; DB.err=''; if(!quiet) render();
  const P=S.period, F=FACTORY;
  const errors=[];

  // كل قسم مستقل تمامًا عن الباقي: فشل قسم واحد (زي الحركات لو أعمدة جديدة لسه ما اتضافتش) مايوقفش حفظ باقي الأقسام خالص
  try{
    // حماية أساسية: لو نسختنا المحلية فاضية من الأصناف بس السيرفر عنده أصناف فعلاً، ده مش حالة "مسح كل الأصناف" حقيقية —
    // غالبًا التحميل لسه ما خلصش عندنا أو حصلت مشكلة، فبنوقف من غير ما نمسح حاجة بدل ما نخاطر نمسح كل كارت الأصناف من غير بديل
    let itemsSafe = true;

async function pullAll(silent){

    const F=FACTORY;
    const st=await sb('stock_settings?'+fEq()+'&k=eq.state&select=v',{prefer:'return=representation'});

    const mv=await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(period)+'&select=*',{prefer:'return=representation'})||[];
    S.moves=mv.map(m=>({id:m.id,dir:m.dir,itemId:m.item_id,qty:+m.qty,price:+m.price,party:m.party,reason:m.reason,date:m.move_date,runId:m.run_id||undefined,prodDate:m.prod_date||'',temp:m.temp!=null?+m.temp:null,notifyId:m.notify_id||undefined,notifyFactory:m.notify_factory||undefined,invoice:m.invoice||undefined,expDate:m.exp_date||''}));
    const ct=await sb('stock_counts?'+fEq()+'&period=eq.'+encodeURIComponent(period)+'&select=*',{prefer:'return=representation'})||[];
    S.counts={}; ct.forEach(c=>S.counts[c.item_id]=+c.qty); COUNTS_LOADED_AT=Date.now();
    const rc=await sb('stock_recipes?'+fEq()+'&select=*',{prefer:'return=representation'})||[];
    S.recipes=rc.map(r=>({id:r.id,name:r.name,outItemId:r.out_item,outQty:+r.out_qty,lines:r.lines||[]}));
    const rn=await sb('stock_runs?'+fEq()+'&period=eq.'+encodeURIComponent(period)+'&select=*',{prefer:'return=representation'})||[];
    S.runs=rn.map(r=>({id:r.id,date:r.run_date,name:r.name,batches:+r.batches,outQty:+r.out_qty,cost:+r.cost}));
    const pd=await sb('stock_periods?'+fEq()+'&select=*&order=period',{prefer:'return=representation'})||[];
    S.closed=pd.map(p=>({period:p.period,value:+p.value,date:p.closed_at,items:p.snapshot||[]}));
    if(ROLE!=='manager'){ await saveMain(); await saveTx(); await sset(KEY_HIST,{periods:S.closed}); }
    DB.last=new Date().toLocaleString('en-GB'); DB.dirty=false;
    if(ROLE==='owner') maybeAutoBackup(); // بدون انتظار — بتشتغل في الخلفية ومتأثرش على سرعة التحميل
    if(ROLE==='owner') setTimeout(()=>maybeExternalBackup(),5000); // النسخة الخارجية بعد 5 ثواني عشان متزاحمش التحميل
  }catch(e){ DB.err=e.message; DB.busy=false; if(!silent) render(); if(!silent) toast('فشل التحميل: '+e.message,1); return false; }
  DB.busy=false; if(!silent) render(); if(!silent) toast('البيانات اتحمّلت من القاعدة'); return true;
}

/* ================= نسخ احتياطية تلقائية يومية (من غير أي جدول SQL جديد — بنستخدم stock_settings الموجود بالفعل) ================= */
const BACKUP_KEEP_DAYS = 21; // بنحتفظ بآخر 21 يوم بس، والباقي بيتمسح تلقائي عشان القاعدة متكبرش من غير داعي
function _backupKey(dateStr){ return 'backup_'+dateStr; }

// بتتنادى بعد كل تحميل ناجح — لو النهاردة لسه ما اتعمللهاش نسخة، بتعمل واحدة في الخلفية من غير ما توقف المستخدم
async function maybeAutoBackup(){
  try{
    const d = today();
    const existing = await sb('stock_settings?'+fEq()+'&k=eq.'+_backupKey(d)+'&select=k',{prefer:'return=representation'});
    if(existing && existing.length) return; // النهاردة أصلاً معمول لها نسخة
    const snapshot = {
      items:S.items, recipes:S.recipes, moves:S.moves, counts:S.counts, runs:S.runs,
      period:S.period, takenAt:new Date().toISOString()
    };
    await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:_backupKey(d),v:snapshot}]});
    // تنظيف: نمسح أي نسخة أقدم من BACKUP_KEEP_DAYS يوم
    const all = await sb('stock_settings?'+fEq()+'&k=like.backup_*&select=k',{prefer:'return=representation'})||[];
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-BACKUP_KEEP_DAYS);
    const cutoffStr = `${cutoff.getFullYear()}-${String(cutoff.getMonth()+1).padStart(2,'0')}-${String(cutoff.getDate()).padStart(2,'0')}`;
    const stale = all.filter(r=>r.k.replace('backup_','') < cutoffStr).map(r=>r.k);
    for(const k of stale){ await sb('stock_settings?'+fEq()+'&k=eq.'+encodeURIComponent(k),{method:'DELETE'}).catch(()=>{}); }
  }catch(e){ /* النسخ الاحتياطي التلقائي ميوقفش الشغل العادي لو فشل لأي سبب */ }
}

async function listBackups(){
  try{
    const rows = await sb('stock_settings?'+fEq()+'&k=like.backup_*&select=k,v',{prefer:'return=representation'})||[];
    return rows.map(r=>({date:r.k.replace('backup_',''), itemsCount:(r.v.items||[]).length, recipesCount:(r.v.recipes||[]).length,
      movesCount:(r.v.moves||[]).length, takenAt:r.v.takenAt, period:r.v.period}))
      .sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ return []; }
}

async function fetchFactoryInbox(factoryId){
  try{
    const rows = await sb(`stock_settings?factory=eq.${encodeURIComponent(factoryId)}&k=eq.incoming_notify&select=v`,{prefer:'return=representation'});
    return (rows && rows[0] && rows[0].v && rows[0].v.list) || [];
  }catch(e){ return []; }
}
async function saveFactoryInbox(factoryId, list){

    await sb('stock_settings',{...UPSERT,body:[{factory:factoryId,k:'incoming_notify',v:{list}}]});
    return true;
  }catch(e){ return false; }
}
async function notifyFactory(toFactoryId, payload){
  const list = await fetchFactoryInbox(toFactoryId);
  const notifId = uid('nt');
  list.unshift({id:notifId, ...payload, status:'pending', createdAt:new Date().toISOString()});
  const ok = await saveFactoryInbox(toFactoryId, list);
  return ok ? notifId : null;
}
// بيلغي إشعار عند مصنع تاني (بس لو لسه معلّق ومحدش استلمه)، وبيرجّع حالته عشان المستخدم يعرف حصل إيه بالظبط
async function retractFactoryNotification(toFactoryId, notifId){
  if(!toFactoryId || !notifId) return 'none';
  const list = await fetchFactoryInbox(toFactoryId);
  const idx = list.findIndex(n=>n.id===notifId);
  if(idx===-1) return 'none';
  if(list[idx].status!=='pending') return 'received';
  list.splice(idx,1);
  await saveFactoryInbox(toFactoryId, list);
  return 'retracted';
}

// مقياس تشابه بسيط بين اسمين (0 لحد 1) — بيستخدم أطول جزء مشترك بعد تنظيف النص
// مسافة التحرير (Levenshtein) — بنستخدمها عشان نسمح بفروق تهجية بسيطة بين كلمتين (زي "Twook" و"Tawook"، أو "chicken" و"chichen")
function _levDist(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++){
    dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  }
  return dp[m][n];
}
function _wordSim(a,b){
  if(a===b) return 1;
  // فلتر سريع ورخيص: لو الكلمتين مختلفتين في الطول بشكل كبير، مستحيل يبقوا نفس الكلمة بفرق تهجية بسيط —
  // نتجاهلهم فورًا من غير ما نحسب مسافة التحرير المكلفة (بتوفر وقت كبير مع كروت أصناف كبيرة)
  if(Math.abs(a.length-b.length) > 2) return 0;
  return 1 - _levDist(a,b)/Math.max(a.length,b.length);
}
function _cleanTok(s){
  return String(s||'').toLowerCase()
    .replace(/[ًٌٍَُِّْـ]/g,'')
    .replace(/[ة]/g,'ه').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي')
    .replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
function _wordSetScore(A,B){
  if(!A||!B) return 0;
  if(A===B) return 1;
  if(A.includes(B)||B.includes(A)) return 0.9;
  const wa=[...new Set(A.split(' ').filter(w=>w.length>1))];
  const wb=[...new Set(B.split(' ').filter(w=>w.length>1))];
  if(!wa.length||!wb.length) return 0;
  // بدل ما نطلب تطابق حرفي 100% لكل كلمة، بنسمح بفروق تهجية بسيطة (بحد أقصى تقريبًا حرف واحد لكل كلمة قصيرة)
  let score=0;
  wa.forEach(w=>{ let best=0; wb.forEach(w2=>{ if(best>=1) return; const s=_wordSim(w,w2); if(s>best) best=s; }); if(best>=0.72) score+=best; });
  return score ? (2*score)/(wa.length+wb.length) : 0;
}
function nameSimilarity(a, b){
  const A=_cleanTok(a);
  const B=_cleanTok(b);
  let best = _wordSetScore(A,B);
  if(best>=0.85) return best; // تطابق قوي أصلاً، مفيش داعي نكمل نقارن الأنصاف الفرعية ونضيّع وقت
  // أسماء الكارت غالبًا بصيغة "عربي - إنجليزي"؛ بدل ما نقارن السلسلة الطويلة دي كلها كبقعة واحدة
  // (وده بيقلل نسبة التطابق لو المُرسل بعت نص لغة واحدة بس)، بنقارن كل نص فرعي لوحده كمان ونختار أعلى نتيجة
  const parts = String(b||'').split(' - ').map(_cleanTok).filter(Boolean);
  parts.forEach(p=>{ const s=_wordSetScore(A,p); if(s>best) best=s; });
  return best;
}

// بيرجّع أقرب الأصناف للاسم الجاي، مرتبة بالأعلى تشابهًا
function suggestItemsFor(name, limit=6){
  return S.items
    .map(i=>({ item:i, score:nameSimilarity(name, i.name) }))
    .filter(x=>x.score>0.25)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit);
}

// مطابقة أصناف الاستلام: بنحفظ ربط اسم الصنف الجاي من المصنع التاني بالصنف عندك
// عشان مايتعملش صنف مكرر جديد كل مرة والرصيد يتفرّق
function inboxMatchItem(notifName){
  if(S.inboxMap && S.inboxMap[notifName]) { const m=item(S.inboxMap[notifName]); if(m) return m; }
  const norm = s => String(s||'').trim().toLowerCase();
  const exact = S.items.find(i=>norm(i.name)===norm(notifName));
  if(exact) return exact;
  // مفيش تطابق حرفي: نقترح أقرب صنف تلقائي لحد ما المستخدم يغيّره بنفسه
  const best = suggestItemsFor(notifName, 1)[0];
  return (best && best.score>=0.62) ? best.item : null;
}
// هل الصنف الحالي مقترح تلقائي (مش مثبّت من المستخدم ولا تطابق حرفي)؟
function inboxIsSuggested(notifName){
  if(S.inboxMap && S.inboxMap[notifName]) return false;
  const norm = s => String(s||'').trim().toLowerCase();
  if(S.items.some(i=>norm(i.name)===norm(notifName))) return false;
  return !!inboxMatchItem(notifName);
}

async function receiveInboxNotification(notifId){
  const n = MY_INBOX.find(x=>x.id===notifId);
  if(!n || n.status!=='pending') return; // حماية من الضغط المزدوج: لو مش معلّق (يعني قيد التنفيذ أو اتم بالفعل)، منكملش

  // بنقرأ الكمية اللي المستخدم كتبها فعليًا (ممكن تكون مختلفة عن اللي المصنع التاني أعلنها)
  const qtyInput = document.querySelector(`[data-inboxqty="${notifId}"]`);
  const actualQty = qtyInput ? parseFloat(qtyInput.value) : n.qty;
  if(isNaN(actualQty) || actualQty<0){ toast('اكتب كمية صحيحة',1); return; }
  const declaredQty = n.qty;
  const hasDiscrepancy = Math.abs(actualQty - declaredQty) > 0.001;

  const it = inboxMatchItem(n.itemName);
  if(!it){
    toast('حدد الصنف المطابق في مخزنك الأول',1);
    return;
  }
  // تحذير لو الوحدة مختلفة، عشان الكمية ماتتسجلش غلط
  const norm = u => String(u||'').trim().toLowerCase();
  if(inboxIsSuggested(n.itemName)){
    if(!confirm(`"${n.itemName}" مالوش تطابق حرفي عندك.\n\nالنظام اقترح: "${it.name}"\n\nهيتسجل ${fmt(actualQty)} ${it.unit} على الصنف ده. صح؟\n\n(لو غلط، دوس إلغاء وغيّر المطابقة من خانة البحث)`)) return;
  }
  if(n.unit && it.unit && norm(n.unit)!==norm(it.unit)){
    if(!confirm(`تنبيه: الوحدة الجاية "${n.unit}" مختلفة عن وحدة الصنف عندك "${it.unit}".\n\nهيتسجل ${fmt(actualQty)} ${it.unit} في مخزنك. متأكد؟`)) return;
  }
  if(hasDiscrepancy){
    if(!confirm(`المصنع المرسل أعلن ${fmt(declaredQty)} ${esc(n.unit||it.unit)}، وانت كاتب ${fmt(actualQty)}.\n\nهيتسجل الرقم اللي كتبته إنت (${fmt(actualQty)}) في مخزنك، وهيوصل إشعار بالفرق للمصنع المرسل عشان يراجعه. تكمل؟`)) return;
  }

  n.status='processing'; render();
  try{
    // لو المطابقة كانت اقتراح تلقائي، نثبّتها دلوقتي عشان تفضل محفوظة للمرات الجاية
    if(inboxIsSuggested(n.itemName)){
      if(!S.inboxMap) S.inboxMap={};
      S.inboxMap[n.itemName]=it.id;
      await saveMain();
    }
    // بنسجّل السعر المعروف عندك للصنف ده (لو موجود) بدل ما نسجّل صفر دايمًا — عشان قيمة المخزون متتأثرش غلط
    S.moves.push({id:uid('m'), dir:'in', itemId:it.id, qty:actualQty, date:today(), price:+it.price||0, party:n.fromFactory||'مصنع تاني', reason:''});
    await saveTx();

    n.status='received'; n.receivedAt=new Date().toISOString(); n.matchedItemId=it.id; n.actualQty=actualQty;
    await saveFactoryInbox(FACTORY, MY_INBOX);

    // لو فيه فرق بين المُعلن والفعلي، نبلّغ المصنع المرسل تلقائي عشان يراجع الفرق من عنده
    if(hasDiscrepancy && n.fromFactoryId){
      await notifyFactory(n.fromFactoryId, {
        type:'discrepancy', itemName:n.itemName, unit:n.unit||it.unit,
        declaredQty, actualQty, diff:n2(actualQty-declaredQty), originalNotifId:n.id,
        date:n.date||today(), fromFactory:FACTORIES.find(f=>f.id===FACTORY)?.name||FACTORY, fromFactoryId:FACTORY
      });
    }

    toast(`تم استلام "${it.name}" (${fmt(actualQty)} ${it.unit}) من ${n.fromFactory||'مصنع تاني'} وضيفت للمخزون${hasDiscrepancy?' — وبلّغنا المصنع المرسل بالفرق':''}`);
  }catch(e){
    n.status='pending'; // لو حصل خطأ، نرجّعه معلّق تاني عشان يقدر يعيد المحاولة
    toast('حصل خطأ أثناء الاستلام، حاول تاني: '+e.message, 1);
  }
  render();
}

// بيحسب لكل مورد: قيمة المشتريات (دائن) − قيمة المرتجعات (مدين) = صافي المستحق
function supplierAccounts(){
  const acc = {};
  const ensure = name => { if(!acc[name]) acc[name]={name, buys:0, buyN:0, returns:0, retN:0, moves:[]}; return acc[name]; };
  S.suppliers.forEach(sp=>ensure(sp));

  S.moves.forEach(m=>{
    const party = String(m.party||'').trim();
    if(!party) return;
    const it = item(m.itemId); if(!it) return;
    const val = n2((+m.qty||0) * (+m.price||0));
    if(m.dir==='in' && !String(m.party||'').startsWith('إنتاج تلقائي') && !String(m.party||'').startsWith('تسوية جرد')){
      const a=ensure(party); a.buys=n2(a.buys+val); a.buyN++; a.moves.push({...m, kind:'buy', val, itemName:it.name, unit:it.unit});
    } else if(m.dir==='out' && m.reason==='مرتجع للمورد'){
      const a=ensure(party); a.returns=n2(a.returns+val); a.retN++; a.moves.push({...m, kind:'ret', val, itemName:it.name, unit:it.unit});
    }
  });

  return Object.values(acc).map(a=>({...a, net:n2(a.buys-a.returns)}))
    .sort((x,y)=> y.net - x.net || x.name.localeCompare(y.name,'ar'));
}

/* ================= مقارنة أسعار الموردين (من حركات الوارد الفعلية) ================= */
let SPC_Q = '';
function supplierPriceStats(){
  const EXCL = p => !p || p.startsWith('إنتاج تلقائي') || p.startsWith('تسوية جرد');
  const byItem = {};
  S.moves.forEach(m=>{
    if(m.dir!=='in' || !(+m.price>0) || EXCL(String(m.party||''))) return;
    const it = item(m.itemId); if(!it) return;
    if(!byItem[it.id]) byItem[it.id] = { it, sup:{} };
    const s = byItem[it.id].sup[m.party] || (byItem[it.id].sup[m.party] = { name:m.party, last:0, lastDate:'', min:Infinity, max:0, count:0, qty:0, val:0 });
    s.count++; s.qty+=+m.qty||0; s.val+=(+m.qty||0)*(+m.price);
    s.min=Math.min(s.min,+m.price); s.max=Math.max(s.max,+m.price);
    if(String(m.date)>=s.lastDate){ s.lastDate=m.date; s.last=+m.price; }
  });
  return Object.values(byItem).map(x=>{
    const sups = Object.values(x.sup).map(s=>({...s, avg:s.qty? n2(s.val/s.qty):s.last})).sort((a,b)=>a.last-b.last);
    const cheapest = sups[0], dearest = sups[sups.length-1];
    const saving = sups.length>1 ? n2(dearest.last - cheapest.last) : 0;
    return { it:x.it, sups, cheapest, saving };
  }).sort((a,b)=> (b.sups.length>1)-(a.sups.length>1) || b.saving-a.saving || a.it.name.localeCompare(b.it.name,'ar'));
}
function viewSupplierPriceComparison(){
  const all = supplierPriceStats();
  if(!all.length) return '';
  const q = SPC_Q.trim().toLowerCase();
  const list = q ? all.filter(x=>x.it.name.toLowerCase().includes(q) || x.sups.some(s=>String(s.name).toLowerCase().includes(q))) : all;
  const multi = all.filter(x=>x.sups.length>1).length;
  return `<div class="panel">
    <h2>مقارنة أسعار الموردين <em>${all.length} صنف · ${multi} ليهم أكتر من مورد</em></h2>
    <div class="pad">
      <div class="hint">محسوبة من حركات الوارد الفعلية في الفترة الحالية. الأصناف اللي ليها أكتر من مورد بتظهر الأول، مرتبة حسب فرق السعر. الأخضر = أرخص مورد في آخر سعر.</div>
      <div class="bar" style="margin-top:8px"><input type="text" class="grow" id="spc-q" placeholder="دور باسم الصنف أو المورد…" value="${esc(SPC_Q)}"></div>
    </div>

// بيقرأ النص (سواء من إكسل بالـTab أو CSV بالفاصلة) ويحوّله لوصفات
function parseRecipeImport(text, skipHeader){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(skipHeader && lines.length) lines.shift();
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');

  const byRecipe = {};
  const errors = [];
  lines.forEach((line, idx)=>{
    const p = splitRow(line).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const [rName, outName, outQty, outUnit, matName, matQty] = p;
    const rowNo = idx + (skipHeader?2:1);
    if(!rName || !outName || !matName){ errors.push(`سطر ${rowNo}: ناقص اسم الوصفة أو المنتج أو الخامة`); return; }
    if(!(+outQty>0)){ errors.push(`سطر ${rowNo}: الكمية الناتجة لازم تكون رقم أكبر من صفر`); return; }
    if(!(+matQty>0)){ errors.push(`سطر ${rowNo}: كمية الخامة "${matName}" لازم تكون رقم أكبر من صفر`); return; }

    if(!byRecipe[rName]) byRecipe[rName] = { name:rName, outName, outQty:+outQty, outUnit:outUnit||'', lines:[] };
    byRecipe[rName].lines.push({ matName, qty:+matQty });
  });

  // نطابق الخامات والمنتجات بالأسماء الموجودة في كارت الأصناف
  const norm = s => String(s||'').trim().toLowerCase();
  const list = Object.values(byRecipe).map(r=>{
    const outIt = S.items.find(i=>norm(i.name)===norm(r.outName));
    const lines = r.lines.map(l=>{
      const it = S.items.find(i=>norm(i.name)===norm(l.matName));
      return { ...l, item: it||null };
    });
    const missing = lines.filter(l=>!l.item).map(l=>l.matName);
    const exists = S.recipes.find(x=>norm(x.name)===norm(r.name));
    return { ...r, outItem:outIt||null, lines, missing, exists:!!exists };
  });
  return { list, errors };
}

/* ================= مرفقات صور الفواتير ================= */
// الصور بتتخزن في Supabase Storage (bucket اسمه invoices)، والحركة بتشيل اسم الملف بس
// عشان الحفظ يفضل خفيف وسريع
const INVOICE_BUCKET = 'invoices';

/* تصغير صورة الفاتورة قبل الرفع: صور كاميرا الموبايل بتبقى 4–10 ميجا، وده بيخلي الرفع بطيء ويفشل على نت ضعيف.
   بنصغرها لـ 1800 بكسل (الكلام بيفضل مقروء) وجودة 82% — غالبًا بتنزل لأقل من 400 كيلو */
async function shrinkInvoiceImage(file){
  try{
    if(!file || !/^image\/(jpeg|jpg|png|webp)$/i.test(file.type||'') || file.size < 450*1024) return file;
    const url = URL.createObjectURL(file);
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const MAX=1800, sc=Math.min(1, MAX/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*sc); c.height=Math.round(img.naturalHeight*sc);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
    if(!blob || blob.size >= file.size) return file;
    return new File([blob], (file.name||'invoice').replace(/\.[^.]+$/,'')+'.jpg', {type:'image/jpeg'});
  }catch(e){ return file; }
}
let SUBMITTING = 0; // طول ما فيه حفظ/رفع شغال، التحديث التلقائي بيستنى — عشان ما يستبدلش الحركة وهي بتترفع صورتها
function storageSlug(id){
  const known = {'مصنع-الفروج':'farooj'};
  if(known[id]) return known[id];
  if(/^[A-Za-z0-9_-]+$/.test(id)) return id;
  let h=5381; for(const ch of String(id)) h=((h*33) ^ ch.codePointAt(0))>>>0;
  return 'fac-'+h.toString(36);
}
async function uploadInvoiceImage(file, moveId){
  if(!DB.on) throw new Error('لازم تكون متصل بالقاعدة عشان ترفع صورة');
  file = await shrinkInvoiceImage(file);
  const ext = ((file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,''))||'jpg';
  // مهم: Supabase Storage بيرفض أي اسم ملف فيه حروف عربي ("Invalid key") — واسم مصنع الفروج "مصنع-الفروج" عربي،
  // فكل صور الفروج كانت بتفشل. بنستخدم اسم فولدر إنجليزي ثابت لكل مصنع
  const path = `${storageSlug(FACTORY)}/${String(moveId).replace(/[^A-Za-z0-9_-]/g,'')}-${Date.now()}.${ext}`;
  const base = DB.url.replace(/\/+$/,'');
  const up = tok => fetch(`${base}/storage/v1/object/${INVOICE_BUCKET}/${encodeURIComponent(path)}`,{
    method:'POST',
    headers:{ apikey:DB.key, Authorization:'Bearer '+(tok||DB.key), 'Content-Type': file.type||'image/jpeg' },
    body: file
  });
  let r = await up(await authToken());
  if(!r.ok && AUTH && [400,401,403].includes(r.status)) r = await up(null); // سياسات التخزين القديمة ممكن تكون متفعّلة للمفتاح العام بس
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,140)||('HTTP '+r.status)); }
  return path;
}

function invoiceImageUrl(path){
  if(!path) return '';
  const base = DB.url.replace(/\/+$/,'');
  return `${base}/storage/v1/object/public/${INVOICE_BUCKET}/${path}`;
}

async function deleteInvoiceImage(path){
  if(!path || !DB.on) return false;
  const base = DB.url.replace(/\/+$/,'');
  try{
    const del = tok => fetch(`${base}/storage/v1/object/${INVOICE_BUCKET}/${encodeURIComponent(path)}`,{
      method:'DELETE', headers:{ apikey:DB.key, Authorization:'Bearer '+(tok||DB.key) }
    });
    let r = await del(await authToken());
    if(!r.ok && AUTH && [400,401,403].includes(r.status)) r = await del(null);
    return r.ok;
  }catch(e){ return false; }
}


/* ================= أرشفة صور الفواتير مع إقفال الشهر =================
   الفواتير الضريبية لازم تتحفظ 5 سنين، فما بنمسحش أي صورة قبل ما تنزل في ملف ZIP على جهاز المستخدم.
   مع كل إقفال: بننزّل ZIP لكل شهر مقفول صوره لسه ما اتأرشفتش، وبعدين نمسح من السيرفر صور الشهور
   اللي عدّى عليها أكتر من INV_KEEP_MONTHS (وكانت اتأرشفت قبل كده). الحركة نفسها بتفضل، ومكان الصورة
   بيتكتب "archived:اسم الملف" عشان يبان هي في أنهي ملف. */
const INV_KEEP_MONTHS = 3;
const INV_ZIP_KEY = 'inv_zipped';
const invIsArchived = v => String(v||'').startsWith('archived:');
const invArchiveName = v => String(v||'').slice(9);
function periodShift(p, n){ const [y,m]=p.split('-').map(Number); const d=new Date(y, m-1+n, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
async function ensureJSZip(){
  if(window.JSZip) return window.JSZip;
  await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload=res; sc.onerror=()=>rej(new Error('مش قادر أحمّل أداة الضغط — اتأكد من النت')); document.head.appendChild(sc); });
  return window.JSZip;
}
async function invZipLog(){ try{ const r=await sb('stock_settings?'+fEq()+'&k=eq.'+INV_ZIP_KEY+'&select=v',{prefer:'return=representation'}); return (r&&r[0]&&r[0].v)||{}; }catch(e){ return {}; } }
async function invZipLogSave(log){ await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:INV_ZIP_KEY,v:log}]}); }
const _fnSafe = t => String(t||'').replace(/[\\/:*?"<>|#%\n\r\t]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60) || '-';
/* uptoPeriod = آخر شهر مقفول. localMoves = حركات الشهر ده لو لسه في الذاكرة (أحدث من القاعدة) */
async function invoiceArchiveRun(uptoPeriod, localMoves){
  if(!DB.on) return {skipped:'مش متصل بالقاعدة'};
  const facName = (FACTORIES.find(f=>f.id===FACTORY)||{name:FACTORY}).name;
  // 1) كل حركات الوارد اللي عندها صورة لسه على السيرفر، لحد الشهر المقفول
  let rows = await sb('stock_moves?'+fEq()+'&period=lte.'+encodeURIComponent(uptoPeriod)+'&invoice=not.is.null&select=id,period,move_date,party,item_id,qty,invoice',{prefer:'return=representation'}) || [];
  if(localMoves && localMoves.length){
    const byId=new Map(rows.map(r=>[r.id,r]));
    for(const m of localMoves) if(m.invoice) byId.set(m.id,{id:m.id,period:uptoPeriod,move_date:m.date,party:m.party,item_id:m.itemId,qty:m.qty,invoice:m.invoice});
    rows=[...byId.values()];
  }
  rows = rows.filter(r=>r.invoice && !invIsArchived(r.invoice));
  const log = await invZipLog();
  // 2) ZIP للشهور اللي لسه ما نزلتش
  const toZip = [...new Set(rows.map(r=>r.period))].filter(p=>!log[p]).sort();
  let zipped = null;
  if(toZip.length){
    const JSZip = await ensureJSZip(); const zip = new JSZip(); const fails=[]; const done=new Set(); let n=0;
    for(const r of rows.filter(r=>toZip.includes(r.period))){
      const it=item(r.item_id)||{name:r.item_id};
      const fname = `${r.period}/${r.move_date||r.period} - ${_fnSafe(r.party)} - ${_fnSafe(it.name)} - ${r.id}.jpg`;
      if(done.has(r.invoice)){ // نفس الصورة مربوطة بكذا صنف — ملف نصي صغير بيشاور عليها بدل ما نكررها
        zip.file(fname.replace(/\.jpg$/,' (نفس فاتورة تانية).txt'), 'الصورة دي هي نفس صورة فاتورة تانية في نفس الفولدر: '+r.invoice); continue; }
      try{ const res=await fetch(invoiceImageUrl(r.invoice)); if(!res.ok) throw new Error('HTTP '+res.status);
        zip.file(fname, await res.blob()); done.add(r.invoice); n++; }
      catch(e){ fails.push(`${r.move_date} ${it.name}: ${e.message}`); }
    }
    const zipName = `فواتير-${facName}-${toZip.length>1?toZip[0]+'-إلى-'+toZip[toZip.length-1]:toZip[0]}.zip`;
    const blob = await zip.generateAsync({type:'blob'});
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=zipName; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    if(!confirm(`نزل ملف "${zipName}" فيه ${n} صورة فاتورة${fails.length?` (و${fails.length} صورة ما نزلتش)`:''}.\n\nاحفظه في مكان آمن (Google Drive أو فلاشة) — الفواتير الضريبية لازم تتحفظ 5 سنين.\n\nالملف نزل عندك واتحفظ؟`)){
      return {zipName, n, fails, aborted:true};
    }
    for(const p of toZip) log[p]={zip:zipName, at:new Date().toISOString(), count:rows.filter(r=>r.period===p).length};
    await invZipLogSave(log);
    zipped={zipName,n,fails};
  }
  // 3) نمسح من السيرفر صور الشهور القديمة (أقدم من آخر INV_KEEP_MONTHS شهور) اللي نزلت في ZIP
  const cutoff = periodShift(uptoPeriod, -(INV_KEEP_MONTHS-1)); // بنسيب الشهور من cutoff لحد uptoPeriod
  const old = rows.filter(r=>r.period<cutoff && log[r.period]);
  const keepPaths = new Set(rows.filter(r=>!(r.period<cutoff && log[r.period])).map(r=>r.invoice));
  let removed=0;
  if(old.length){
    const byZip = {}; old.forEach(r=>{ const z=log[r.period].zip; (byZip[z]=byZip[z]||[]).push(r.id); });
    for(const [z,ids] of Object.entries(byZip)){
      for(let i=0;i<ids.length;i+=100){
        const list=ids.slice(i,i+100).map(x=>'"'+String(x).replace(/"/g,'')+'"').join(',');
        await sb('stock_moves?'+fEq()+'&id=in.('+encodeURIComponent(list)+')',{method:'PATCH',body:{invoice:'archived:'+z}});
      }
    }
    for(const path of new Set(old.map(r=>r.invoice))){ if(keepPaths.has(path)) continue; if(await deleteInvoiceImage(path)) removed++; }
  }
  return {zipped, removed, oldCount:old.length, cutoff};
}
function invoiceArchiveSummary(r){
  if(!r || r.skipped) return '';
  const parts=[];
  if(r.zipped) parts.push(`نزل ملف ${r.zipped.zipName} (${r.zipped.n} صورة)`);
  if(r.aborted) parts.push('الأرشفة اتأجلت — ما اتمسحش حاجة');
  if(r.removed) parts.push(`اتمسحت ${r.removed} صورة قديمة من السيرفر (موجودة في ملفات الـZIP)`);
  return parts.join(' · ');
}

/* ================================================================
   طلبيات الفروع — نسخة داخلية (للمصانع اللي فروعها معندهاش تطبيق خاص، زي الكنافة)
   رابط واحد لكل الفروع: ?factory=<المصنع>&branch  — كل فرع بيختار اسمه ويكتب الباسورد بتاعه.
   التخزين: جدول stock_settings الموجود (من غير أي جدول جديد):
     korder_cfg      → {items:[ids اللي بتظهر للفروع], pins:{اسم الفرع: hash}}
     korder_o...     → طلبية واحدة
   ================================================================ */
const KO_CFG_KEY='korder_cfg';
/* البراندات اللي المصنع بيطلعلها طلبيات — نفس قايمة الأصناف، بس كل فرع تبع براند */
const KO_BRANDS_BY_FACTORY = {
  kunafa: [
    {id:'papa',  name:'بابا كنافة', logo:()=>FACTORY_LOGOS.kunafa, color:'#D4751A'},
    {id:'aseer', name:'عصير تايم',  logo:()=>ASEER_LOGO,            color:'#C8202A'}

const KO_STATUS={new:'جديدة',sent:'اتبعتت',received:'اتسلمت',cancelled:'اتلغت'};
async function koHash(branch,pin){
  const txt=`${FACTORY}|${branch}|${String(pin).trim()}`;
  try{ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ return 'h'+hsh(txt)+hsh(txt.split('').reverse().join('')); }
}
async function koGetCfg(){ const r=await sb('stock_settings?'+fEq()+'&k=eq.'+KO_CFG_KEY+'&select=v',{prefer:'return=representation'}); const v=(r&&r[0]&&r[0].v)||{}; return {items:v.items||[], pins:v.pins||{}, brands:v.brands||{}}; }
async function koSaveCfg(cfg){ await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:KO_CFG_KEY,v:cfg}]}); }
async function koList(branch){
  let q='stock_settings?'+fEq()+'&k=like.korder_o*&select=v';
  if(branch) q+='&v->>branch=eq.'+encodeURIComponent(branch);
  const r=await sb(q,{prefer:'return=representation'})||[];
  return r.map(x=>x.v).filter(Boolean).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
}
async function koSave(o){ o.updatedAt=new Date().toISOString(); await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:'korder_'+o.id,v:o}]}); }
const koTime = iso => { try{ const d=new Date(iso); return d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso||''; } };
const koLink = () => location.origin+location.pathname+'?factory='+encodeURIComponent(FACTORY)+'&branch';

/* ---------------- صفحة الفرع ---------------- */
const BP={cfg:null, items:[], branch:'', tab:'new', qty:{}, q:'', cat:'الكل', note:'', need:'', orders:[], err:''};
async function branchPortal(){
  document.title='طلبيات الفروع — '+((FACTORIES.find(f=>f.id===FACTORY)||{}).name||'');
  $('#root').innerHTML='<div class="boot">جاري التحميل…</div>';
  try{
    if(!DB_CONFIGURED) throw new Error('النظام مش متوصل بقاعدة البيانات');
    DB.on=true;
    BP.cfg=await koGetCfg();
    const its=await sb('stock_items?'+fEq()+'&select=id,name,unit,cat',{prefer:'return=representation'})||[];
    const allow=new Set(BP.cfg.items); BP.items=its.filter(i=>allow.has(i.id)).sort((a,b)=>(a.cat||'').localeCompare(b.cat||'','ar')||a.name.localeCompare(b.name,'ar'));
    try{ const s=JSON.parse(sessionStorage.getItem('bp:'+FACTORY)||'null'); if(s && BP.cfg.pins[s.branch]===s.h) BP.branch=s.branch; }catch(e){}
    try{ const d=JSON.parse(localStorage.getItem('bp-draft:'+FACTORY)||'null'); if(d&&d.qty) BP.qty=d.qty; }catch(e){}

function bpSaveDraft(){ try{ localStorage.setItem('bp-draft:'+FACTORY,JSON.stringify({qty:BP.qty})); }catch(e){} }

        ${bl.length?`<div style="display:flex;justify-content:center;gap:18px;margin:4px 0 14px">${bl.map(b=>`<div style="text-align:center"><img src="${b.logo()}" alt="" style="width:64px;height:64px;object-fit:contain;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)"><div class="hint" style="margin-top:4px">${esc(b.name)}</div></div>`).join('')}</div>`:''}
        <label class="f">الفرع</label><select id="bp-branch" style="width:100%"><option value="">اختار الفرع…</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>

        <button class="btn p" data-bp="login" style="width:100%;margin-top:12px;padding:10px">دخول</button></div></div>`
      : `<div class="panel"><div class="pad"><div class="warnbar">المصنع لسه ما عملش باسورد لأي فرع. كلّم المصنع.</div></div></div>`;

        <td class="n"><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><input type="number" min="0" step="any" inputmode="decimal" data-bq="${i.id}" value="${BP.qty[i.id]||''}" style="width:78px;text-align:center"><span class="hint" style="min-width:34px">${esc(i.unit||'')}</span></div></td></tr>`).join('')||`<tr><td colspan="2" class="empty">مفيش أصناف مطابقة</td></tr>`}

      ${chosen.length?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">${chosen.map(i=>`<span class="chip">${esc(i.name)} · <b>${fmtP(BP.qty[i.id])}</b> ${esc(i.unit||'')}</span>`).join('')}</div>`:'<div class="hint" style="margin-bottom:10px">اكتب الكميات فوق الأول.</div>'}
      <div class="grid">

    </tbody></table>

function bpBind(){
  const R=$('#root');
  R.querySelectorAll('[data-bp]').forEach(b=>b.onclick=()=>bpAct(b.dataset.bp,b.dataset));
  const q=$('#bp-q'); if(q) q.oninput=()=>{ BP.q=q.value; const p=q.selectionStart; bpRender(); const n=$('#bp-q'); n.focus(); n.setSelectionRange(p,p); };
  R.querySelectorAll('[data-bq]').forEach(inp=>inp.oninput=()=>{ const v=inp.value; if(v===''||!(+v>0)) delete BP.qty[inp.dataset.bq]; else BP.qty[inp.dataset.bq]=+v; bpSaveDraft();
    inp.closest('tr').style.background=+v>0?'var(--brand-bg)':''; });
  R.querySelectorAll('[data-bq]').forEach(inp=>inp.onchange=()=>{ const p=document.activeElement&&document.activeElement.dataset.bq; bpRender(); if(p){ const n=R.querySelector(`[data-bq="${p}"]`); if(n) n.focus(); } });
  const n=$('#bp-note'); if(n) n.oninput=()=>BP.note=n.value;
  const d=$('#bp-need'); if(d) d.onchange=()=>BP.need=d.value;
  const pin=$('#bp-pin'); if(pin) pin.onkeydown=e=>{ if(e.key==='Enter') bpAct('login',{}); };
}
async function bpAct(a,d){
  try{
    if(a==='login'){
      const br=$('#bp-branch').value, pin=$('#bp-pin').value, err=$('#bp-err');
      if(!br||!pin){ err.style.display='block'; err.textContent='اختار الفرع واكتب الباسورد'; return; }
      const h=await koHash(br,pin);
      if(BP.cfg.pins[br]!==h){ err.style.display='block'; err.textContent='الباسورد غلط'; return; }
      BP.branch=br; try{ sessionStorage.setItem('bp:'+FACTORY,JSON.stringify({branch:br,h})); }catch(e){}
      BP.tab='new'; return bpRender();
    }
    if(a==='logout'){ BP.branch=''; try{ sessionStorage.removeItem('bp:'+FACTORY); }catch(e){} return bpRender(); }
    if(a==='tab'){ BP.tab=d.v; if(d.v==='mine'){ BP.orders=await koList(BP.branch); } return bpRender(); }
    if(a==='cat'){ BP.cat=d.v; return bpRender(); }
    if(a==='reload'){ BP.orders=await koList(BP.branch); toast('اتحدثت'); return bpRender(); }
    if(a==='send'){
      const lines=BP.items.filter(i=>+BP.qty[i.id]>0).map(i=>({itemId:i.id,name:i.name,unit:i.unit,qty:+BP.qty[i.id]}));
      if(!lines.length) return toast('اكتب الكميات الأول',1);
      if(!confirm(`هتبعت طلبية فيها ${lines.length} صنف لفرع ${BP.branch}. تأكيد؟`)) return;
      const btn=document.querySelector('[data-bp="send"]'); if(btn){ btn.disabled=true; btn.textContent='بيبعت…'; }
      const o={id:'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), branch:BP.branch, brand:((BP.cfg.brands||{})[BP.branch])||'', createdAt:new Date().toISOString(),
        needDate:($('#bp-need')||{}).value||'', note:(($('#bp-note')||{}).value||'').trim(), status:'new', lines};
      await koSave(o);
      BP.qty={}; BP.note=''; bpSaveDraft();
      BP.orders=await koList(BP.branch); BP.tab='mine'; bpRender(); toast('الطلبية اتبعتت للمصنع ✓'); return;
    }
    if(a==='cancel'){
      const o=BP.orders.find(x=>x.id===d.id); if(!o||o.status!=='new') return;
      if(!confirm('إلغاء الطلبية دي؟')) return;
      const fresh=(await koList(BP.branch)).find(x=>x.id===o.id);
      if(fresh && fresh.status!=='new'){ toast('المصنع بدأ يجهّزها — كلّم المصنع',1); BP.orders=await koList(BP.branch); return bpRender(); }
      o.status='cancelled'; o.cancelReason='الفرع لغاها'; await koSave(o); toast('اتلغت'); return bpRender();
    }
    if(a==='recv'){
      const o=BP.orders.find(x=>x.id===d.id); if(!o||o.status!=='sent') return;
      o.lines.forEach((l,ix)=>{ const inp=document.querySelector(`[data-br="${o.id}:${ix}"]`); l.recv=inp&&inp.value!==''?+inp.value:(l.sent||0); });
      const diffs=o.lines.filter(l=>Math.abs((l.recv||0)-(l.sent||0))>0.0001);
      if(!confirm(diffs.length?`فيه ${diffs.length} صنف مختلف عن اللي اتبعت:\n${diffs.map(l=>`• ${l.name}: اتبعت ${fmtP(l.sent||0)} واستلمت ${fmtP(l.recv)}`).join('\n')}\n\nتأكيد؟`:'كل الكميات وصلت زي ما اتبعتت. تأكيد الاستلام؟')) return;
      o.status='received'; o.receivedAt=new Date().toISOString(); await koSave(o); toast('الاستلام اتأكد ✓'); return bpRender();
    }
  }catch(e){ toast('حصل خطأ: '+e.message,1); const b=document.querySelector('[data-bp="send"]'); if(b){ b.disabled=false; b.textContent='ابعت الطلبية للمصنع'; } }
}

const KO={loaded:false, loading:false, at:0, list:[], cfg:{items:[],pins:{},brands:{}}, err:'', showSetup:false, q:'', cat:'الكل', sel:null, brand:''};

  if(KO.loading) return; KO.loading=true;
  try{ KO.cfg=await koGetCfg(); KO.list=await koList(); KO.err=''; }catch(e){ KO.err=e.message; }
  KO.loaded=true; KO.loading=false; KO.at=Date.now();
  if(tab==='korders') render();
}

  const setupNeeded=!KO.cfg.items.length || !Object.keys(KO.cfg.pins).length;
  const bal=id=>{ const it=item(id); if(!it) return null; const c=calc(it); return c.book; };
  const orderCard=(o,mode)=>`<div class="pad" style="border-top:1px solid var(--line)">

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${koBrandChip(koBrand(brandOfOrder(o)))}<b style="font-size:16px">${esc(o.branch)}</b> <span class="hint">· اتطلبت ${koTime(o.createdAt)} · مطلوبة ${esc(o.needDate||'—')}</span></div>
