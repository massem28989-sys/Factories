function cats_ko(){ return ['الكل',...new Set(S.items.map(i=>i.cat).filter(Boolean))]; }
async function koAct(a,d){
  if(a==='ko-refresh'){ KO.at=0; await koLoad(); return toast('اتحدثت'); }
  if(a==='ko-setup'){ KO.showSetup=!KO.showSetup; KO.sel=null; return render(); }
  if(a==='ko-copy'){ try{ await navigator.clipboard.writeText(koLink()); toast('الرابط اتنسخ — ابعته لكل الفروع'); }catch(e){ prompt('انسخ الرابط:',koLink()); } return; }
  if(a==='ko-cat'){ KO.cat=d.v; return render(); }
  if(a==='ko-brand'){ KO.brand=d.v; return render(); }
  if(a==='ko-sel-shown'){ const q=KO.q.trim().toLowerCase(); S.items.filter(i=>(KO.cat==='الكل'||i.cat===KO.cat)&&(!q||i.name.toLowerCase().includes(q))).forEach(i=>d.v==='1'?KO.sel.add(i.id):KO.sel.delete(i.id)); return render(); }
  if(a==='ko-items-save'){ KO.cfg.items=[...KO.sel]; await koSaveCfg(KO.cfg); toast(`اتحفظ — ${KO.cfg.items.length} صنف هيظهر للفروع`); return render(); }
  if(a==='ko-pin'){
    const pin=prompt(`باسورد فرع "${d.b}" (4 أرقام أو حروف على الأقل):`); if(pin===null) return;
    if(String(pin).trim().length<4) return toast('الباسورد لازم يبقى 4 حروف/أرقام على الأقل',1);
    KO.cfg.pins[d.b]=await koHash(d.b,pin); await koSaveCfg(KO.cfg);
    alert(`باسورد فرع "${d.b}" اتحفظ.\n\nابعته للفرع مع الرابط:\n${koLink()}\n\n(الباسورد مش بيتحفظ مكتوب في النظام، فلو نسيوه اعمل واحد جديد.)`); return render();
  }
  if(a==='ko-rename'){
    const old=d.b; const nu=(prompt(`الاسم الجديد لفرع "${old}":`, old)||'').trim();
    if(!nu || nu===old) return;
    const all=new Set([...S.branches, ...Object.keys(KO.cfg.pins), ...Object.keys(KO.cfg.brands||{})]);
    if(all.has(nu)) return toast('فيه فرع بالاسم ده بالفعل',1);
    const hadPin=!!KO.cfg.pins[old];
    const nMoves=S.moves.filter(m=>m.party===old).length, nOrders=KO.list.filter(o=>o.branch===old).length;
    if(!confirm(`تغيير اسم الفرع:\n"${old}" ← "${nu}"\n\nهيتعدل كمان في ${nOrders} طلبية و${nMoves} حركة منصرف الشهر ده.`+
      (hadPin?`\n\nالباسورد مربوط باسم الفرع، فهتحتاج تعمله باسورد جديد وتبعته للفرع.`:'')+`\n\nتكمل؟`)) return;
    SUBMITTING++;
    try{
      // قايمة الفروع
      const ix=S.branches.indexOf(old); if(ix>=0) S.branches[ix]=nu; else S.branches.push(nu);
      // البراند
      if(KO.cfg.brands && KO.cfg.brands[old]!==undefined){ KO.cfg.brands[nu]=KO.cfg.brands[old]; delete KO.cfg.brands[old]; }
      // الباسورد (مربوط بالاسم، فلازم واحد جديد)
      delete KO.cfg.pins[old];
      if(hadPin){ const pin=prompt(`باسورد جديد لفرع "${nu}" (4 حروف/أرقام على الأقل):`);
        if(pin && String(pin).trim().length>=4){ KO.cfg.pins[nu]=await koHash(nu,pin); }
        else toast('الفرع اتغير اسمه بس لسه مالوش باسورد — اعمله واحد',1); }
      await koSaveCfg(KO.cfg);
      // الطلبيات القديمة والجديدة
      for(const o of KO.list.filter(o=>o.branch===old)){ o.branch=nu; await koSave(o); }
      // حركات الشهر الحالي
      S.moves.forEach(m=>{ if(m.party===old) m.party=nu; });
      await saveMain(); await saveTx();
      toast(`اسم الفرع بقى "${nu}"`);
    }catch(e){ toast('حصل خطأ: '+e.message,1); }
    finally{ SUBMITTING--; }
    return render();
  }
  if(a==='ko-unpin'){ if(!confirm(`قفل دخول فرع "${d.b}"؟ مش هيقدر يطلب لحد ما تعمله باسورد جديد.`)) return; delete KO.cfg.pins[d.b]; await koSaveCfg(KO.cfg); return render(); }
  if(a==='ko-cancel'){
    const o=KO.list.find(x=>x.id===d.id); if(!o) return;
    const why=prompt('سبب الإلغاء (هيظهر للفرع):',''); if(why===null) return;
    o.status='cancelled'; o.cancelReason=why||'المصنع لغاها'; await koSave(o); toast('اتلغت'); return render();
  }
  if(a==='ko-send'){
    const o=KO.list.find(x=>x.id===d.id); if(!o||o.status!=='new') return;
    const fresh=(await koList()).find(x=>x.id===o.id); if(fresh&&fresh.status!=='new'){ toast('الطلبية اتغيرت ('+(KO_STATUS[fresh.status]||'')+') — اتحدثت',1); KO.at=0; return koLoad(); }
    o.lines.forEach((l,ix)=>{ const inp=document.querySelector(`[data-kosent="${o.id}:${ix}"]`); l.sent=inp&&inp.value!==''?Math.max(0,+inp.value):l.qty; });
    const toSend=o.lines.filter(l=>l.sent>0);
    if(!toSend.length) return toast('كل الكميات صفر — لو مش هتبعت حاجة الغي الطلبية',1);
    if(!confirm(`هيتسجل منصرف "صرف للفروع" لفرع ${o.branch}:\n${toSend.map(l=>`• ${l.name}: ${fmtP(l.sent)} ${l.unit||''}`).join('\n')}\n\nتأكيد؟`)) return;
    SUBMITTING++;
    try{
      const errs=[]; o.moveIds=[];
      for(const l of o.lines){ if(!(l.sent>0)) continue;
        const res=dispenseOut(l.itemId, l.sent, today(), o.branch, 'صرف للفروع');
        if(res.error){ errs.push(`${l.name}: ${res.error}`); l.sent=0; } else if(res.move) o.moveIds.push(res.move.id); }
      if(!o.moveIds.length){ alert('ما اتسجلش ولا صنف:\n'+errs.join('\n')); return render(); }
      await saveTx();
      o.status='sent'; o.sentAt=new Date().toISOString(); o.period=S.period; await koSave(o);
      if(errs.length) alert('الطلبية اتبعتت، بس الأصناف دي ما اتسجلتش (واتكتبت صفر):\n'+errs.join('\n'));
      toast(`اتسجل منصرف ${o.moveIds.length} صنف لفرع ${o.branch} ✓`);
    } finally { SUBMITTING--; }
    return render();
  }
}

/* ================= تتبع التشغيلات وتواريخ الصلاحية ================= */
// كل حركة وارد ليها تاريخ صلاحية = تشغيلة مستقلة. بنستهلك التشغيلات بمنهج FIFO
// (الأقدم صلاحية بتتصرف الأول) عشان نعرف الرصيد الباقي فعليًا من كل تشغيلة
function expiryBatches(){
  const byItem = {};
  S.moves.filter(m=>m.dir==='in' && m.expDate).forEach(m=>{
    if(!byItem[m.itemId]) byItem[m.itemId]=[];
    byItem[m.itemId].push({ id:m.id, qty:+m.qty||0, expDate:m.expDate, date:m.date, party:m.party||'', price:+m.price||0 });
  });

  const out = [];
  Object.keys(byItem).forEach(itemId=>{
    const it = item(itemId); if(!it) return;
    const batches = byItem[itemId].sort((a,b)=> String(a.expDate).localeCompare(String(b.expDate)));
    const totalIn  = S.moves.filter(m=>m.dir==='in' && m.itemId===itemId).reduce((s,m)=>s+(+m.qty||0),0);
    const totalOut = S.moves.filter(m=>m.dir==='out'&& m.itemId===itemId).reduce((s,m)=>s+(+m.qty||0),0);
    // الكميات اللي جت من غير تاريخ صلاحية بتتصرف الأول منطقيًا، والباقي بيتوزع على التشغيلات
    const noExpIn = totalIn - batches.reduce((s,b)=>s+b.qty,0);
    let consume = Math.max(0, totalOut - Math.max(0, noExpIn));

    batches.forEach(b=>{
      const used = Math.min(b.qty, consume);
      consume = n2(consume - used);
      const remain = n2(b.qty - used);
      if(remain > 0) out.push({ ...b, item:it, remain });
    });
  });
  return out.sort((a,b)=> String(a.expDate).localeCompare(String(b.expDate)));
}

function daysUntil(dateStr){
  const d = new Date(dateStr+'T00:00:00'), t = new Date(today()+'T00:00:00');
  return Math.round((d-t)/86400000);
}

function viewExpiry(){
  const all = expiryBatches();
  const q = (ui.q||'').trim().toLowerCase();
  const warnDays = 14; // حد التنبيه المبكر

  const rows = all.filter(b=>!q || b.item.name.toLowerCase().includes(q));
  const expired = rows.filter(b=>daysUntil(b.expDate) < 0);
  const soon    = rows.filter(b=>{ const d=daysUntil(b.expDate); return d>=0 && d<=warnDays; });
  const okRows  = rows.filter(b=>daysUntil(b.expDate) > warnDays);

  const valOf = arr => n2(arr.reduce((s,b)=>s+b.remain*(b.price||b.item.price||0),0));
  const noExpItems = S.items.filter(it=>{
    const c=calc(it); if(c.book<=0) return false;
    return !S.moves.some(m=>m.dir==='in' && m.itemId===it.id && m.expDate);
  }).length;

  const only = ui.expOnly||'all';
  const shown = only==='expired'?expired : only==='soon'?soon : only==='ok'?okRows : rows;
  const chip=(k,l,n)=>`<button class="btn sm ${only===k?'p':''}" data-exponly="${k}">${l} ${n}</button>`;

  return `
  <div class="panel"><div class="pad"><div class="cards">

    <div class="card"><div class="k">من غير تاريخ صلاحية</div><div class="v">${noExpItems}</div><div class="s">صنف عنده رصيد</div></div>

    <h2>${only==='expired'?'التشغيلات المنتهية':only==='soon'?'التشغيلات اللي قربت تنتهي':only==='ok'?'التشغيلات السليمة':'كل التشغيلات في المخزن'} <em>${shown.length}</em>

/* ================= استيراد كارت الأصناف بالجملة ================= */
// الصيغة المتوقعة: الصنف | الوصف (اختياري) | القسم | الوحدة | الشدّ | الوحده البديله | سعر الوحدة
// عمود "الشدّ" ليه صيغتين: "اسم=رقم" (زي طبق=30) أو "رقم اسم_الوحدة_الأساسية" (زي 25 كيلو) —
// في الحالة التانية اسم الوحدة البديلة بييجي من عمود "الوحده البديله" لوحده
function parseShadField(shad, altUnitCol){
  shad = String(shad||'').trim();
  altUnitCol = String(altUnitCol||'').trim();
  if(!shad) return { packUnit: altUnitCol||'', packSize: 0 };
  let m = shad.match(/^(.+?)\s*=\s*([\d.]+)$/);
  if(m) return { packUnit: m[1].trim(), packSize: +m[2] };
  m = shad.match(/([\d.]+)/);
  if(m) return { packUnit: altUnitCol||'', packSize: +m[1] };
  return { packUnit: altUnitCol||'', packSize: 0 };
}

function parseItemCatalogImport(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {rows:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
  // نتجاهل صف العناوين لو أول خانة فيه نص زي "الصنف" أو مطابق لاسم عمود معروف
  const looksLikeHeader = /صنف|item|name/i.test(firstCells[0]||'');
  const start = looksLikeHeader ? 1 : 0;

  const rows = [];
  const errors = [];
  const norm = s => String(s||'').trim().toLowerCase();
  const seen = new Set();

  for(let i=start;i<lines.length;i++){
    const c = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const [name, , cat, unit, shad, altUnit, price] = c;
    if(!name) continue;
    if(seen.has(norm(name))){ errors.push(`سطر ${i+1}: الصنف "${name}" مكرر في الشيت، اتاخد آخر سطر بيه`); }
    seen.add(norm(name));
    const pack = parseShadField(shad, altUnit);
    const match = S.items.find(it=>norm(it.name)===norm(name));
    rows.push({
      name, cat: cat||'خامات', unit: unit||'', packUnit: pack.packUnit, packSize: pack.packSize,
      price: price!==undefined && price!=='' ? +price : null,
      existing: match||null
    });
  }
  return {rows, errors};
}

let ICI_PARSED = [];

/* ================= التقرير المالي (تكاليف — مفيش أسعار بيع في نظام المصانع) ================= */
let FIN = { from:'', to:'' };
function financeData(){
  const inRange = m => (!FIN.from || m.date>=FIN.from) && (!FIN.to || m.date<=FIN.to);
  const moves = S.moves.filter(inRange);
  const priceOf = id => { const it=item(id); return it? (+it.price||0) : 0; };
  const isProd = p => String(p||'').startsWith('إنتاج تلقائي');
  const isSettle = (m) => m.reason==='تسوية جرد' || String(m.party||'').startsWith('تسوية جرد');

  const openingValue = n2(S.items.reduce((s,i)=>s+(+i.opening||0)*(+i.price||0),0));
  const closingValue = n2(S.items.reduce((s,i)=>s+calc(i).book*(+i.price||0),0));

  // الوارد: مشتريات من موردين/مصانع، إنتاج داخلي، وتسويات زيادة
  let purchases=0, produced=0, settleIn=0; const bySupplier={};
  moves.filter(m=>m.dir==='in').forEach(m=>{
    const v = (+m.qty||0) * (+m.price>0 ? +m.price : priceOf(m.itemId));
    if(isProd(m.party)) produced+=v;
    else if(isSettle(m)) settleIn+=v;
    else { purchases+=v; const k=m.party||'بدون مورد'; bySupplier[k]=(bySupplier[k]||0)+v; }
  });

  // المنصرف حسب الجهة — بيتقيّم بسعر الصنف الحالي (حركات المنصرف مفيهاش سعر خاص بيها)
  const byReason={}, byBranch={}, byItem={}, waste={};
  let outTotal=0;
  moves.filter(m=>m.dir==='out').forEach(m=>{
    const v = n2((+m.qty||0)*priceOf(m.itemId));
    const r = m.reason || 'أخرى';
    byReason[r] = byReason[r] || {count:0,value:0}; byReason[r].count++; byReason[r].value+=v;
    outTotal+=v;
    if(r==='صرف للفروع'){ const b=m.party||'—'; byBranch[b]=(byBranch[b]||0)+v; }
    if(r!=='صرف للإنتاج (تلقائي)' && r!=='تسوية جرد'){ byItem[m.itemId]=(byItem[m.itemId]||0)+v; }
    if(r==='هالك / تالف'){ waste[m.itemId]=waste[m.itemId]||{qty:0,value:0}; waste[m.itemId].qty+=+m.qty||0; waste[m.itemId].value+=v; }
  });

  // الإنتاج حسب المنتج
  const prod={};
  (S.runs||[]).filter(r=>(!FIN.from||r.date>=FIN.from)&&(!FIN.to||r.date<=FIN.to)).forEach(r=>{
    const p=prod[r.name]||(prod[r.name]={name:r.name,runs:0,outQty:0,cost:0}); p.runs++; p.outQty+=+r.outQty||0; p.cost+=+r.cost||0;
  });

  return { openingValue, closingValue, purchases:n2(purchases), produced:n2(produced), settleIn:n2(settleIn), outTotal:n2(outTotal),
    bySupplier, byReason, byBranch, byItem, waste, prod:Object.values(prod) };
}

function viewFinance(){

  const reasons = sortE(d.byReason);
  const branches = sortE(d.byBranch);

      <button class="btn sm g" data-act="fin-export" style="margin-inline-start:auto">تصدير CSV</button>
      <button class="btn sm" data-act="do-print">🖨️ طباعة</button>
    </div>
  </div></div>

  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">مخزون أول المدة</div><div class="v">${money(d.openingValue)}</div></div>
    <div class="card"><div class="k">مشتريات (وارد من موردين ومصانع)</div><div class="v">${money(d.purchases)}</div></div>
    <div class="card"><div class="k">إجمالي المنصرف</div><div class="v">${money(d.outTotal)}</div></div>
    <div class="card"><div class="k">مخزون آخر المدة (دفتري)</div><div class="v">${money(d.closingValue)}</div></div>

    <div class="card"><div class="k">عجز تسويات الجرد</div><div class="v" style="color:${settleLoss?'var(--red)':'inherit'}">${money(settleLoss)}</div><div class="s">${d.settleIn?`وزيادة ${money(d.settleIn)}`:'فرق بين الدفتري والفعلي'}</div></div>
  </div></div></div>

  <div class="panel"><h2>المنصرف حسب الجهة</h2>
    ${tbl('<th>الجهة</th><th class="n">عدد الحركات</th><th class="n">القيمة</th><th class="n">النسبة</th>',
      reasons.map(([r,v])=>`<tr><td>${esc(r)}</td><td class="n">${v.count}</td><td class="n hl">${money(v.value)}</td><td class="n">${pct(v.value)}%</td></tr>`).join(''),'مفيش منصرف في الفترة دي')}
  </div>

  ${branches.length?`<div class="panel"><h2>تكلفة الصرف لكل فرع <em>${branches.length}</em></h2>
    ${tbl('<th>الفرع</th><th class="n">القيمة</th><th class="n">من صرف الفروع</th>',

    ${tbl('<th>المنتج</th><th class="n">تشغيلات</th><th class="n">الكمية المنتجة</th><th class="n">التكلفة</th><th class="n">تكلفة الوحدة</th>',

/* ---------- تغيير الوحدة: تحويل الكمية والسعر مع بعض عشان القيمة ما تتغيرش ---------- */
const p6 = v => Math.round((+v||0)*1e6)/1e6;
const fmtP = v => (+v||0).toLocaleString('en-US',{maximumFractionDigits:4});
function convertItemUnit(it, f){
  // f = كام وحدة جديدة في الوحدة القديمة الواحدة (مثال: كرتونة → حبة، f=24)
  it.opening = p6(it.opening*f); it.price = p6((it.price||0)/f); it.min = p6((it.min||0)*f);
  if(it.packSize>0) it.packSize = p6(it.packSize*f);
  for(const m of S.moves){ if(m.itemId!==it.id) continue; m.qty=p6(m.qty*f); if(m.price) m.price=p6(m.price/f); }
  if(S.counts[it.id]!==undefined && S.counts[it.id]!==null && S.counts[it.id]!=='') S.counts[it.id]=p6(+S.counts[it.id]*f);
  for(const r of (S.recipes||[])){
    for(const l of (r.lines||[])) if(l.itemId===it.id) l.qty=p6(l.qty*f);
    if(r.outItemId===it.id) r.outQty=p6(r.outQty*f);
  }
}
function driftAckKey(){ return `unit-drift-ack:${FACTORY}:${S.period}`; }
function driftAck(){ try{ return JSON.parse(localStorage.getItem(driftAckKey())||'{}'); }catch(e){ return {}; } }
/* الأصناف اللي قيمة أول المدة بتاعتها مختلفة عن آخر إقفال (غالبًا بسبب تغيير وحدة من غير تحويل) */
function unitDrift(){
  if(!S.closed || !S.closed.length) return {rows:[],snapTotal:0,nowTotal:0};
  const last = S.closed[S.closed.length-1]; const snap = new Map((last.items||[]).map(x=>[x.id,x]));
  const ack = driftAck(); const rows=[]; let snapTotal=0, nowTotal=0;
  for(const it of S.items){
    const sp = snap.get(it.id); if(!sp) continue;
    const before = n2((+sp.closing||0)*(+sp.price||0)), now = n2((+it.opening||0)*(+it.price||0));
    snapTotal+=before; nowTotal+=now;
    if(Math.abs(now-before) < 0.5) continue;
    if(ack[it.id]!==undefined && Math.abs(ack[it.id]-now)<0.5) continue;
    rows.push({it, sp, before, now, diff:n2(now-before), moves:S.moves.filter(m=>m.itemId===it.id).length});
  }
  rows.sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff));
  return {rows, snapTotal:n2(snapTotal), nowTotal:n2(nowTotal), period:last.period};
}
/* ترجيع الوصفات بس من نسخة (سيرفر أو ملف) — من غير ما نلمس الأصناف أو الحركات أو الجرد.
   snapItems = أصناف النسخة نفسها: بنستخدمها عشان (1) لو صنف اتمسح واتعمل تاني بـ id جديد نربطه بالاسم،
   و(2) نعرف أنهي مكونات وحدتها اتغيرت من ساعة النسخة، عشان المستخدم يحوّل كمياتها */
async function importRecipes(rc, label, snapItems){
  if(!rc || !rc.length){ toast(label+' مفيهاش وصفات',1); return false; }
  const have = new Set((S.recipes||[]).map(r=>r.id));
  const add = rc.filter(r=>r && !have.has(r.id));
  if(!add.length){ toast('كل وصفات '+label+' موجودة عندك أصلًا'); return false; }
  const norm = t=>String(t||'').trim().toLowerCase().replace(/\s+/g,' ');
  const cur = new Map(S.items.map(i=>[i.id,i]));
  const byName = new Map(S.items.map(i=>[norm(i.name),i]));
  const old = new Map((snapItems||[]).map(i=>[i.id,i]));
  // نحدد لكل id في الوصفات: هو موجود؟ ولا نربطه بالاسم؟ ولا مش موجود خالص؟
  const remap = new Map(), lost = new Map();
  const resolve = id => {
    if(cur.has(id)) return id;
    if(remap.has(id)) return remap.get(id);
    const o = old.get(id); const m = o && byName.get(norm(o.name));
    if(m){ remap.set(id,m.id); return m.id; }
    lost.set(id, o ? o.name : id); return id;
  };
  const fixed = add.map(r=>({id:r.id,name:r.name,outItemId:resolve(r.outItemId),outQty:+r.outQty||0,
    lines:(r.lines||[]).map(l=>({...l,itemId:resolve(l.itemId)}))}));
  // المكونات اللي وحدتها اتغيرت من ساعة النسخة
  const changed = new Map();
  for(const r of fixed){
    for(const id of [r.outItemId, ...r.lines.map(l=>l.itemId)]){
      const now = cur.get(id); if(!now) continue;
      const origId = [...remap.entries()].find(([,v])=>v===id)?.[0] || id;
      const was = old.get(origId);
      if(was && was.unit && now.unit && was.unit!==now.unit){
        const c = changed.get(id) || {id, name:now.name, from:was.unit, to:now.unit, recipes:new Set()};
        c.recipes.add(r.name); changed.set(id,c);
      }
    }
  }
  const totalRefs = new Set(fixed.flatMap(r=>[r.outItemId,...r.lines.map(l=>l.itemId)])).size;
  if(lost.size > totalRefs/2){ alert(`الملف ده شكله تبع مصنع تاني: ${lost.size} من ${totalRefs} صنف في وصفاته مش موجودين في المصنع اللي انت فاتحه.\n\nافتح المصنع الصح وجرب تاني.`); return false; }
  if(!confirm(`هيرجع ${add.length} وصفة من ${label}.\n\nالأصناف والحركات والجرد مش هيتلمسوا خالص — الوصفات بس.`+
    (remap.size?`\n\n${remap.size} صنف اتربط بالاسم (كان اتمسح واتعمل تاني).`:'')+
    (lost.size?`\n\nتنبيه: ${lost.size} صنف في الوصفات مش موجود دلوقتي في كارت الأصناف.`:'')+
    (changed.size?`\n\n${changed.size} مكوّن وحدته اتغيرت من ساعة النسخة — هيظهرولك بعد الاسترجاع عشان تحوّل كمياتهم.`:'')+
    `\n\nتكمل؟`)) return false;
  S.recipes = [...(S.recipes||[]), ...fixed];
  await saveMain();
  ui.recipeReport = {label, count:add.length, changed:[...changed.values()].map(c=>({...c,recipes:[...c.recipes]})), lost:[...lost.values()]};
  ui.modal = recipeReportModal();
  toast(`رجعت ${add.length} وصفة من ${label}`);
  return true;
}

/* ---------- calculations ---------- */
function calc(it){
  let inQ=0,outQ=0,inVal=0;
  for(const m of S.moves){
    if(m.itemId!==it.id) continue;
    if(m.dir==='in'){ inQ+=m.qty; inVal+=m.qty*(m.price||0); } else outQ+=m.qty;
  }
  const book = n2(it.opening + inQ - outQ);
  const counted = S.counts[it.id];
  const has = counted!==undefined && counted!==null && counted!=='';
  const real = has? +counted : null;
  return { inQ:n2(inQ), outQ:n2(outQ), inVal, book, real, has, diff: has? n2(real-book):null,
           value: n2((has?real:book)*(it.price||0)) };
}
function totals(){
  let value=0, counted=0, low=0, gain=0, loss=0, lossVal=0;
  for(const it of S.items){
    const c=calc(it); value+=c.value; if(c.has) counted++;
    const onhand = c.has?c.real:c.book;
    if(it.min>0 && onhand<=it.min) low++;
    if(c.has&&c.diff>0) gain+=1;
    if(c.has&&c.diff<0){ loss+=1; lossVal += Math.abs(c.diff)*(it.price||0); }
  }
  return {value,counted,low,gain,loss,lossVal,total:S.items.length};
}
function recipeCost(r){
  return r.lines.reduce((s,l)=>{const it=item(l.itemId); return s + (it? (it.price||0)*l.qty : 0);},0);
}

const MOVE_FIELDS=['m-item','m-packs','m-unitmode','m-price','m-party','m-date','m-proddate','m-temp','m-expdate','m-retprice'];
function captureMoveDraft(){
  if(!['in','out'].includes(tab) || !document.getElementById('m-item')) return null;
  const d={__tab:tab, __focus:(document.activeElement&&document.activeElement.id)||''};
  MOVE_FIELDS.forEach(id=>{ const e=document.getElementById(id); if(e) d[id]=e.value; });
  return (d['m-item']||d['m-packs']||d['m-price']) ? d : null;
}
function restoreMoveDraft(d, skip){
  if(!d || d.__tab!==tab) return;
  const sel=document.getElementById('m-item'); if(!sel) return;
  const setVal=(id)=>{ const e=document.getElementById(id); if(!e || d[id]===undefined || (skip||[]).includes(id)) return;
    if(e.tagName==='SELECT' && ![...e.options].some(o=>o.value===d[id])) return; e.value=d[id]; };
  if(d['m-item'] && [...sel.options].some(o=>o.value===d['m-item'])){ sel.value=d['m-item']; sel.dispatchEvent(new Event('change')); }
  ['m-unitmode','m-packs','m-price','m-party','m-date','m-proddate','m-temp','m-expdate','m-retprice'].forEach(setVal);
  const p=document.getElementById('m-packs'); if(p) p.dispatchEvent(new Event('input'));
  if(d.__focus){ const f=document.getElementById(d.__focus); if(f) f.focus(); }
}

const CATEGORY_ORDER = ['خامات','منتجات جديدة','تعبئة وتغليف'];
const catRank = c => { const i=CATEGORY_ORDER.indexOf(c); return i===-1?999:i; };
function sortItemsList(list){
  return list.slice().sort((a,b)=>{
    const ra=catRank(a.cat), rb=catRank(b.cat);
    if(ra!==rb) return ra-rb;
    if(a.cat!==b.cat) return a.cat.localeCompare(b.cat,'ar');
    return String(a.id).localeCompare(String(b.id));
  });
}
function filtered(){
  const q=ui.q.trim().toLowerCase();
  const list = S.items.filter(it=>{
    if(ui.cat!=='الكل' && it.cat!==ui.cat) return false;
    if(q && !(it.name.toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q))) return false;
    if(ui.only!=='الكل'){
      const c=calc(it);
      if(ui.only==='ناقص' && !(c.has&&c.diff<0)) return false;
      if(ui.only==='زيادة' && !(c.has&&c.diff>0)) return false;
      if(ui.only==='لسه' && c.has) return false;
      if(ui.only==='تحت الحد' && !(it.min>0 && (c.has?c.real:c.book)<=it.min)) return false;
    }
    return true;
  });
  return sortItemsList(list);
}
const cats = ()=>['الكل',...[...new Set(S.items.map(i=>i.cat))].sort((a,b)=>{
  const ra=catRank(a), rb=catRank(b); return ra!==rb? ra-rb : a.localeCompare(b,'ar');
})];

}

  // كده الصنف الجاهز يقدر يفضل في تصنيفه الطبيعي (منتج نهائي مثلًا) ويتصرف للفروع عادي، وبرضه تتابعه يوميًا

      const c = calc(it);
      const value = c.book*(it.price||0);

async function faroojRequest(params){
  if(!BRANCH_APP) throw new Error('المصنع ده معندوش تطبيق فروع متربط بيه لسه');
  const res = await fetch(BRANCH_APP.gscriptUrl, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({...params, token: BRANCH_APP.secretToken}).toString()
  });
  if(!res.ok) throw new Error('تعذر الاتصال بتطبيق الفروع');
  const data = await res.json();
  if(!data.success && data.error && data.error !== 'not_found') throw new Error(data.error);
  return data;
}
async function faroojList(prefix){
  const r = await faroojRequest({action:'list', prefix});
  return r.success ? (r.keys||[]) : [];
}
async function faroojGet(key){
  const r = await faroojRequest({action:'get', key});
  return r.success ? r.value : null;
}
// الجسر بقى ليه صلاحية كتابة كمان، عشان تعديل الطلبية من المصنع يوصل فعليًا لطلبية الفرع
async function faroojSet(key, value){
  const r = await faroojRequest({action:'set', key, value});
  return !!r.success;
}
function faroojDateRange(from, to){
  const dates=[]; let d=new Date(from+'T00:00:00'); const end=new Date(to+'T00:00:00'); let g=0;
  while(d<=end && g<60){ dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); g++; }
  return dates;
}

let BO = { from:'', to:'', loading:false, err:'', totals:{}, orders:[], ordersCount:0, branchesCount:0, view:'totals', openOrder:null, changes:[], changesCount:0, shortages:[], shortagesCount:0, matrixQ:'' };

async function fetchBranchOrders(){
  BO.loading=true; BO.err=''; render();
  try{
    const dates = faroojDateRange(BO.from, BO.to);
    const listResults = await Promise.all(dates.map(d=>faroojList(`${BRANCH_APP.keyPrefix}:${d}:`)));
    const allKeys = listResults.flat();
    const results = await Promise.all(allKeys.map(k=>faroojGet(k).catch(()=>null)));
    const totals={}; const branches=new Set(); const orders=[]; let ordersCount=0;
    results.forEach((v,i)=>{
      if(!v) return;
      let data; try{ data=JSON.parse(v); }catch(e){ return; }
      ordersCount++; branches.add(data.branch);
      orders.push({...data, _key: allKeys[i]}); // بنحتفظ بمفتاح السجل عشان نقدر نكتب فيه التعديل
      (data.items||[]).forEach(it=>{
        if(!totals[it.name]) totals[it.name]={name:it.name, unit:it.unit, qty:0};
        totals[it.name].qty = n2(totals[it.name].qty + (+it.qty||0));
      });
    });
    orders.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    BO.totals=totals; BO.orders=orders; BO.ordersCount=ordersCount; BO.branchesCount=branches.size;
  }catch(e){ BO.err=e.message; }
  await fetchFactoryChangeRequests();
  await fetchFactoryShortageReports();
  BO.loading=false; render();
}

async function fetchFactoryChangeRequests(){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_change:index`);
    const index = idxVal ? JSON.parse(idxVal) : [];
    const sorted = index.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const details = await Promise.all(sorted.map(r=>faroojGet(`${BRANCH_APP.keyPrefix}_change:${r.id}`).catch(()=>null)));
    BO.changes = sorted.map((r,i)=>{
      let note='-';
      try{ if(details[i]) note = JSON.parse(details[i]).note || '-'; }catch(e){}
      return {...r, note};
    });
    BO.changesCount = BO.changes.filter(r=>r.status==='pending').length;
  }catch(e){ BO.changes=[]; BO.changesCount=0; }
}

// بلاغات نواقص الاستلام: الفرع بيبلّغ لما صنف من الفاتورة يوصله ناقص أو مايوصلوش خالص
async function fetchFactoryShortageReports(){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_shortage:index`);
    const index = idxVal ? JSON.parse(idxVal) : [];
    const sorted = index.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const details = await Promise.all(sorted.map(r=>faroojGet(`${BRANCH_APP.keyPrefix}_shortage:${r.id}`).catch(()=>null)));
    BO.shortages = sorted.map((r,i)=>{
      let items=[];
      try{ if(details[i]) items = JSON.parse(details[i]).items || []; }catch(e){}
      return {...r, items};
    });
    BO.shortagesCount = BO.shortages.filter(r=>r.status==='pending').length;
  }catch(e){ BO.shortages=[]; BO.shortagesCount=0; }
}

async function decideFactoryShortageReport(id, decision){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_shortage:index`);

// كاش بسيط عشان مش نكرر حساب أقرب تطابق لنفس اسم الصنف كذا مرة (زي لما نفس الصنف يتكرر في 24 فرع)
// بيتصفّر تلقائي لو كارت الأصناف اتغيّر (بنقارن طوله كإشارة سريعة للتغيير)
let _matchCache = new Map();
let _matchCacheItemsLen = -1;
function findMatchingLocalItem(faroojName){
  if(_matchCacheItemsLen !== S.items.length){ _matchCache = new Map(); _matchCacheItemsLen = S.items.length; }
  if(_matchCache.has(faroojName)) return _matchCache.get(faroojName);
  if(S.boMap && S.boMap[faroojName]) {
    const m=item(S.boMap[faroojName]);
    if(m){ _matchCache.set(faroojName, m); return m; }
  }
  const norm = s => String(s||'').trim().toLowerCase();
  const exact = S.items.find(i=>norm(i.name)===norm(faroojName));
  if(exact){ _matchCache.set(faroojName, exact); return exact; }
  // مفيش تطابق حرفي: نقترح أقرب صنف تلقائي لحد ما المستخدم يثبّته بنفسه
  const best = suggestItemsFor(faroojName, 1)[0];
  const result = (best && best.score>=0.62) ? best.item : null;
  _matchCache.set(faroojName, result);
  return result;
}
// هل الصنف الحالي مقترح تلقائي (مش مثبّت من المستخدم ولا تطابق حرفي)؟
function boMatchIsSuggested(faroojName){
  if(S.boMap && S.boMap[faroojName]) return false;
  const norm = s => String(s||'').trim().toLowerCase();
  if(S.items.some(i=>norm(i.name)===norm(faroojName))) return false;
  return !!findMatchingLocalItem(faroojName);
}
// تطبيع أسماء الوحدات: نفس الوحدة بتتكتب بأشكال مختلفة (حبه/حبة، باكت/باكيت، كرتونه/كرتون)
function normUnit(u){
  let s = String(u||'').trim().toLowerCase();
  s = s.replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ');
  s = s.replace(/ة/g,'ه').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
  const map = {
    'حبه':'حبه','حبات':'حبه','pcs':'حبه','pc':'حبه',
    'باكت':'باكت','باكيت':'باكت','باكية':'باكت','pkt':'باكت','packet':'باكت',
    'كرتون':'كرتون','كرتونه':'كرتون','كرتونة':'كرتون','carton':'كرتون','ctn':'كرتون',
    'علبه':'علبه','علبة':'علبه','box':'علبه',
    'كيلو':'كيلو','كجم':'كيلو','kg':'كيلو','كيلوجرام':'كيلو','كيلوغرام':'كيلو',
    'لتر':'لتر','ltr':'لتر','l':'لتر',
    'جالون':'جالون','gallon':'جالون',
    'سطل':'سطل','bucket':'سطل',
  };
  return map[s] || s;
}
// وحدة الفرع للصنف ده (زي ما جات في الطلبية)
function branchUnitOf(faroojName){
  const r = BO.totals[faroojName];
  return r ? String(r.unit||'').trim() : '';
}
// معامل التحويل: كمية الفرع × المعامل = كمية المصنع. لو الوحدتين متطابقتين (بعد التطبيع) المعامل = 1 تلقائي
function convFactorOf(faroojName){
  const m = findMatchingLocalItem(faroojName);
  if(!m) return null;
  const bu = normUnit(branchUnitOf(faroojName)), fu = normUnit(m.unit);
  if(bu && fu && bu === fu) return 1;
  // لو وحدة الفرع مطابقة للوحدة البديلة (الشدّ) المسجلة على الصنف نفسه، نحسب المعامل تلقائي من غير ما نطلب إدخال يدوي —
  // نفس الوحدة البديلة دي بتستخدم في الجرد كمان، عشان تبقى موحّدة في النظام كله
  if(bu && m.packUnit && m.packSize>0 && normUnit(m.packUnit)===bu) return m.packSize;
  const saved = S.boConv ? S.boConv[faroojName] : undefined;
  return (saved!==undefined && saved!=='' && +saved>0) ? +saved : null; // null = محتاج تحديد
}
// هل الصنف ده جاهز للصرف فعليًا؟ (متطابق + وحدته واضحة)
function boReadyToDispense(faroojName){
  return !!findMatchingLocalItem(faroojName) && convFactorOf(faroojName)!==null;
}
// الكمية الحقيقية بوحدة المصنع
function boFactoryQty(faroojName, branchQty){
  const f = convFactorOf(faroojName);
  return f===null ? null : n2(branchQty * f);
}

      </tbody></table></div>

/* ================= 2/3. وارد و منصرف ================= */
const OUT_REASONS=['صرف للإنتاج','صرف للفروع','صرف لمصنع تاني','هالك / تالف','مرتجع للمورد','تسوية جرد','عينات','أخرى'];
// الجهات المسموح بيها في المصنع ده. null = كلها متاحة (الوضع الافتراضي)
function outReasons(){
  const a = S.allowedReasons;
  if(!Array.isArray(a) || !a.length) return OUT_REASONS;
  const filtered = OUT_REASONS.filter(r=>a.includes(r));
  return filtered.length ? filtered : OUT_REASONS;
}

/* ================= 4. الإنتاج والوصفات ================= */
function viewProd(){
  const runs = (S.runs||[]).slice();
  // ===== تحليل الإنتاجية والتكلفة =====
  const totalRuns   = runs.length;
  const totalCost   = runs.reduce((s,r)=>s+(+r.cost||0),0);
  const totalOut    = runs.reduce((s,r)=>s+(+r.outQty||0),0);
  const avgUnitCost = totalOut ? totalCost/totalOut : 0;

  // تجميع حسب الوصفة: كام تشغيلة، إجمالي الناتج، إجمالي التكلفة، متوسط تكلفة الوحدة
  const byRecipe = {};
  runs.forEach(r=>{
    if(!byRecipe[r.name]) byRecipe[r.name]={name:r.name, runs:0, out:0, cost:0, dates:[]};
    const g=byRecipe[r.name];
    g.runs++; g.out=n2(g.out+(+r.outQty||0)); g.cost=n2(g.cost+(+r.cost||0)); g.dates.push(r.date);
  });
  const recipeStats = Object.values(byRecipe).map(g=>({
    ...g, unitCost: g.out ? g.cost/g.out : 0
  })).sort((a,b)=>b.cost-a.cost);

  // اتجاه تكلفة الوحدة: بنقارن أول نص التشغيلات بآخر نص، عشان نعرف التكلفة بتزيد ولا بتقل
  function costTrend(recipeName){
    const rs = runs.filter(r=>r.name===recipeName && r.outQty>0)
                   .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
    if(rs.length<2) return null;
    const mid = Math.floor(rs.length/2);
    const firstHalf = rs.slice(0,mid), lastHalf = rs.slice(mid);
    const avg = arr => { const o=arr.reduce((s,r)=>s+r.outQty,0), c=arr.reduce((s,r)=>s+r.cost,0); return o? c/o : 0; };
    const a = avg(firstHalf), b = avg(lastHalf);
    if(!a) return null;
    return { pct: ((b-a)/a)*100, from:a, to:b };
  }

  // أكتر الخامات استهلاكًا في الإنتاج (من حركات الصرف التلقائي المرتبطة بتشغيلات)
  const rawUse = {};
  S.moves.filter(m=>m.dir==='out' && m.runId).forEach(m=>{
    const it=item(m.itemId); if(!it) return;
    if(!rawUse[m.itemId]) rawUse[m.itemId]={it, qty:0, cost:0};
    rawUse[m.itemId].qty = n2(rawUse[m.itemId].qty + (+m.qty||0));
    rawUse[m.itemId].cost = n2(rawUse[m.itemId].cost + (+m.qty||0)*(it.price||0));
  });
  const topRaw = Object.values(rawUse).sort((a,b)=>b.cost-a.cost).slice(0,8);
  const totalRawCost = Object.values(rawUse).reduce((s,r)=>s+r.cost,0);

  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">تشغيلات الشهر</div><div class="v">${totalRuns}</div><div class="s">${periodLabel(S.period)}</div></div>
    <div class="card"><div class="k">إجمالي الإنتاج</div><div class="v">${fmt(totalOut)}</div><div class="s">وحدة منتجة</div></div>
    <div class="card"><div class="k">تكلفة الإنتاج</div><div class="v">${money(totalCost)}</div><div class="s">درهم</div></div>
    <div class="card"><div class="k">متوسط تكلفة الوحدة</div><div class="v" style="color:var(--blue)">${money(avgUnitCost)}</div><div class="s">لكل وحدة منتجة</div></div>
    <div class="card"><div class="k">منتجات مختلفة</div><div class="v">${recipeStats.length}</div><div class="s">وصفة اشتغلت</div></div>
  </div></div></div>

  ${recipeStats.length?`<div class="panel">
    <h2>تحليل الإنتاجية والتكلفة لكل منتج <em>${recipeStats.length} منتج</em></h2>
    <p class="hint" style="margin:-6px 14px 0">"اتجاه التكلفة" بيقارن متوسط تكلفة الوحدة في أول التشغيلات بآخرها — لو أحمر يبقى التكلفة بتزيد ومحتاج تراجع أسعار الخامات أو الهدر.</p>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>المنتج / الوصفة</th><th class="n">عدد التشغيلات</th><th class="n">إجمالي الناتج</th><th class="n">إجمالي التكلفة</th><th class="n">تكلفة الوحدة</th><th>اتجاه التكلفة</th><th class="n">% من تكلفة الإنتاج</th></tr></thead>
      <tbody>${recipeStats.map(g=>{
        const tr = costTrend(g.name);
        const share = totalCost ? (g.cost/totalCost)*100 : 0;
        let trendHtml = '<span class="hint">—</span>';
        if(tr){
          const up = tr.pct > 2, down = tr.pct < -2;
          trendHtml = up ? `<span class="chip r">▲ ${fmt(Math.abs(tr.pct),1)}%</span>`
                    : down ? `<span class="chip g">▼ ${fmt(Math.abs(tr.pct),1)}%</span>`
                    : '<span class="chip">ثابتة</span>';
        }
        return `<tr>
          <td><div class="iname">${esc(g.name)}</div></td>
          <td class="n">${fmt(g.runs)}</td>
          <td class="n">${fmt(g.out)}</td>
          <td class="n">${money(g.cost)}</td>
          <td class="n hl">${money(g.unitCost)}</td>
          <td>${trendHtml}</td>
          <td class="n">${fmt(share,1)}%</td>
        </tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="font-weight:700">
        <td>الإجمالي</td><td class="n">${totalRuns}</td><td class="n">${fmt(totalOut)}</td>
        <td class="n">${money(totalCost)}</td><td class="n hl">${money(avgUnitCost)}</td><td colspan="2"></td>
      </tr></tfoot>
    </table></div>
  </div>`:''}

  ${topRaw.length?`<div class="panel">
    <h2>أكتر الخامات استهلاكًا في الإنتاج <em>أعلى ${topRaw.length}</em></h2>
    <p class="hint" style="margin:-6px 14px 0">الخامات اللي بتاكل أكبر نصيب من تكلفة إنتاجك — أي وفر هنا بيأثر مباشرة على الربح.</p>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>الخامة</th><th class="n">الكمية المستهلكة</th><th class="n">تكلفتها</th><th class="n">% من تكلفة الخامات</th></tr></thead>
      <tbody>${topRaw.map(r=>{
        const share = totalRawCost ? (r.cost/totalRawCost)*100 : 0;
        return `<tr>
          <td><div class="iname">${esc(r.it.name)}</div></td>
          <td class="n">${fmt(r.qty)} <span class="chip">${esc(r.it.unit)}</span></td>
          <td class="n hl">${money(r.cost)}</td>
          <td class="n">${fmt(share,1)}%</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`:''}

  <div class="panel">
    <h2>وصفات الإنتاج <em>الوصفة بتخصم الخامات وتضيف المنتج بضغطة واحدة</em>
      ${(()=>{ const n=S.recipes.filter(r=>{const o=item(r.outItemId); if(!o||!r.outQty) return false; const uc=recipeCost(r)/r.outQty; return uc>0 && Math.abs(uc-(+o.price||0))>0.005; }).length;
        return n?`<button class="btn sm" data-act="sync-prices" style="margin-inline-start:auto">مزامنة أسعار ${n} منتج</button><button class="btn sm" data-act="import-recipes">استيراد من إكسل</button><button class="btn sm p" data-act="new-recipe">وصفة جديدة</button>`
                :`<button class="btn sm" data-act="import-recipes" style="margin-inline-start:auto">استيراد من إكسل</button><button class="btn sm p" data-act="new-recipe">وصفة جديدة</button>`; })()}</h2>
    ${S.recipes.length?(()=>{
      // نجهّز بيانات كل وصفة مرة واحدة (تصنيف المنتج، التكلفة، إلخ) عشان الفلترة والترتيب والتجميع
      const enriched = S.recipes.map(r=>{
        const out = item(r.outItemId);
        const c = recipeCost(r);
        const unitCost = r.outQty? c/r.outQty : 0;
        const cat = out ? (out.cat||'بدون تصنيف') : 'بدون تصنيف';
        return { r, out, cost:c, unitCost, cat };
      });

      const recCats = ['الكل', ...new Set(enriched.map(e=>e.cat))].sort((a,b)=> a==='الكل'?-1 : b==='الكل'?1 : a.localeCompare(b,'ar'));
      const catCounts = {}; enriched.forEach(e=>catCounts[e.cat]=(catCounts[e.cat]||0)+1);

      const q = recQ.trim().toLowerCase();
      let shown = enriched.filter(e=>{
        if(recCat!=='الكل' && e.cat!==recCat) return false;
        if(q){
          const inName = e.r.name.toLowerCase().includes(q);
          const inOut = e.out && e.out.name.toLowerCase().includes(q);
          const inMat = e.r.lines.some(l=>{ const it=item(l.itemId); return it && it.name.toLowerCase().includes(q); });
          if(!inName && !inOut && !inMat) return false;

      });

      shown.sort((a,b)=>{
        let v=0;
        if(recSort.by==='name') v = a.r.name.localeCompare(b.r.name,'ar');
        else if(recSort.by==='cost') v = a.cost-b.cost;
        else if(recSort.by==='unitcost') v = a.unitCost-b.unitCost;
        else if(recSort.by==='cat') v = a.cat.localeCompare(b.cat,'ar') || a.r.name.localeCompare(b.r.name,'ar');
        return v*recSort.dir;
      });

      const arrow = k => recSort.by===k ? (recSort.dir===1?' ▲':' ▼') : '';
      const groupByCat = recSort.by==='cat';

      return `
      <div class="pad">
        <div class="bar">
          <input type="text" class="grow" id="rec-q" placeholder="دور باسم الوصفة أو المنتج أو أي خامة فيها…" value="${esc(recQ)}">
        </div>
      </div>
      <div class="cattabs">
        ${recCats.map(c=>`<button class="cattab ${recCat===c?'on':''}" data-reccat="${esc(c)}">${esc(c)}${c!=='الكل'?` <span class="ct-n">${catCounts[c]||0}</span>`:''}</button>`).join('')}
      </div>
      <div class="tblwrap"><table class="gridcols rectbl">
      <thead><tr>
        <th style="cursor:pointer" data-recsort="name">الوصفة والناتج${arrow('name')}</th>
        <th>المكونات</th>
        <th class="n" style="cursor:pointer" data-recsort="cost">تكلفة<br>التشغيلة${arrow('cost')}</th>
        <th class="n" style="cursor:pointer" data-recsort="unitcost">تكلفة<br>الوحدة${arrow('unitcost')}</th>
        <th class="n">سعر<br>الكارت</th><th></th>
      </tr></thead>
      <tbody>${(()=>{ let lastCat=null; return shown.map(e=>{
        const {r,out,cost:c,unitCost,cat}=e;
        const missingPrice = r.lines.some(l=>{ const it=item(l.itemId); return !it || !(it.price>0); });
        const cardPrice = out ? (+out.price||0) : 0;
        const diff = unitCost>0 ? Math.abs(unitCost-cardPrice) : 0;
        const stale = unitCost>0 && diff>0.005;
        const hdr = (groupByCat && cat!==lastCat) ? (lastCat=cat, `<tr class="catrow"><td colspan="6">${esc(cat)}</td></tr>`) : '';
        return hdr+`<tr><td class="rec-name"><div class="iname">${esc(r.name)}</div>
            <div class="hint">الناتج: <b class="num">${fmt(r.outQty)}</b> ${esc(out?out.unit:'')} · ${esc(out?out.name:'—')}</div>
            <div style="margin-top:3px">${groupByCat?'':`<span class="chip">${esc(cat)}</span> `}${missingPrice?'<span class="chip a">خامة من غير سعر</span>':''}</div></td>
          <td class="rec-lines">${r.lines.map(l=>{ const it=item(l.itemId); return `<span class="chip">${esc((it||{}).name||'?')} · <b>${fmtP(l.qty)}</b>${it?' '+esc(it.unit):''}</span>`; }).join(' ')}</td>
          <td class="n" data-l="تكلفة التشغيلة"><b>${money(c)}</b></td>
          <td class="n hl" data-l="تكلفة الوحدة">${money(unitCost)}</td>
          <td class="n" data-l="سعر الكارت">${cardPrice>0?money(cardPrice):'<span class="hint">مفيش</span>'}${stale?` <span class="chip a" title="سعر الكارت مختلف عن تكلفة الوصفة">مختلف</span>`:''}</td>
          <td class="rec-act">
            <button class="btn sm g" data-run="${r.id}">تشغيل</button>
            <button class="btn sm" data-act="edit-recipe" data-id="${r.id}">تعديل</button>
            <button class="btn sm danger" data-delr="${r.id}">حذف</button></td></tr>`;
      }).join('');})() || `<tr><td colspan="6" class="empty">مفيش وصفات مطابقة للبحث</td></tr>`}</tbody>
      </table></div>`;
    })()
      : `<div class="empty">لسه مفيش وصفات. اعمل وصفة لكل منتج (كنافة، مبرومة، كوكيز…) عشان الخامات تتخصم لوحدها وتعرف تكلفة الحبة.</div>`}
  </div>
  </div>

  <div class="panel"><h2>سجل تشغيلات الإنتاج <em>${runs.length} تشغيلة</em></h2>
    <div class="tblwrap"><table class="gridcols"><thead><tr><th>التاريخ</th><th>الوصفة</th><th class="n">عدد التشغيلات</th><th class="n">الناتج</th><th class="n">التكلفة</th><th class="n">تكلفة الوحدة</th><th></th></tr></thead>
    <tbody>${runs.slice().reverse().map(r=>`<tr><td class="n">${r.date}</td><td>${esc(r.name)}${r.auto?' <span class="chip b">تلقائي</span>':''}</td><td class="n">${fmt(r.batches)}</td><td class="n">${fmt(r.outQty)}</td><td class="n">${money(r.cost)}</td><td class="n">${money(r.outQty? r.cost/r.outQty : 0)}</td>
      <td>${r.id?`<button class="btn sm danger" data-act="del-run" data-id="${r.id}">تراجع</button>`:''}</td></tr>`).join('')
      ||`<tr><td colspan="7" class="empty">لسه مفيش تشغيلات</td></tr>`}</tbody></table></div>
  </div>`;
}
 
/* ================= 5. كارت الأصناف ================= */
let itSort = { by:'name', dir:1 };
let itSel = new Set(); // الأصناف المحددة للنقل الجماعي بين التصنيفات
let recQ = '';
let recCat = 'الكل';
let recSort = { by:'name', dir:1 };
function recToggleSort(by){
  if(recSort.by===by) recSort.dir*=-1; else { recSort.by=by; recSort.dir=1; }
  render();
}
function itToggleSort(by){
  if(itSort.by===by) itSort.dir*=-1; else { itSort.by=by; itSort.dir=1; }
  render();
}

function viewItems(){
  const q=(ui.q||'').trim().toLowerCase();
  let list = S.items.filter(it=>{
    if(ui.cat!=='الكل' && it.cat!==ui.cat) return false;
    if(q && !(it.name.toLowerCase().includes(q) || (it.desc||'').toLowerCase().includes(q) || (it.unit||'').toLowerCase().includes(q))) return false;
    if(ui.itOnly==='noprice' && it.price>0) return false;
    if(ui.itOnly==='nomin'   && it.min>0) return false;
    if(ui.itOnly==='low'){ const c=calc(it); const oh=c.has?c.real:c.book; if(!(it.min>0 && oh<=it.min)) return false; }
    if(ui.itOnly==='out'){ const c=calc(it); const oh=c.has?c.real:c.book; if(oh>0) return false; }
    return true;
  });

  // ترتيب حقيقي بدل الترتيب العشوائي بترتيب الإضافة
  const val = it => { const c=calc(it); return c.value; };
  const onh = it => { const c=calc(it); return c.has?c.real:c.book; };
  list.sort((a,b)=>{
    let r=0;
    if(itSort.by==='name')       r = a.name.localeCompare(b.name,'ar');
    else if(itSort.by==='cat')   r = String(a.cat).localeCompare(String(b.cat),'ar') || a.name.localeCompare(b.name,'ar');
    else if(itSort.by==='stock') r = onh(a)-onh(b);
    else if(itSort.by==='price') r = (+a.price||0)-(+b.price||0);
    else if(itSort.by==='value') r = val(a)-val(b);
    return r*itSort.dir;
  });

  // إحصائيات صحة البيانات: بتوضح فورًا إيه الناقص اللي بيخلي التقارير غلط
  const noPrice = S.items.filter(i=>!(i.price>0)).length;
  const noMin   = S.items.filter(i=>!(i.min>0)).length;
  const lowN    = S.items.filter(i=>{ const c=calc(i); const oh=c.has?c.real:c.book; return i.min>0 && oh<=i.min; }).length;
  const outN    = S.items.filter(i=>{ const c=calc(i); return (c.has?c.real:c.book)<=0; }).length;
  const totalVal= S.items.reduce((s,i)=>s+calc(i).value,0);
  const arrow = k => itSort.by===k ? (itSort.dir===1?' ▲':' ▼') : '';
  const only = ui.itOnly||'all';
  const chip = (key,label,count,cls) => `<button class="btn sm ${only===key?'p':''}" data-itonly="${key}">${label}${count!=null?` ${count}`:''}</button>`;

  const showCatCol = ui.cat==='الكل' && itSort.by!=='cat';

  return `${unitDriftPanel()}
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">إجمالي الأصناف</div><div class="v">${S.items.length}</div><div class="s">${cats().length-1} تصنيف</div></div>
    <div class="card"><div class="k">قيمة المخزون</div><div class="v">${money(totalVal)}</div><div class="s">درهم</div></div>
    <div class="card"><div class="k">من غير سعر</div><div class="v" style="color:${noPrice?'var(--red)':'var(--green)'}">${noPrice}</div><div class="s">${noPrice?'التقارير هتطلع ناقصة':'كل الأصناف مسعّرة'}</div></div>
    <div class="card"><div class="k">من غير حد أدنى</div><div class="v" style="color:${noMin?'var(--amber)':'var(--green)'}">${noMin}</div><div class="s">${noMin?'مش هتتنبّه لما تخلص':'كلها متضبطة'}</div></div>
    <div class="card"><div class="k">محتاج انتباه</div><div class="v" style="color:${(lowN+outN)?'var(--red)':'var(--green)'}">${lowN+outN}</div><div class="s">${outN} خلص · ${lowN} تحت الحد</div></div>
  </div></div></div>

  <div class="panel">
    <h2>كارت الأصناف <em>${list.length} من ${S.items.length}</em>
      <button class="btn sm g" data-act="items-export" style="margin-inline-start:auto">تصدير CSV</button>
      <button class="btn sm" data-act="import-item-catalog">استيراد بالجملة</button>
      <button class="btn sm p" data-act="new-item">صنف جديد</button></h2>
    ${categoryTabs()}
    <div class="pad">
      <div class="bar">
        <input type="text" class="grow" id="q" placeholder="دور بالاسم أو الوصف أو الوحدة…" value="${esc(ui.q)}">
        ${chip('all','الكل',S.items.length)}
        ${chip('noprice','من غير سعر',noPrice)}
        ${chip('nomin','من غير حد أدنى',noMin)}
        ${chip('low','تحت الحد',lowN)}
        ${chip('out','خلص',outN)}
      </div>
      <div class="hint" style="margin-top:8px">السعر والحد الأدنى بيتعدّلوا مباشرة من الجدول — أي تعديل بيتحفظ لوحده. دوس على عنوان أي عمود عشان ترتب بيه.</div>
      ${itSel.size?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:10px;padding:10px 12px;margin-top:10px">
        <b style="font-size:13px">${itSel.size} صنف محدد</b>
        <select id="it-movecat" style="min-width:170px">
          <option value="">— انقلهم لتصنيف —</option>
          ${cats().filter(c=>c!=='الكل').map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
          <option value="__new__">+ تصنيف جديد…</option>
        </select>
        <button class="btn sm p" data-act="it-move-cat">نقل</button>
        <button class="btn sm" data-act="it-mark-daily">تعليم "متابعة يومية"</button>
        <button class="btn sm" data-act="it-unmark-daily">إلغاء المتابعة اليومية</button>
        <button class="btn sm" data-act="it-clear-sel">إلغاء التحديد</button>
      </div>`:''}
    </div>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr>
        <th style="width:30px"><input type="checkbox" data-act="it-sel-all" ${list.length&&list.every(i=>itSel.has(i.id))?'checked':''}></th>
        <th style="cursor:pointer" data-itsort="name">الصنف${arrow('name')}</th>
        ${showCatCol?`<th style="cursor:pointer" data-itsort="cat">القسم${arrow('cat')}</th>`:''}
        <th>الوحدة</th>
        <th>الشدّ</th>
        <th class="n" style="cursor:pointer" data-itsort="stock">الرصيد${arrow('stock')}</th>
        <th class="n" style="cursor:pointer" data-itsort="price">سعر الوحدة${arrow('price')}</th>
        <th class="n">الحد الأدنى</th>
        <th class="n" style="cursor:pointer" data-itsort="value">القيمة${arrow('value')}</th>
        <th></th>
      </tr></thead>
      <tbody>${(()=>{ let lastCat=null; const colspan = showCatCol?10:9;
        return list.map(it=>{
          const c=calc(it); const onhand=c.has?c.real:c.book;
          const low=it.min>0&&onhand<=it.min; const out=onhand<=0;
          // صف عنوان التصنيف بيظهر بس لما نكون رتبين بالتصنيف — عشان مايبقاش عشوائي وسط ترتيب تاني
          const hdr = (itSort.by==='cat' && it.cat!==lastCat) ? (lastCat=it.cat, `<tr class="catrow"><td colspan="${colspan}">${esc(it.cat)}</td></tr>`) : '';
          return hdr+`<tr class="${out?'lowrow':''}">
          <td><input type="checkbox" data-itsel="${it.id}" ${itSel.has(it.id)?'checked':''}></td>
          <td><div class="iname">${esc(it.name)}</div>${(it.desc||it.note)?`<div class="idesc">${esc(it.desc||'')}${it.note?' · <span style="color:var(--amber)">'+esc(it.note)+'</span>':''}</div>`:''}</td>
          ${showCatCol?`<td><span class="chip">${esc(it.cat)}</span></td>`:''}
          <td><span class="chip">${esc(it.unit)}</span></td>
          <td>${it.packSize?`<span class="chip b">${esc(it.packUnit||'عبوة')} = ${fmt(it.packSize)}</span>`:'<span class="hint">—</span>'}</td>
          <td class="n hl">${fmt(onhand)} ${out?'<span class="chip r">خلص</span>':(low?'<span class="chip a">تحت الحد</span>':'')}</td>
          <td class="n"><input type="number" step="any" class="cell${it.price>0?' filled':''}" data-price="${it.id}" value="${it.price||''}" placeholder="—"></td>
          <td class="n"><input type="number" step="any" class="cell${it.min>0?' filled':''}" data-min="${it.id}" value="${it.min||''}" placeholder="—"></td>
          <td class="n"><b>${it.price>0?money(c.value):'<span class="hint">—</span>'}</b></td>
          <td><button class="btn sm" data-edit="${it.id}">تعديل</button></td></tr>`;
        }).join('');})()
        ||`<tr><td colspan="${showCatCol?10:9}" class="empty">مفيش أصناف مطابقة</td></tr>`}
      </tbody>
      ${list.length?`<tfoot><tr style="font-weight:700">
        <td colspan="${showCatCol?8:7}">الإجمالي</td>
        <td class="n hl">${money(list.reduce((s,i)=>s+calc(i).value,0))}</td><td></td>
      </tr></tfoot>`:''}
    </table></div>
  </div>`;
}
 
/* ================= 6. التقارير والإقفال ================= */
function viewRep(){
  const t=totals();
  const byCat={};
  for(const it of S.items){const c=calc(it); byCat[it.cat]=(byCat[it.cat]||0)+c.value;}
  const varis=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.c.has&&x.c.diff!==0&&x.it.price>0)
    .sort((a,b)=>Math.abs(b.c.diff*b.it.price)-Math.abs(a.c.diff*a.it.price)).slice(0,12);
  const low=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.it.min>0&&(x.c.has?x.c.real:x.c.book)<=x.it.min);
  const noPrice=S.items.filter(i=>!i.price).length;
  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">قيمة المخزون</div><div class="v">${money(t.value)}</div><div class="s">درهم إماراتي</div></div>
    <div class="card"><div class="k">عجز الجرد</div><div class="v" style="color:var(--red)">${money(t.lossVal)}</div><div class="s">${t.loss} صنف ناقص</div></div>
    <div class="card"><div class="k">أصناف زيادة</div><div class="v" style="color:var(--green)">${t.gain}</div><div class="s">أكتر من الدفتري</div></div>
    <div class="card"><div class="k">تحت الحد الأدنى</div><div class="v" style="color:var(--amber)">${t.low}</div><div class="s">محتاجة طلبية</div></div>
    <div class="card"><div class="k">من غير سعر</div><div class="v">${noPrice}</div><div class="s">مش داخلة في القيمة</div></div>
  </div></div></div>
 
  <div class="panel"><h2>قيمة المخزون حسب القسم</h2><div class="pad">
    ${Object.entries(byCat).map(([c,v])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(c)}</span><span class="num">${money(v)}</span></div>
      <div style="height:7px;background:#EEF2F4;border-radius:5px;overflow:hidden;margin-top:3px">
        <div style="height:100%;width:${t.value?Math.max(2,v/t.value*100):0}%;background:var(--blue)"></div></div></div>`).join('')}
  </div></div>
 
  <div class="panel"><h2>أكبر فروقات الجرد <em>بالقيمة</em></h2>
    ${varis.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>دفتري</th><th>فعلي</th><th>الفرق</th><th>قيمة الفرق</th></tr></thead>
    <tbody>${varis.map(({it,c})=>`<tr><td>${esc(it.name)}</td><td class="n">${fmt(c.book)}</td><td class="n">${fmt(c.real)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}">${c.diff>0?'+':''}${fmt(c.diff)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}"><b>${money(c.diff*it.price)}</b></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">لما تدخل الجرد الفعلي والأسعار، الفروقات هتظهر هنا مرتبة بالقيمة.</div>`}
  </div>
 
  <div class="panel"><h2>أصناف محتاجة طلبية</h2>
    ${low.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>الرصيد</th><th>الحد الأدنى</th><th>الناقص</th></tr></thead>
    <tbody>${low.map(({it,c})=>{const oh=c.has?c.real:c.book;return `<tr><td>${esc(it.name)}</td><td class="n">${fmt(oh)} ${esc(it.unit)}</td><td class="n">${fmt(it.min)}</td><td class="n neg">${fmt(it.min-oh)}</td></tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">مفيش صنف تحت الحد الأدنى — أو لسه محددتش الحدود الدنيا في كارت الأصناف.</div>`}
  </div>
 
  <div class="panel"><h2>إقفال الشهر</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">الإقفال بيخلي <b>الجرد الفعلي</b> هو رصيد أول المدة للشهر الجاي، ويحفظ نسخة من ${periodLabel(S.period)} في الأرشيف، ويفضّي الوارد والمنصرف. الأصناف اللي متجردتش هتاخد رصيدها الدفتري.</div>
    <div class="hint" style="margin-bottom:10px;background:#FCF6EA;border:1px solid #EDD9AE;border-radius:8px;padding:9px">
      <b>عشان بياناتك متضيعش خالص:</b> النظام بيحفظ لوحده جوا المتصفح، بس ده مش مضمون ١٠٠٪.
      خليك دايمًا فاتح <b>نفس الملف بالظبط</b> من نفس المكان (متنزّلش نسخة جديدة كل مرة)، من نفس المتصفح، من غير تصفح خفي.
      وكل ما تخلص شغل، دوس <b>«حفظ نسخة»</b> فوق واحفظ الملف اللي بينزل في مكان ثابت — ده أضمن حاجة عندك، مش أي حفظ تلقائي.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn p" data-act="close-month">إقفال ${periodLabel(S.period)}</button>
      ${S.closed.length?`<button class="btn danger" data-act="undo-close">تراجع عن آخر إقفال (${periodLabel(S.closed[S.closed.length-1].period)})</button>`:''}
      <button class="btn" data-act="export">تنزيل الجرد CSV</button>
      <button class="btn g" data-act="backup">تنزيل نسخة احتياطية${BK.dirty>0?` (${BK.dirty} تعديل من غير حفظ)`:''}</button>
      <label class="btn" style="display:inline-flex;align-items:center">استرجاع نسخة
        <input type="file" id="restore" accept=".json,application/json" style="display:none"></label>
      <button class="btn danger" data-act="reset">إعادة ضبط كل البيانات</button>
    </div>
    ${S.closed.length?`<div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">الشهور المقفولة</div>
      ${S.closed.slice().reverse().map(p=>`<span class="chip b" style="margin-inline-end:6px">${periodLabel(p.period)} · ${money(p.value)} د.إ</span>`).join('')}</div>`:''}
  </div></div>

  ${S.closed.length?`<div class="panel"><h2>أرشفة الحركات التفصيلية القديمة</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">
      إقفال الشهر بيصفّي الشاشة عندك بس — <b>الحركات التفصيلية (كل عملية وارد ومنصرف) بتفضل متراكمة في قاعدة البيانات للأبد</b> حتى بعد الإقفال، وده اللي بيحمّل عليك بمرور الوقت.
      قيمة المخزون النهائية لكل شهر مقفول <b>محفوظة دايمًا</b> في الأرشيف فوق مهما حذفت — مش هتضيع.
    </div>
    <div class="warnbar" style="margin-bottom:12px">
      ⚠️ الحذف نهائي ومش هيترجع. لو حذفت حركات شهر، مش هتقدر تشوف تفاصيلها بعد كده ولا تعمل "تراجع عن الإقفال" ليه — بس رصيده النهائي هيفضل في الأرشيف زي ما هو.
      متحذفش غير الشهور القديمة اللي متأكد إنك مش محتاج ترجعلها.
    </div>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>الشهر</th><th>القيمة النهائية</th><th class="n">عدد الحركات</th><th></th></tr></thead>
      <tbody>${S.closed.slice().reverse().map(p=>{
        const sizeInfo = ARCHIVE_SIZES[p.period];
        return `<tr>
          <td><div class="iname">${periodLabel(p.period)}</div></td>
          <td class="n">${money(p.value)}</td>
          <td class="n">${sizeInfo!==undefined?`${sizeInfo} حركة`:`<button class="btn sm" data-act="archive-size" data-period="${esc(p.period)}">احسب العدد</button>`}</td>
          <td>${sizeInfo?`<button class="btn sm danger" data-act="archive-delete" data-period="${esc(p.period)}">احذف حركات الشهر ده</button>`:(sizeInfo===0?'<span class="hint">مفيش حركات</span>':'')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div></div>`:''}
  `;
}
 
/* ================= 7. قاعدة البيانات ================= */

    `:`<div class="hint">لازم تتصل بالقاعدة الأول عشان الرابط يشتغل.</div>`}

      <li>افتح الرابط، روح تبويب «المصانع» هنا، واضغط «ارفع اللي عندي دلوقتي» عشان الأصناف تتسجل في القاعدة.</li>
    </ol>

  </div></div>`;
}
 
/* ================= 8. الصلاحيات والأقفال ================= */
function viewSec(){
  const nL=TABS.filter(t=>isLocked(t[0])).length;
  return `
  <div class="panel">
    <h2>أقفال التبويبات <em>${nL} من ${TABS.length} مقفول</em></h2>
    <div class="pad" style="border-bottom:1px solid var(--line)">
      <div class="hint">حط باسورد لأي تبويب عشان محدش يفتحه غيرك. لما حد يضغط عليه هيتطلب منه الباسورد، ولما يدخله يفضل مفتوح لحد ما تضغط <b>«قفل الجلسة»</b> أو تقفل الصفحة.</div>
    </div>
    ${TABS.map(([k,v])=>{
      const L=isLocked(k), open=canOpen(k);
      return `<div class="lockrow">
        <span class="nm">${v}</span>
        ${L?`<span class="chip ${open?'g':'r'}">${open?'مفتوح دلوقتي':'مقفول'}</span>`:`<span class="chip">من غير باسورد</span>`}
        ${(!L||open)?`
          <input type="password" class="cell" style="width:130px" data-pw="${k}" placeholder="${L?'باسورد جديد':'اكتب الباسورد'}">
          <button class="btn sm p" data-act="set-lock" data-k="${k}">${L?'تغيير':'اقفل'}</button>
          ${L?`<button class="btn sm danger" data-act="remove-lock" data-k="${k}">شيل القفل</button>`:''}
        `:`<button class="btn sm" data-act="ask-unlock" data-k="${k}">افتح بالباسورد</button>`}
      </div>`;}).join('')}
  </div>

function unitConvUI(){

  const f=+document.getElementById('f-conv').value, q=+document.getElementById('f-open').value||0, p=+document.getElementById('f-price').value||0;

// بيسترجع تسويات قديمة اتعملت قبل ميزة الحفظ، من الحركات الفعلية اللي لسه موجودة في السجل
// (أي حركة عليها علامة "تسوية جرد")، ويجمّعها حسب التاريخ عشان تقدر تطبعها زي لو كانت متحفوظة
function reconstructSettlementsFromMoves(){
  const settleMoves = S.moves.filter(m=>m.reason==='تسوية جرد' || String(m.party||'').startsWith('تسوية جرد'));
  const byBatch = {}; // لو الحركة عليها settleBatch، بنجمع بيه؛ وإلا بنجمع حسب التاريخ بس
  settleMoves.forEach(m=>{
    const key = m.settleBatch || ('date:'+m.date);
    if(!byBatch[key]) byBatch[key] = { date:m.date, moves:[] };
    byBatch[key].moves.push(m);
  });
  return Object.values(byBatch).map(g=>{
    const items = g.moves.map(m=>{
      const it = item(m.itemId);
      const diff = m.dir==='in' ? m.qty : -m.qty; // وارد = زيادة، منصرف = نقصان
      return { name: it?it.name:'صنف محذوف', unit: it?it.unit:'', diff:n2(diff), value:n2(diff*(m.price||(it?it.price:0)||0)),
        book:null, actual:null }; // مش عندنا الدفتري/الفعلي الأصليين، بس الفرق والقيمة دقيقين من الحركة نفسها
    });
    return { date:g.date, items, takenAt:null, reconstructed:true };
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

/* ================= نسخ احتياطية خارج Supabase (على خادم Google — مكان مستقل تمامًا) ================= */
// بنستخدم نفس خادم Google اللي تطبيق الفروج شغال عليه، لكل المصانع. لو Supabase كله وقع أو الحساب اتقفل، النسخ دي بتفضل موجودة.
const EXT_BK = (()=>{ const cfg = Object.values(BRANCH_APP_CONFIG||{})[0]; return cfg && cfg.gscriptUrl ? {url:cfg.gscriptUrl, token:cfg.secretToken} : null; })();
const EXT_CHUNK = 40000; // خلية Google Sheets حدها 50 ألف حرف، فبنقسّم النسخة على أجزاء أصغر من كده
const EXT_KEEP = 14;
let EXT_LIST = []; let extLoaded = false; let EXT_BUSY = false;
const extPrefix = () => 'fac_backup:'+FACTORY+':';
async function extReq(params){
  if(!EXT_BK) throw new Error('مفيش خادم خارجي متعرّف');
  const res = await fetch(EXT_BK.url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({...params, token:EXT_BK.token}).toString() });
  if(!res.ok) throw new Error('تعذر الاتصال بخادم Google');
  const data = await res.json();
  if(!data.success && data.error && data.error!=='not_found') throw new Error(data.error);
  return data;
}
async function extGet(key){ const r=await extReq({action:'get',key}); return r.success? r.value : null; }
async function extSet(key,value){
  for(let t=0;t<3;t++){ try{ const r=await extReq({action:'set',key,value}); if(r.success) return true; }catch(e){ if(t===2) throw e; }
    await new Promise(r=>setTimeout(r,800*(t+1))); }
  return false;
}
async function extDel(key){ try{ await extReq({action:'delete',key}); }catch(e){} }
function buildSnapshot(){
  return { factory:FACTORY, period:S.period, items:S.items, recipes:S.recipes, moves:S.moves, counts:S.counts, runs:S.runs||[],
    takenAt:new Date().toISOString(), version:1 };
}
async function extListLoad(){
  try{ const v = await extGet(extPrefix()+'index'); EXT_LIST = v? JSON.parse(v) : []; }catch(e){ EXT_LIST = []; }
  extLoaded = true;
}
// بتتنادى تلقائي بعد تحميل النظام — مرة واحدة في اليوم لكل مصنع، في الخلفية
async function maybeExternalBackup(force){
  if(!EXT_BK || EXT_BUSY) return false;
  EXT_BUSY = true;
  try{
    const d = today();
    let idx = [];
    try{ const v = await extGet(extPrefix()+'index'); idx = v? JSON.parse(v) : []; }catch(e){ return false; } // لو مش قادرين نقرأ الفهرس، منكتبش حاجة
    if(!force && idx.some(x=>x.date===d)) return false;
    const txt = JSON.stringify(buildSnapshot());
    const parts = []; for(let i=0;i<txt.length;i+=EXT_CHUNK) parts.push(txt.slice(i,i+EXT_CHUNK));
    for(let i=0;i<parts.length;i++){ if(!await extSet(extPrefix()+d+':p'+i, parts[i])) throw new Error('فشل حفظ جزء '+(i+1)); }
    // الفهرس بيتكتب في الآخر خالص — كده أي نسخة ظاهرة في القايمة مضمون إنها كاملة
    const entry = { date:d, parts:parts.length, items:S.items.length, recipes:S.recipes.length, moves:S.moves.length, takenAt:new Date().toISOString() };
    idx = [entry, ...idx.filter(x=>x.date!==d)];
    const keep = idx.slice(0,EXT_KEEP), drop = idx.slice(EXT_KEEP);
    await extSet(extPrefix()+'index', JSON.stringify(keep));
    for(const o of drop){ for(let i=0;i<(o.parts||0);i++) await extDel(extPrefix()+o.date+':p'+i); }
    EXT_LIST = keep; extLoaded = true;
    return true;
  }catch(e){ return false; }
  finally{ EXT_BUSY = false; }
}
async function extLoadSnapshot(date){
  const e = EXT_LIST.find(x=>x.date===date); if(!e) throw new Error('النسخة مش موجودة');
  let txt=''; for(let i=0;i<e.parts;i++){ const p = await extGet(extPrefix()+date+':p'+i); if(p==null) throw new Error('جزء ناقص من النسخة ('+(i+1)+')'); txt+=p; }
  return JSON.parse(txt);
}
async function applySnapshot(snap){
  if(!snap || !Array.isArray(snap.items)) throw new Error('الملف مش نسخة احتياطية صالحة');
  if(snap.factory && snap.factory!==FACTORY && !confirm(`النسخة دي تبع مصنع تاني (${snap.factory}). متأكد إنك عايز تسترجعها هنا؟`)) return false;

  await saveMain(); await saveTx(); if(DB.on) await pushAll(true);
  return true;
}

// الكمية المقترحة بترجّع الرصيد لضعف الحد الأدنى، ولو الصنف ليه وحدة بديلة (كرتونة مثلًا) بنقرّبها لعدد عبوات كامل.
function purchaseSuggestions(){
  const open = new Set(PURCHASE_REQUESTS.filter(r=>r.status==='pending'||r.status==='approved').map(r=>r.itemId));
  return S.items.filter(it=>+it.min>0 && !open.has(it.id)).map(it=>{
    const book = calc(it).book;
    if(book >= +it.min) return null;
    let qty = n2(Math.max(+it.min*2 - book, +it.min));
    let packNote = '';
    if(it.packSize>0 && it.packUnit){
      const packs = Math.ceil(qty/it.packSize);
      qty = n2(packs*it.packSize);
      packNote = `${packs} ${it.packUnit}`;
    }
    return { it, book, qty, packNote };
  }).filter(Boolean).sort((a,b)=>(a.book/a.it.min)-(b.book/b.it.min));
}

/* المورد الافتراضي للصنف: أحدث مورد اتعامل معاه — سواء في طلب شراء قبل كده أو في وارد الشهر ده.
   طلبات الشراء محفوظة على طول (مش بتتمسح مع الإقفال)، فالنظام بيفتكر المورد حتى في أول يوم في الشهر */
/* الوحدات اللي ينفع الطلب بيها: الوحدة الأساسية + العبوة (زي طبق) + وحدة الشراء (زي كرتونة) */
function prUnitsOf(it){
  if(!it) return [];
  const u=[{key:'base', name:it.unit||'وحدة', size:1}];
  if(it.packUnit && it.packSize>0) u.push({key:'pack', name:it.packUnit, size:+it.packSize});
  const b=BUY_UNITS[it.id]; if(b && b.unit && b.size>0 && !u.some(x=>x.name===b.unit)) u.push({key:'buy', name:b.unit, size:+b.size});
  return u;
}
function prCurItem(){ const pi=document.getElementById('pr-item'); if(!pi) return null; return S.items.find(i=>arNorm(i.name)===arNorm(pi.value))||null; }
function prFillUnits(it, prefer){
  const pu=document.getElementById('pr-u'); if(!pu) return;
  const us=prUnitsOf(it);
  pu.innerHTML = it ? us.map(u=>`<option value="${u.key}">${esc(u.name)}</option>`).join('')+`<option value="__new">+ وحدة شراء…</option>` : '<option value="base">—</option>';
  if(it){ pu.value = prefer || (us.find(u=>u.key==='buy')?'buy':'base'); }
  prHint();
}
function prHint(){
  const pk=document.getElementById('pr-pack'); if(!pk) return;
  const it=prCurItem(); const pu=document.getElementById('pr-u'); const q=+(document.getElementById('pr-qty')||{}).value||0;
  if(!it){ pk.textContent=''; return; }
  const u=prUnitsOf(it).find(x=>x.key===(pu&&pu.value))||prUnitsOf(it)[0];
  pk.innerHTML = u.size!==1 ? `1 ${esc(u.name)} = ${fmt(u.size)} ${esc(it.unit)}${q>0?` · الإجمالي <b>${fmt(q*u.size)}</b> ${esc(it.unit)}`:''}` : '';
}
async function prNewBuyUnit(it){
  const name=(prompt(`اسم وحدة الشراء لـ"${it.name}" (زي: كرتونة، شوال، جالون):`,'كرتونة')||'').trim();
  if(!name){ prFillUnits(it); return; }

/* ================= بحث أصناف ذكي (بدل قايمة المتصفح) =================
   بيطبّع الحروف (أ/إ/آ→ا، ة→ه، ى→ي، ذ→د …) وبيدوّر: بداية الاسم، بداية كلمة، جزء من الاسم،
   وحروف بالترتيب (فخد ← افخاد). وبيرتب النتايج من الأقرب للأبعد */
function arNorm(t){ return String(t||'').toLowerCase().replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
  .replace(/ذ/g,'د').replace(/ث/g,'ت').replace(/ظ/g,'ض').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim(); }
function _subseq(q,t){ let i=0; for(const ch of t){ if(ch===q[i]) i++; if(i===q.length) return true; } return i===q.length; }
function itemSearch(q, limit){
  const nq=arNorm(q); if(!nq) return [];
  const res=[];
  for(const it of S.items){
    const n=arNorm(it.name), d=arNorm(it.desc||'');
    let sc=0;
    if(n.startsWith(nq)) sc=100;
    else if(n.split(/[\s\-–—/()]+/).some(w=>w.startsWith(nq))) sc=80;
    else if(n.includes(nq)) sc=60;
    else if(d.includes(nq)) sc=40;
    else if(nq.length>=2 && nq.split(' ').every(p=>n.split(/[\s\-–—/()]+/).some(w=>_subseq(p,w)))) sc = _subseq(nq.split(' ')[0], n.split(/[\s\-–—/()]+/)[0]) ? 30 : 25;
    else if(nq.length>=3 && _subseq(nq.replace(/ /g,''),n.replace(/ /g,''))) sc=15;
    if(sc) res.push({it,sc});
  }
  res.sort((a,b)=>b.sc-a.sc || a.it.name.length-b.it.name.length);
  return res.slice(0,limit||30).map(r=>r.it);
}
function itemPickerHtml(id, placeholder){
  return `<div class="ipk" style="position:relative"><input type="text" id="${id}" autocomplete="off" placeholder="${esc(placeholder||'اكتب اسم الصنف…')}" style="width:100%">
    <div class="ipk-list" id="${id}-list" hidden></div></div>`;
}
function bindItemPicker(id, onPick){
  const inp=document.getElementById(id), box=document.getElementById(id+'-list'); if(!inp||!box) return;
  let hits=[], act=0;
  const draw=()=>{
    hits=itemSearch(inp.value, 40); act=Math.min(act,Math.max(0,hits.length-1));
    if(!inp.value.trim()){ box.hidden=true; return; }
    box.innerHTML = hits.length ? hits.map((it,i)=>`<div class="ipk-row${i===act?' on':''}" data-i="${i}"><div class="ipk-n">${esc(it.name)}</div><div class="ipk-h">${esc(it.cat||'')} · ${esc(it.unit||'')}</div></div>`).join('')
      : `<div class="ipk-empty">مفيش صنف بالاسم ده</div>`;
    box.hidden=false;
    const onEl=box.querySelector('.ipk-row.on'); if(onEl) onEl.scrollIntoView({block:'nearest'});
  };
  const pick=i=>{ const it=hits[i]; if(!it) return; inp.value=it.name; box.hidden=true; onPick&&onPick(it); };
  inp.oninput=()=>{ act=0; draw(); const exact=S.items.find(i=>arNorm(i.name)===arNorm(inp.value)); if(exact && onPick) onPick(exact,true); };
  inp.onfocus=()=>{ if(inp.value.trim()) draw(); };
  inp.onblur=()=>setTimeout(()=>{ box.hidden=true; },180);
  inp.onkeydown=e=>{
    if(box.hidden && e.key==='ArrowDown'){ draw(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); act=Math.min(act+1,hits.length-1); draw(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); act=Math.max(act-1,0); draw(); }
    else if(e.key==='Enter'){ if(!box.hidden && hits.length){ e.preventDefault(); pick(act); } }
    else if(e.key==='Escape'){ box.hidden=true; }
  };
  box.onmousedown=e=>{ const r=e.target.closest('.ipk-row'); if(r){ e.preventDefault(); pick(+r.dataset.i); } };
}

/* ربط الوارد بطلبات الشراء الموافق عليها:
   - بندوّر على طلب موافق عليه لنفس الصنف (نفس المورد الأول، وبعدين الأقدم)
   - بنجمع الكمية اللي وصلت على الطلب؛ لو وصل كله (أو 98% منه) يتقفل "اتورّد"، ولو جزء يفضل مفتوح ويبان "وصل X من Y"
   - لو الكمية أكتر من الطلب، الزيادة بتروح على الطلب اللي بعده لنفس الصنف */
async function applyPurchaseReceipt(itemId, qty, supplier, moveId, moveDate){
  if(DB.on && !purReqLoaded){ try{ await fetchPurchaseRequests(); }catch(e){} }
  let left=+qty||0; const msgs=[];
  const md = String(moveDate||today());
  // الوارد بيتخصم بس من طلب ميعاد توصيله جه (تاريخ التوصيل ≤ تاريخ الوارد).
  // طلب من غير تاريخ توصيل: لازم يكون اتعمل قبل يوم الوارد — عشان طلبية امبارح اللي بتوصل النهاردة ما تتخصمش من طلب بكرة
  const due = r => r.needDate ? String(r.needDate) <= md : String(r.createdAt||'').slice(0,10) < md;
  const open = PURCHASE_REQUESTS.filter(r=>r.itemId===itemId && r.status==='approved' && due(r))
    .sort((a,b)=>((b.supplier===supplier)-(a.supplier===supplier)) || String(a.createdAt).localeCompare(String(b.createdAt)));
  for(const r of open){
    if(left<=0) break;
    const need = Math.max(0, (+r.qty||0) - (+r.receivedQty||0));
    const take = Math.min(need, left); if(take<=0) continue;
    r.receivedQty = n2((+r.receivedQty||0)+take); left=n2(left-take);
    (r.moveIds=r.moveIds||[]).push(moveId); r.linkedMoveId=moveId;
    if(r.receivedQty >= (+r.qty||0)*0.98){ r.status='fulfilled'; r.fulfilledAt=new Date().toISOString(); msgs.push('اتقفل طلب الشراء بتاعه ✓'); }
    else msgs.push(`وصل ${fmt(r.receivedQty)} من ${fmt(r.qty)} ${r.unit||''} من طلب الشراء — الباقي لسه مستني`);
  }
  if(msgs.length) await savePurchaseRequests();
  return msgs;
}
function openPurchaseFor(itemId){ return PURCHASE_REQUESTS.filter(r=>r.itemId===itemId && r.status==='approved'); }

    if(name!==r.itemName) name+='…';
    x.fillText(name, W-P-90, y+50);
    x.textAlign='left'; x.fillStyle=B.dark; x.font=F(700,32); x.direction='rtl';

    y+=rowH;
  });
  y+=30;
  if(note){ x.fillStyle=B.soft; x.fillRect(P,y,W-2*P,70); x.fillStyle=B.dark; x.font=F(500,26); x.fillText('ملاحظة: '+note, W-P-24, y+45); y+=90; }

  return await new Promise(res=>c.toBlob(res,'image/png'));
}

/* ================= إرسال طلب الشراء للمورد على واتساب ================= */
function waNormPhone(p){
  let d=String(p||'').replace(/[^\d+]/g,'').replace(/^\+/,'').replace(/^00/,'');
  if(/^05\d{8}$/.test(d)) d='971'+d.slice(1);        // رقم إماراتي مكتوب 05xxxxxxxx
  else if(/^5\d{8}$/.test(d)) d='971'+d;              // 5xxxxxxxx
  return d;
}
function prWaText(rs){
  // رسالة بهوية المصنع — كل سطر بيبدأ بعلامة اتجاه يمين-لشمال (RLM) عشان الأرقام والأسامي الإنجليزي ما يقلبوش السطر
  const R='\u200F';
  const fac=(FACTORIES.find(f=>f.id===FACTORY)||{name:''}).name||'';
  const BRAND={'kunafa':{name:'بابا كنافة', icon:'🍯'}, 'مصنع-الفروج':{name:'فروج أبو العبد', icon:'🔥'}}[FACTORY]||{name:fac, icon:'🏭'};
  const key=prGroupKey(rs[0]); const d=new Date(rs[0].createdAt||Date.now());
  const po='PO-'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'-'+String(key).replace(/[^a-z0-9]/gi,'').slice(-3).toUpperCase();
  const LINE=R+'━━━━━━━━━━━━━━━━';
  const items=rs.map(r=>{ const size=+r.orderSize||1, U=r.orderUnit||r.unit||'';
    const remain=Math.max(0,(+r.qty||0)-(+r.receivedQty||0));
    return `${R}▫️ ${r.itemName}  ⟵  *${fmtP(n2(remain/size))} ${U}*`; });
  const note=rs.find(r=>r.note)?.note;
  return [
    `${R}${BRAND.icon} *${BRAND.name}*`,
    (fac && fac!==BRAND.name) ? `${R}_${fac}_` : null,
    LINE,
    `${R}📋 *أمر شراء*  ${po}`,
    `${R}📅 التاريخ: ${d.toLocaleDateString('en-GB')}`,
    rs[0].needDate?`${R}🚚 *مطلوب التوصيل: ${new Date(rs[0].needDate+'T12:00').toLocaleDateString('en-GB')}*`:null,
    rs[0].supplier?`${R}🏷️ المورد: *${rs[0].supplier}*`:null,
    LINE,
    ...items,
    LINE,
    `${R}📦 عدد الأصناف: *${rs.length}*`,
    note?`${R}📝 ملاحظة: ${note}`:null,
    '',
    `${R}برجاء تأكيد الطلب وموعد التوصيل 🙏`,
    `${R}_قسم المشتريات — ${BRAND.name}_`
  ].filter(x=>x!==null).join('\n');
}

function parseInRecoverySheet(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {rows:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
  const looksLikeHeader = /تاريخ|صنف|date|item/i.test(firstCells.join(' '));
  const start = looksLikeHeader ? 1 : 0;

  const norm = s => String(s||'').trim().toLowerCase();
  const rows = []; const errors = [];
  for(let i=start;i<lines.length;i++){
    const c = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const [rawDate, name, qty, price, party] = c;
    if(!name) continue;
    const date = parseDateFlexible(rawDate);
    if(!date){ errors.push(`سطر ${i+1}: تاريخ غير مفهوم (${rawDate})`); continue; }
    const q = +qty;
    if(!(q>0)){ errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); continue; }
    const match = S.items.find(it=>norm(it.name)===norm(name));
    // لو الشيت مفيهوش سعر لهذا الصف، نستخدم سعر الصنف المسجل عندك في الكارت بدل ما نسجّله صفر
    const sheetPrice = +price;
    const finalPrice = sheetPrice>0 ? sheetPrice : (match ? +match.price||0 : 0);
    rows.push({ date, name, qty:q, price:finalPrice, party:party||'', match });
  }
  return {rows, errors};
}

function renderInRecoveryPreview(){
  const text = ($('#iri-text')||{value:''}).value;

      </tr>`).join('')}</tbody></table></div>
      <button class="btn p" data-act="iri-apply" style="width:100%;margin-top:12px" ${!matched?'disabled':''}>استيراد ${matched} حركة وارد</button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset));

  const norm = s => String(s||'').trim().toLowerCase();
  ui.rlines = [...box.querySelectorAll('.rline')].map(el=>{
    const nameEl = el.querySelector('[data-rl]');
    const qtyEl  = el.querySelector('[data-rq]');
    const it = nameEl ? S.items.find(i=>norm(i.name)===norm(nameEl.value)) : null;
    return { itemId: it? it.id : '', qty: qtyEl? qtyEl.value : '', raw: nameEl? nameEl.value : '' };
  });
}
