async function faroojRequest(params){
  if(!BRANCH_APP) throw new Error('المصنع ده معندوش تطبيق فروع متربط بيه لسه');
  const res = await fetch(BRANCH_APP.gscriptUrl, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({...params, token: BRANCH_APP.secretToken}).toString()
  });
  if(!res.ok) throw new Error('تعذر الاتصال بتطبيق الفروع');
  const data = await res.json();
  if(!data.success && data.error && data.error !== 'not_found') throw new Error(data.error);
  return data;
}
async function faroojList(prefix){
  const r = await faroojRequest({action:'list', prefix});
  return r.success ? (r.keys||[]) : [];
}
async function faroojGet(key){
  const r = await faroojRequest({action:'get', key});
  return r.success ? r.value : null;
}
// الجسر بقى ليه صلاحية كتابة كمان، عشان تعديل الطلبية من المصنع يوصل فعليًا لطلبية الفرع
async function faroojSet(key, value){
  const r = await faroojRequest({action:'set', key, value});
  return !!r.success;
}
function faroojDateRange(from, to){
  const dates=[]; let d=new Date(from+'T00:00:00'); const end=new Date(to+'T00:00:00'); let g=0;
  while(d<=end && g<60){ dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); g++; }
  return dates;
}

let BO = { from:'', to:'', loading:false, err:'', totals:{}, orders:[], ordersCount:0, branchesCount:0, view:'totals', openOrder:null, changes:[], changesCount:0, shortages:[], shortagesCount:0, matrixQ:'' };

async function fetchBranchOrders(){
  BO.loading=true; BO.err=''; render();
  try{
    const dates = faroojDateRange(BO.from, BO.to);
    const listResults = await Promise.all(dates.map(d=>faroojList(`${BRANCH_APP.keyPrefix}:${d}:`)));
    const allKeys = listResults.flat();
    const results = await Promise.all(allKeys.map(k=>faroojGet(k).catch(()=>null)));
    const totals={}; const branches=new Set(); const orders=[]; let ordersCount=0;
    results.forEach((v,i)=>{
      if(!v) return;
      let data; try{ data=JSON.parse(v); }catch(e){ return; }
      ordersCount++; branches.add(data.branch);
      orders.push({...data, _key: allKeys[i]}); // بنحتفظ بمفتاح السجل عشان نقدر نكتب فيه التعديل
      (data.items||[]).forEach(it=>{
        if(!totals[it.name]) totals[it.name]={name:it.name, unit:it.unit, qty:0};
        totals[it.name].qty = n2(totals[it.name].qty + (+it.qty||0));
      });
    });
    orders.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    BO.totals=totals; BO.orders=orders; BO.ordersCount=ordersCount; BO.branchesCount=branches.size;
  }catch(e){ BO.err=e.message; }
  await fetchFactoryChangeRequests();
  await fetchFactoryShortageReports();
  BO.loading=false; render();
}

async function fetchFactoryChangeRequests(){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_change:index`);
    const index = idxVal ? JSON.parse(idxVal) : [];
    const sorted = index.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const details = await Promise.all(sorted.map(r=>faroojGet(`${BRANCH_APP.keyPrefix}_change:${r.id}`).catch(()=>null)));
    BO.changes = sorted.map((r,i)=>{
      let note='-';
      try{ if(details[i]) note = JSON.parse(details[i]).note || '-'; }catch(e){}
      return {...r, note};
    });
    BO.changesCount = BO.changes.filter(r=>r.status==='pending').length;
  }catch(e){ BO.changes=[]; BO.changesCount=0; }
}

// بلاغات نواقص الاستلام: الفرع بيبلّغ لما صنف من الفاتورة يوصله ناقص أو مايوصلوش خالص
async function fetchFactoryShortageReports(){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_shortage:index`);
    const index = idxVal ? JSON.parse(idxVal) : [];
    const sorted = index.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const details = await Promise.all(sorted.map(r=>faroojGet(`${BRANCH_APP.keyPrefix}_shortage:${r.id}`).catch(()=>null)));
    BO.shortages = sorted.map((r,i)=>{
      let items=[];
      try{ if(details[i]) items = JSON.parse(details[i]).items || []; }catch(e){}
      return {...r, items};
    });
    BO.shortagesCount = BO.shortages.filter(r=>r.status==='pending').length;
  }catch(e){ BO.shortages=[]; BO.shortagesCount=0; }
}

async function decideFactoryShortageReport(id, decision){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_shortage:index`);
    let index = idxVal ? JSON.parse(idxVal) : [];
    const idx = index.findIndex(r=>r.id===id);
    if(idx===-1) return;
    index[idx].status = decision;
    const ok = await faroojSet(`${BRANCH_APP.keyPrefix}_shortage:index`, JSON.stringify(index));
    if(!ok) throw new Error();
    try{
      const fullVal = await faroojGet(`${BRANCH_APP.keyPrefix}_shortage:${id}`);
      if(fullVal){ const obj=JSON.parse(fullVal); obj.status=decision; await faroojSet(`${BRANCH_APP.keyPrefix}_shortage:${id}`, JSON.stringify(obj)); }
    }catch(e){}
    toast(decision==='resolved' ? 'اتعلّم البلاغ إنه اتحل' : 'اترفض البلاغ');
    await fetchFactoryShortageReports();
    render();
  }catch(e){ toast('حصل خطأ أثناء تحديث الحالة، حاول تاني',1); }
}

async function decideFactoryChangeRequest(id, decision){
  try{
    const idxVal = await faroojGet(`${BRANCH_APP.keyPrefix}_change:index`);
    let index = idxVal ? JSON.parse(idxVal) : [];
    const idx = index.findIndex(r=>r.id===id);
    if(idx===-1) return;
    index[idx].status = decision;
    const ok = await faroojSet(`${BRANCH_APP.keyPrefix}_change:index`, JSON.stringify(index));
    if(!ok) throw new Error();
    try{
      const fullVal = await faroojGet(`${BRANCH_APP.keyPrefix}_change:${id}`);
      if(fullVal){ const obj=JSON.parse(fullVal); obj.status=decision; await faroojSet(`${BRANCH_APP.keyPrefix}_change:${id}`, JSON.stringify(obj)); }
    }catch(e){}
    toast(decision==='done' ? 'اتعلّم الطلب إنه اتعمل' : 'اترفض الطلب');
    await fetchFactoryChangeRequests();
    render();
  }catch(e){ toast('حصل خطأ أثناء تحديث الحالة، حاول تاني',1); }
}

// كاش بسيط عشان مش نكرر حساب أقرب تطابق لنفس اسم الصنف كذا مرة (زي لما نفس الصنف يتكرر في 24 فرع)
// بيتصفّر تلقائي لو كارت الأصناف اتغيّر (بنقارن طوله كإشارة سريعة للتغيير)
let _matchCache = new Map();
let _matchCacheItemsLen = -1;
function findMatchingLocalItem(faroojName){
  if(_matchCacheItemsLen !== S.items.length){ _matchCache = new Map(); _matchCacheItemsLen = S.items.length; }
  if(_matchCache.has(faroojName)) return _matchCache.get(faroojName);
  if(S.boMap && S.boMap[faroojName]) {
    const m=item(S.boMap[faroojName]);
    if(m){ _matchCache.set(faroojName, m); return m; }
  }
  const norm = s => String(s||'').trim().toLowerCase();
  const exact = S.items.find(i=>norm(i.name)===norm(faroojName));
  if(exact){ _matchCache.set(faroojName, exact); return exact; }
  // مفيش تطابق حرفي: نقترح أقرب صنف تلقائي لحد ما المستخدم يثبّته بنفسه
  const best = suggestItemsFor(faroojName, 1)[0];
  const result = (best && best.score>=0.62) ? best.item : null;
  _matchCache.set(faroojName, result);
  return result;
}
// هل الصنف الحالي مقترح تلقائي (مش مثبّت من المستخدم ولا تطابق حرفي)؟
function boMatchIsSuggested(faroojName){
  if(S.boMap && S.boMap[faroojName]) return false;
  const norm = s => String(s||'').trim().toLowerCase();
  if(S.items.some(i=>norm(i.name)===norm(faroojName))) return false;
  return !!findMatchingLocalItem(faroojName);
}
// تطبيع أسماء الوحدات: نفس الوحدة بتتكتب بأشكال مختلفة (حبه/حبة، باكت/باكيت، كرتونه/كرتون)
function normUnit(u){
  let s = String(u||'').trim().toLowerCase();
  s = s.replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ');
  s = s.replace(/ة/g,'ه').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي');
  const map = {
    'حبه':'حبه','حبات':'حبه','pcs':'حبه','pc':'حبه',
    'باكت':'باكت','باكيت':'باكت','باكية':'باكت','pkt':'باكت','packet':'باكت',
    'كرتون':'كرتون','كرتونه':'كرتون','كرتونة':'كرتون','carton':'كرتون','ctn':'كرتون',
    'علبه':'علبه','علبة':'علبه','box':'علبه',
    'كيلو':'كيلو','كجم':'كيلو','kg':'كيلو','كيلوجرام':'كيلو','كيلوغرام':'كيلو',
    'لتر':'لتر','ltr':'لتر','l':'لتر',
    'جالون':'جالون','gallon':'جالون',
    'سطل':'سطل','bucket':'سطل',
  };
  return map[s] || s;
}
// وحدة الفرع للصنف ده (زي ما جات في الطلبية)
function branchUnitOf(faroojName){
  const r = BO.totals[faroojName];
  return r ? String(r.unit||'').trim() : '';
}
// معامل التحويل: كمية الفرع × المعامل = كمية المصنع. لو الوحدتين متطابقتين (بعد التطبيع) المعامل = 1 تلقائي
function convFactorOf(faroojName){
  const m = findMatchingLocalItem(faroojName);
  if(!m) return null;
  const bu = normUnit(branchUnitOf(faroojName)), fu = normUnit(m.unit);
  if(bu && fu && bu === fu) return 1;
  // لو وحدة الفرع مطابقة للوحدة البديلة (الشدّ) المسجلة على الصنف نفسه، نحسب المعامل تلقائي من غير ما نطلب إدخال يدوي —
  // نفس الوحدة البديلة دي بتستخدم في الجرد كمان، عشان تبقى موحّدة في النظام كله
  if(bu && m.packUnit && m.packSize>0 && normUnit(m.packUnit)===bu) return m.packSize;
  const saved = S.boConv ? S.boConv[faroojName] : undefined;
  return (saved!==undefined && saved!=='' && +saved>0) ? +saved : null; // null = محتاج تحديد
}
// هل الصنف ده جاهز للصرف فعليًا؟ (متطابق + وحدته واضحة)
function boReadyToDispense(faroojName){
  return !!findMatchingLocalItem(faroojName) && convFactorOf(faroojName)!==null;
}
// الكمية الحقيقية بوحدة المصنع
function boFactoryQty(faroojName, branchQty){
  const f = convFactorOf(faroojName);
  return f===null ? null : n2(branchQty * f);
}

// مفتاح فريد لكل صنف في فترة معينة، عشان منصرفش نفس الطلبية مرتين بالغلط
function boKey(faroojName){ return `${BO.from}~${BO.to}~${faroojName}`; }
function boIsDone(faroojName){ return !!(S.boDone && S.boDone[boKey(faroojName)]); }

/* ================= 2/3. وارد و منصرف ================= */
const OUT_REASONS=['صرف للإنتاج','صرف للفروع','صرف لمصنع تاني','هالك / تالف','مرتجع للمورد','تسوية جرد','عينات','أخرى'];
// الجهات المسموح بيها في المصنع ده. null = كلها متاحة (الوضع الافتراضي)
function outReasons(){
  const a = S.allowedReasons;
  if(!Array.isArray(a) || !a.length) return OUT_REASONS;
  const filtered = OUT_REASONS.filter(r=>a.includes(r));
  return filtered.length ? filtered : OUT_REASONS;
}

}
 
/* ================= 4. الإنتاج والوصفات ================= */
function viewProd(){
  const runs = (S.runs||[]).slice();
  // ===== تحليل الإنتاجية والتكلفة =====
  const totalRuns   = runs.length;
  const totalCost   = runs.reduce((s,r)=>s+(+r.cost||0),0);
  const totalOut    = runs.reduce((s,r)=>s+(+r.outQty||0),0);
  const avgUnitCost = totalOut ? totalCost/totalOut : 0;

  // تجميع حسب الوصفة: كام تشغيلة، إجمالي الناتج، إجمالي التكلفة، متوسط تكلفة الوحدة
  const byRecipe = {};
  runs.forEach(r=>{
    if(!byRecipe[r.name]) byRecipe[r.name]={name:r.name, runs:0, out:0, cost:0, dates:[]};
    const g=byRecipe[r.name];
    g.runs++; g.out=n2(g.out+(+r.outQty||0)); g.cost=n2(g.cost+(+r.cost||0)); g.dates.push(r.date);
  });
  const recipeStats = Object.values(byRecipe).map(g=>({
    ...g, unitCost: g.out ? g.cost/g.out : 0
  })).sort((a,b)=>b.cost-a.cost);

  // اتجاه تكلفة الوحدة: بنقارن أول نص التشغيلات بآخر نص، عشان نعرف التكلفة بتزيد ولا بتقل
  function costTrend(recipeName){
    const rs = runs.filter(r=>r.name===recipeName && r.outQty>0)
                   .sort((a,b)=> String(a.date).localeCompare(String(b.date)));
    if(rs.length<2) return null;
    const mid = Math.floor(rs.length/2);
    const firstHalf = rs.slice(0,mid), lastHalf = rs.slice(mid);
    const avg = arr => { const o=arr.reduce((s,r)=>s+r.outQty,0), c=arr.reduce((s,r)=>s+r.cost,0); return o? c/o : 0; };
    const a = avg(firstHalf), b = avg(lastHalf);
    if(!a) return null;
    return { pct: ((b-a)/a)*100, from:a, to:b };
  }

  // أكتر الخامات استهلاكًا في الإنتاج (من حركات الصرف التلقائي المرتبطة بتشغيلات)
  const rawUse = {};
  S.moves.filter(m=>m.dir==='out' && m.runId).forEach(m=>{
    const it=item(m.itemId); if(!it) return;
    if(!rawUse[m.itemId]) rawUse[m.itemId]={it, qty:0, cost:0};
    rawUse[m.itemId].qty = n2(rawUse[m.itemId].qty + (+m.qty||0));
    rawUse[m.itemId].cost = n2(rawUse[m.itemId].cost + (+m.qty||0)*(it.price||0));
  });
  const topRaw = Object.values(rawUse).sort((a,b)=>b.cost-a.cost).slice(0,8);
  const totalRawCost = Object.values(rawUse).reduce((s,r)=>s+r.cost,0);

  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">تشغيلات الشهر</div><div class="v">${totalRuns}</div><div class="s">${periodLabel(S.period)}</div></div>
    <div class="card"><div class="k">إجمالي الإنتاج</div><div class="v">${fmt(totalOut)}</div><div class="s">وحدة منتجة</div></div>
    <div class="card"><div class="k">تكلفة الإنتاج</div><div class="v">${money(totalCost)}</div><div class="s">درهم</div></div>
    <div class="card"><div class="k">متوسط تكلفة الوحدة</div><div class="v" style="color:var(--blue)">${money(avgUnitCost)}</div><div class="s">لكل وحدة منتجة</div></div>
    <div class="card"><div class="k">منتجات مختلفة</div><div class="v">${recipeStats.length}</div><div class="s">وصفة اشتغلت</div></div>
  </div></div></div>

  ${recipeStats.length?`<div class="panel">
    <h2>تحليل الإنتاجية والتكلفة لكل منتج <em>${recipeStats.length} منتج</em></h2>
    <p class="hint" style="margin:-6px 14px 0">"اتجاه التكلفة" بيقارن متوسط تكلفة الوحدة في أول التشغيلات بآخرها — لو أحمر يبقى التكلفة بتزيد ومحتاج تراجع أسعار الخامات أو الهدر.</p>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>المنتج / الوصفة</th><th class="n">عدد التشغيلات</th><th class="n">إجمالي الناتج</th><th class="n">إجمالي التكلفة</th><th class="n">تكلفة الوحدة</th><th>اتجاه التكلفة</th><th class="n">% من تكلفة الإنتاج</th></tr></thead>
      <tbody>${recipeStats.map(g=>{
        const tr = costTrend(g.name);
        const share = totalCost ? (g.cost/totalCost)*100 : 0;
        let trendHtml = '<span class="hint">—</span>';
        if(tr){
          const up = tr.pct > 2, down = tr.pct < -2;
          trendHtml = up ? `<span class="chip r">▲ ${fmt(Math.abs(tr.pct),1)}%</span>`
                    : down ? `<span class="chip g">▼ ${fmt(Math.abs(tr.pct),1)}%</span>`
                    : '<span class="chip">ثابتة</span>';
        }
        return `<tr>
          <td><div class="iname">${esc(g.name)}</div></td>
          <td class="n">${fmt(g.runs)}</td>
          <td class="n">${fmt(g.out)}</td>
          <td class="n">${money(g.cost)}</td>
          <td class="n hl">${money(g.unitCost)}</td>
          <td>${trendHtml}</td>
          <td class="n">${fmt(share,1)}%</td>
        </tr>`;
      }).join('')}</tbody>
      <tfoot><tr style="font-weight:700">
        <td>الإجمالي</td><td class="n">${totalRuns}</td><td class="n">${fmt(totalOut)}</td>
        <td class="n">${money(totalCost)}</td><td class="n hl">${money(avgUnitCost)}</td><td colspan="2"></td>
      </tr></tfoot>
    </table></div>
  </div>`:''}

  ${topRaw.length?`<div class="panel">
    <h2>أكتر الخامات استهلاكًا في الإنتاج <em>أعلى ${topRaw.length}</em></h2>
    <p class="hint" style="margin:-6px 14px 0">الخامات اللي بتاكل أكبر نصيب من تكلفة إنتاجك — أي وفر هنا بيأثر مباشرة على الربح.</p>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>الخامة</th><th class="n">الكمية المستهلكة</th><th class="n">تكلفتها</th><th class="n">% من تكلفة الخامات</th></tr></thead>
      <tbody>${topRaw.map(r=>{
        const share = totalRawCost ? (r.cost/totalRawCost)*100 : 0;
        return `<tr>
          <td><div class="iname">${esc(r.it.name)}</div></td>
          <td class="n">${fmt(r.qty)} <span class="chip">${esc(r.it.unit)}</span></td>
          <td class="n hl">${money(r.cost)}</td>
          <td class="n">${fmt(share,1)}%</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`:''}

  <div class="panel">
    <h2>وصفات الإنتاج <em>الوصفة بتخصم الخامات وتضيف المنتج بضغطة واحدة</em>
      ${(()=>{ const n=S.recipes.filter(r=>{const o=item(r.outItemId); if(!o||!r.outQty) return false; const uc=recipeCost(r)/r.outQty; return uc>0 && Math.abs(uc-(+o.price||0))>0.005; }).length;
        return n?`<button class="btn sm" data-act="sync-prices" style="margin-inline-start:auto">مزامنة أسعار ${n} منتج</button><button class="btn sm" data-act="import-recipes">استيراد من إكسل</button><button class="btn sm p" data-act="new-recipe">وصفة جديدة</button>`
                :`<button class="btn sm" data-act="import-recipes" style="margin-inline-start:auto">استيراد من إكسل</button><button class="btn sm p" data-act="new-recipe">وصفة جديدة</button>`; })()}</h2>
    ${S.recipes.length?(()=>{
      // نجهّز بيانات كل وصفة مرة واحدة (تصنيف المنتج، التكلفة، إلخ) عشان الفلترة والترتيب والتجميع
      const enriched = S.recipes.map(r=>{
        const out = item(r.outItemId);
        const c = recipeCost(r);
        const unitCost = r.outQty? c/r.outQty : 0;
        const cat = out ? (out.cat||'بدون تصنيف') : 'بدون تصنيف';
        return { r, out, cost:c, unitCost, cat };
      });

      const recCats = ['الكل', ...new Set(enriched.map(e=>e.cat))].sort((a,b)=> a==='الكل'?-1 : b==='الكل'?1 : a.localeCompare(b,'ar'));
      const catCounts = {}; enriched.forEach(e=>catCounts[e.cat]=(catCounts[e.cat]||0)+1);

      const q = recQ.trim().toLowerCase();
      let shown = enriched.filter(e=>{
        if(recCat!=='الكل' && e.cat!==recCat) return false;
        if(q){
          const inName = e.r.name.toLowerCase().includes(q);
          const inOut = e.out && e.out.name.toLowerCase().includes(q);
          const inMat = e.r.lines.some(l=>{ const it=item(l.itemId); return it && it.name.toLowerCase().includes(q); });
          if(!inName && !inOut && !inMat) return false;
        }
        return true;
      });

      shown.sort((a,b)=>{
        let v=0;
        if(recSort.by==='name') v = a.r.name.localeCompare(b.r.name,'ar');
        else if(recSort.by==='cost') v = a.cost-b.cost;
        else if(recSort.by==='unitcost') v = a.unitCost-b.unitCost;
        else if(recSort.by==='cat') v = a.cat.localeCompare(b.cat,'ar') || a.r.name.localeCompare(b.r.name,'ar');
        return v*recSort.dir;
      });

      const arrow = k => recSort.by===k ? (recSort.dir===1?' ▲':' ▼') : '';
      const groupByCat = recSort.by==='cat';

      return `
      <div class="pad">
        <div class="bar">
          <input type="text" class="grow" id="rec-q" placeholder="دور باسم الوصفة أو المنتج أو أي خامة فيها…" value="${esc(recQ)}">
        </div>
      </div>
      <div class="cattabs">
        ${recCats.map(c=>`<button class="cattab ${recCat===c?'on':''}" data-reccat="${esc(c)}">${esc(c)}${c!=='الكل'?` <span class="ct-n">${catCounts[c]||0}</span>`:''}</button>`).join('')}
      </div>
      <div class="tblwrap"><table class="gridcols">
      <thead><tr>
        <th style="cursor:pointer" data-recsort="name">الوصفة${arrow('name')}</th>
        <th style="cursor:pointer" data-recsort="cat">التصنيف${arrow('cat')}</th>
        <th>الناتج</th><th>مكونات</th>
        <th class="n" style="cursor:pointer" data-recsort="cost">تكلفة التشغيلة${arrow('cost')}</th>
        <th class="n" style="cursor:pointer" data-recsort="unitcost">تكلفة الوحدة${arrow('unitcost')}</th>
        <th class="n">سعره في الكارت</th><th></th>
      </tr></thead>
      <tbody>${(()=>{ let lastCat=null; return shown.map(e=>{
        const {r,out,cost:c,unitCost,cat}=e;
        const missingPrice = r.lines.some(l=>{ const it=item(l.itemId); return !it || !(it.price>0); });
        const cardPrice = out ? (+out.price||0) : 0;
        const diff = unitCost>0 ? Math.abs(unitCost-cardPrice) : 0;
        const stale = unitCost>0 && diff>0.005;
        const hdr = (groupByCat && cat!==lastCat) ? (lastCat=cat, `<tr class="catrow"><td colspan="8">${esc(cat)}</td></tr>`) : '';
        return hdr+`<tr><td class="iname">${esc(r.name)}${missingPrice?' <span class="chip a">خامة من غير سعر</span>':''}</td>
          <td><span class="chip">${esc(cat)}</span></td>
          <td class="n">${fmt(r.outQty)} <span class="chip">${esc(out?out.unit:'')}</span> ${esc(out?out.name:'—')}</td>
          <td>${r.lines.map(l=>`<span class="chip">${esc((item(l.itemId)||{}).name||'?')} · ${fmt(l.qty)}</span>`).join(' ')}</td>
          <td class="n"><b>${money(c)}</b></td>
          <td class="n hl">${money(unitCost)}</td>
          <td class="n">${cardPrice>0?money(cardPrice):'<span class="hint">مفيش</span>'}${stale?` <span class="chip a" title="سعر الكارت مختلف عن تكلفة الوصفة">مختلف</span>`:''}</td>
          <td style="white-space:nowrap">
            <button class="btn sm g" data-run="${r.id}">تشغيل</button>
            <button class="btn sm" data-act="edit-recipe" data-id="${r.id}">تعديل</button>
            <button class="btn sm danger" data-delr="${r.id}">حذف</button></td></tr>`;
      }).join('');})() || `<tr><td colspan="8" class="empty">مفيش وصفات مطابقة للبحث</td></tr>`}</tbody>
      </table></div>`;
    })()
      : `<div class="empty">لسه مفيش وصفات. اعمل وصفة لكل منتج (كنافة، مبرومة، كوكيز…) عشان الخامات تتخصم لوحدها وتعرف تكلفة الحبة.</div>`}
  </div>
  </div>

  <div class="panel"><h2>سجل تشغيلات الإنتاج <em>${runs.length} تشغيلة</em></h2>
    <div class="tblwrap"><table class="gridcols"><thead><tr><th>التاريخ</th><th>الوصفة</th><th class="n">عدد التشغيلات</th><th class="n">الناتج</th><th class="n">التكلفة</th><th class="n">تكلفة الوحدة</th><th></th></tr></thead>
    <tbody>${runs.slice().reverse().map(r=>`<tr><td class="n">${r.date}</td><td>${esc(r.name)}${r.auto?' <span class="chip b">تلقائي</span>':''}</td><td class="n">${fmt(r.batches)}</td><td class="n">${fmt(r.outQty)}</td><td class="n">${money(r.cost)}</td><td class="n">${money(r.outQty? r.cost/r.outQty : 0)}</td>
      <td>${r.id?`<button class="btn sm danger" data-act="del-run" data-id="${r.id}">تراجع</button>`:''}</td></tr>`).join('')
      ||`<tr><td colspan="7" class="empty">لسه مفيش تشغيلات</td></tr>`}</tbody></table></div>
  </div>`;
}
 
/* ================= 5. كارت الأصناف ================= */
let itSort = { by:'name', dir:1 };
let itSel = new Set(); // الأصناف المحددة للنقل الجماعي بين التصنيفات
let recQ = '';
let recCat = 'الكل';
let recSort = { by:'name', dir:1 };
function recToggleSort(by){
  if(recSort.by===by) recSort.dir*=-1; else { recSort.by=by; recSort.dir=1; }
  render();
}
function itToggleSort(by){
  if(itSort.by===by) itSort.dir*=-1; else { itSort.by=by; itSort.dir=1; }
  render();
}

function viewItems(){
  const q=(ui.q||'').trim().toLowerCase();
  let list = S.items.filter(it=>{
    if(ui.cat!=='الكل' && it.cat!==ui.cat) return false;
    if(q && !(it.name.toLowerCase().includes(q) || (it.desc||'').toLowerCase().includes(q) || (it.unit||'').toLowerCase().includes(q))) return false;
    if(ui.itOnly==='noprice' && it.price>0) return false;
    if(ui.itOnly==='nomin'   && it.min>0) return false;
    if(ui.itOnly==='low'){ const c=calc(it); const oh=c.has?c.real:c.book; if(!(it.min>0 && oh<=it.min)) return false; }
    if(ui.itOnly==='out'){ const c=calc(it); const oh=c.has?c.real:c.book; if(oh>0) return false; }
    return true;
  });

  // ترتيب حقيقي بدل الترتيب العشوائي بترتيب الإضافة
  const val = it => { const c=calc(it); return c.value; };
  const onh = it => { const c=calc(it); return c.has?c.real:c.book; };
  list.sort((a,b)=>{
    let r=0;
    if(itSort.by==='name')       r = a.name.localeCompare(b.name,'ar');
    else if(itSort.by==='cat')   r = String(a.cat).localeCompare(String(b.cat),'ar') || a.name.localeCompare(b.name,'ar');
    else if(itSort.by==='stock') r = onh(a)-onh(b);
    else if(itSort.by==='price') r = (+a.price||0)-(+b.price||0);
    else if(itSort.by==='value') r = val(a)-val(b);
    return r*itSort.dir;
  });

  // إحصائيات صحة البيانات: بتوضح فورًا إيه الناقص اللي بيخلي التقارير غلط
  const noPrice = S.items.filter(i=>!(i.price>0)).length;
  const noMin   = S.items.filter(i=>!(i.min>0)).length;
  const lowN    = S.items.filter(i=>{ const c=calc(i); const oh=c.has?c.real:c.book; return i.min>0 && oh<=i.min; }).length;
  const outN    = S.items.filter(i=>{ const c=calc(i); return (c.has?c.real:c.book)<=0; }).length;
  const totalVal= S.items.reduce((s,i)=>s+calc(i).value,0);
  const arrow = k => itSort.by===k ? (itSort.dir===1?' ▲':' ▼') : '';
  const only = ui.itOnly||'all';
  const chip = (key,label,count,cls) => `<button class="btn sm ${only===key?'p':''}" data-itonly="${key}">${label}${count!=null?` ${count}`:''}</button>`;

  const showCatCol = ui.cat==='الكل' && itSort.by!=='cat';

  return `${unitDriftPanel()}
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">إجمالي الأصناف</div><div class="v">${S.items.length}</div><div class="s">${cats().length-1} تصنيف</div></div>

      ${itSel.size?`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--amberbg);border-radius:10px;padding:10px 12px;margin-top:10px">

        <button class="btn sm" data-act="it-unmark-daily">إلغاء المتابعة اليومية</button>
        <button class="btn sm" data-act="it-clear-sel">إلغاء التحديد</button>
      </div>`:''}
    </div>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr>
        <th style="width:30px"><input type="checkbox" data-act="it-sel-all" ${list.length&&list.every(i=>itSel.has(i.id))?'checked':''}></th>
        <th style="cursor:pointer" data-itsort="name">الصنف${arrow('name')}</th>
        ${showCatCol?`<th style="cursor:pointer" data-itsort="cat">القسم${arrow('cat')}</th>`:''}
        <th>الوحدة</th>
        <th>الشدّ</th>
        <th class="n" style="cursor:pointer" data-itsort="stock">الرصيد${arrow('stock')}</th>
        <th class="n" style="cursor:pointer" data-itsort="price">سعر الوحدة${arrow('price')}</th>
        <th class="n">الحد الأدنى</th>
        <th class="n" style="cursor:pointer" data-itsort="value">القيمة${arrow('value')}</th>
        <th></th>

          const low=it.min>0&&onhand<=it.min; const out=onhand<=0;
          // صف عنوان التصنيف بيظهر بس لما نكون رتبين بالتصنيف — عشان مايبقاش عشوائي وسط ترتيب تاني
          const hdr = (itSort.by==='cat' && it.cat!==lastCat) ? (lastCat=it.cat, `<tr class="catrow"><td colspan="${colspan}">${esc(it.cat)}</td></tr>`) : '';
          return hdr+`<tr class="${out?'lowrow':''}">
          <td><input type="checkbox" data-itsel="${it.id}" ${itSel.has(it.id)?'checked':''}></td>
          <td><div class="iname">${esc(it.name)}</div>${(it.desc||it.note)?`<div class="idesc">${esc(it.desc||'')}${it.note?' · <span style="color:var(--amber)">'+esc(it.note)+'</span>':''}</div>`:''}</td>
          ${showCatCol?`<td><span class="chip">${esc(it.cat)}</span></td>`:''}
          <td><span class="chip">${esc(it.unit)}</span></td>
          <td>${it.packSize?`<span class="chip b">${esc(it.packUnit||'عبوة')} = ${fmt(it.packSize)}</span>`:'<span class="hint">—</span>'}</td>
          <td class="n hl">${fmt(onhand)} ${out?'<span class="chip r">خلص</span>':(low?'<span class="chip a">تحت الحد</span>':'')}</td>
          <td class="n"><input type="number" step="any" class="cell${it.price>0?' filled':''}" data-price="${it.id}" value="${it.price||''}" placeholder="—"></td>
          <td class="n"><input type="number" step="any" class="cell${it.min>0?' filled':''}" data-min="${it.id}" value="${it.min||''}" placeholder="—"></td>
          <td class="n"><b>${it.price>0?money(c.value):'<span class="hint">—</span>'}</b></td>
          <td><button class="btn sm" data-edit="${it.id}">تعديل</button></td></tr>`;
        }).join('');})()
        ||`<tr><td colspan="${showCatCol?10:9}" class="empty">مفيش أصناف مطابقة</td></tr>`}
      </tbody>
      ${list.length?`<tfoot><tr style="font-weight:700">
        <td colspan="${showCatCol?8:7}">الإجمالي</td>
        <td class="n hl">${money(list.reduce((s,i)=>s+calc(i).value,0))}</td><td></td>
      </tr></tfoot>`:''}
    </table></div>
  </div>`;
}
 
/* ================= 6. التقارير والإقفال ================= */
function viewRep(){
  const t=totals();
  const byCat={};
  for(const it of S.items){const c=calc(it); byCat[it.cat]=(byCat[it.cat]||0)+c.value;}
  const varis=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.c.has&&x.c.diff!==0&&x.it.price>0)
    .sort((a,b)=>Math.abs(b.c.diff*b.it.price)-Math.abs(a.c.diff*a.it.price)).slice(0,12);
  const low=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.it.min>0&&(x.c.has?x.c.real:x.c.book)<=x.it.min);
  const noPrice=S.items.filter(i=>!i.price).length;
  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">قيمة المخزون</div><div class="v">${money(t.value)}</div><div class="s">درهم إماراتي</div></div>
    <div class="card"><div class="k">عجز الجرد</div><div class="v" style="color:var(--red)">${money(t.lossVal)}</div><div class="s">${t.loss} صنف ناقص</div></div>
    <div class="card"><div class="k">أصناف زيادة</div><div class="v" style="color:var(--green)">${t.gain}</div><div class="s">أكتر من الدفتري</div></div>
    <div class="card"><div class="k">تحت الحد الأدنى</div><div class="v" style="color:var(--amber)">${t.low}</div><div class="s">محتاجة طلبية</div></div>
    <div class="card"><div class="k">من غير سعر</div><div class="v">${noPrice}</div><div class="s">مش داخلة في القيمة</div></div>
  </div></div></div>
 
  <div class="panel"><h2>قيمة المخزون حسب القسم</h2><div class="pad">
    ${Object.entries(byCat).map(([c,v])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(c)}</span><span class="num">${money(v)}</span></div>
      <div style="height:7px;background:#EEF2F4;border-radius:5px;overflow:hidden;margin-top:3px">
        <div style="height:100%;width:${t.value?Math.max(2,v/t.value*100):0}%;background:var(--blue)"></div></div></div>`).join('')}
  </div></div>
 
  <div class="panel"><h2>أكبر فروقات الجرد <em>بالقيمة</em></h2>
    ${varis.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>دفتري</th><th>فعلي</th><th>الفرق</th><th>قيمة الفرق</th></tr></thead>
    <tbody>${varis.map(({it,c})=>`<tr><td>${esc(it.name)}</td><td class="n">${fmt(c.book)}</td><td class="n">${fmt(c.real)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}">${c.diff>0?'+':''}${fmt(c.diff)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}"><b>${money(c.diff*it.price)}</b></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">لما تدخل الجرد الفعلي والأسعار، الفروقات هتظهر هنا مرتبة بالقيمة.</div>`}
  </div>
 
  <div class="panel"><h2>أصناف محتاجة طلبية</h2>
    ${low.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>الرصيد</th><th>الحد الأدنى</th><th>الناقص</th></tr></thead>
    <tbody>${low.map(({it,c})=>{const oh=c.has?c.real:c.book;return `<tr><td>${esc(it.name)}</td><td class="n">${fmt(oh)} ${esc(it.unit)}</td><td class="n">${fmt(it.min)}</td><td class="n neg">${fmt(it.min-oh)}</td></tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">مفيش صنف تحت الحد الأدنى — أو لسه محددتش الحدود الدنيا في كارت الأصناف.</div>`}
  </div>
 
  <div class="panel"><h2>إقفال الشهر</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">الإقفال بيخلي <b>الجرد الفعلي</b> هو رصيد أول المدة للشهر الجاي، ويحفظ نسخة من ${periodLabel(S.period)} في الأرشيف، ويفضّي الوارد والمنصرف. الأصناف اللي متجردتش هتاخد رصيدها الدفتري.</div>
    <div class="hint" style="margin-bottom:10px;background:#FCF6EA;border:1px solid #EDD9AE;border-radius:8px;padding:9px">
      <b>عشان بياناتك متضيعش خالص:</b> النظام بيحفظ لوحده جوا المتصفح، بس ده مش مضمون ١٠٠٪.
      خليك دايمًا فاتح <b>نفس الملف بالظبط</b> من نفس المكان (متنزّلش نسخة جديدة كل مرة)، من نفس المتصفح، من غير تصفح خفي.
      وكل ما تخلص شغل، دوس <b>«حفظ نسخة»</b> فوق واحفظ الملف اللي بينزل في مكان ثابت — ده أضمن حاجة عندك، مش أي حفظ تلقائي.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn p" data-act="close-month">إقفال ${periodLabel(S.period)}</button>

      <button class="btn" data-act="export">تنزيل الجرد CSV</button>
      <button class="btn g" data-act="backup">تنزيل نسخة احتياطية${BK.dirty>0?` (${BK.dirty} تعديل من غير حفظ)`:''}</button>
      <label class="btn" style="display:inline-flex;align-items:center">استرجاع نسخة
        <input type="file" id="restore" accept=".json,application/json" style="display:none"></label>
      <button class="btn danger" data-act="reset">إعادة ضبط كل البيانات</button>
    </div>
    ${S.closed.length?`<div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">الشهور المقفولة</div>
      ${S.closed.slice().reverse().map(p=>`<span class="chip b" style="margin-inline-end:6px">${periodLabel(p.period)} · ${money(p.value)} د.إ</span>`).join('')}</div>`:''}
  </div></div>

  ${S.closed.length?`<div class="panel"><h2>أرشفة الحركات التفصيلية القديمة</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">
      إقفال الشهر بيصفّي الشاشة عندك بس — <b>الحركات التفصيلية (كل عملية وارد ومنصرف) بتفضل متراكمة في قاعدة البيانات للأبد</b> حتى بعد الإقفال، وده اللي بيحمّل عليك بمرور الوقت.
      قيمة المخزون النهائية لكل شهر مقفول <b>محفوظة دايمًا</b> في الأرشيف فوق مهما حذفت — مش هتضيع.
    </div>
    <div class="warnbar" style="margin-bottom:12px">
      ⚠️ الحذف نهائي ومش هيترجع. لو حذفت حركات شهر، مش هتقدر تشوف تفاصيلها بعد كده ولا تعمل "تراجع عن الإقفال" ليه — بس رصيده النهائي هيفضل في الأرشيف زي ما هو.
      متحذفش غير الشهور القديمة اللي متأكد إنك مش محتاج ترجعلها.
    </div>
    <div class="tblwrap"><table class="gridcols">
      <thead><tr><th>الشهر</th><th>القيمة النهائية</th><th class="n">عدد الحركات</th><th></th></tr></thead>
      <tbody>${S.closed.slice().reverse().map(p=>{
        const sizeInfo = ARCHIVE_SIZES[p.period];
        return `<tr>
          <td><div class="iname">${periodLabel(p.period)}</div></td>
          <td class="n">${money(p.value)}</td>
          <td class="n">${sizeInfo!==undefined?`${sizeInfo} حركة`:`<button class="btn sm" data-act="archive-size" data-period="${esc(p.period)}">احسب العدد</button>`}</td>
          <td>${sizeInfo?`<button class="btn sm danger" data-act="archive-delete" data-period="${esc(p.period)}">احذف حركات الشهر ده</button>`:(sizeInfo===0?'<span class="hint">مفيش حركات</span>':'')}</td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div></div>`:''}
  `;
}

// بيسترجع تسويات قديمة اتعملت قبل ميزة الحفظ، من الحركات الفعلية اللي لسه موجودة في السجل
// (أي حركة عليها علامة "تسوية جرد")، ويجمّعها حسب التاريخ عشان تقدر تطبعها زي لو كانت متحفوظة
function reconstructSettlementsFromMoves(){
  const settleMoves = S.moves.filter(m=>m.reason==='تسوية جرد' || String(m.party||'').startsWith('تسوية جرد'));
  const byBatch = {}; // لو الحركة عليها settleBatch، بنجمع بيه؛ وإلا بنجمع حسب التاريخ بس
  settleMoves.forEach(m=>{
    const key = m.settleBatch || ('date:'+m.date);
    if(!byBatch[key]) byBatch[key] = { date:m.date, moves:[] };
    byBatch[key].moves.push(m);
  });
  return Object.values(byBatch).map(g=>{
    const items = g.moves.map(m=>{
      const it = item(m.itemId);
      const diff = m.dir==='in' ? m.qty : -m.qty; // وارد = زيادة، منصرف = نقصان
      return { name: it?it.name:'صنف محذوف', unit: it?it.unit:'', diff:n2(diff), value:n2(diff*(m.price||(it?it.price:0)||0)),
        book:null, actual:null }; // مش عندنا الدفتري/الفعلي الأصليين، بس الفرق والقيمة دقيقين من الحركة نفسها
    });
    return { date:g.date, items, takenAt:null, reconstructed:true };
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

/* ================= نسخ احتياطية خارج Supabase (على خادم Google — مكان مستقل تمامًا) ================= */
// بنستخدم نفس خادم Google اللي تطبيق الفروج شغال عليه، لكل المصانع. لو Supabase كله وقع أو الحساب اتقفل، النسخ دي بتفضل موجودة.
const EXT_BK = (()=>{ const cfg = Object.values(BRANCH_APP_CONFIG||{})[0]; return cfg && cfg.gscriptUrl ? {url:cfg.gscriptUrl, token:cfg.secretToken} : null; })();
const EXT_CHUNK = 40000; // خلية Google Sheets حدها 50 ألف حرف، فبنقسّم النسخة على أجزاء أصغر من كده
const EXT_KEEP = 14;
let EXT_LIST = []; let extLoaded = false; let EXT_BUSY = false;
const extPrefix = () => 'fac_backup:'+FACTORY+':';
async function extReq(params){
  if(!EXT_BK) throw new Error('مفيش خادم خارجي متعرّف');
  const res = await fetch(EXT_BK.url, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body: new URLSearchParams({...params, token:EXT_BK.token}).toString() });
  if(!res.ok) throw new Error('تعذر الاتصال بخادم Google');
  const data = await res.json();
  if(!data.success && data.error && data.error!=='not_found') throw new Error(data.error);
  return data;
}
async function extGet(key){ const r=await extReq({action:'get',key}); return r.success? r.value : null; }
async function extSet(key,value){
  for(let t=0;t<3;t++){ try{ const r=await extReq({action:'set',key,value}); if(r.success) return true; }catch(e){ if(t===2) throw e; }
    await new Promise(r=>setTimeout(r,800*(t+1))); }
  return false;
}
async function extDel(key){ try{ await extReq({action:'delete',key}); }catch(e){} }
function buildSnapshot(){
  return { factory:FACTORY, period:S.period, items:S.items, recipes:S.recipes, moves:S.moves, counts:S.counts, runs:S.runs||[],
    takenAt:new Date().toISOString(), version:1 };
}
async function extListLoad(){
  try{ const v = await extGet(extPrefix()+'index'); EXT_LIST = v? JSON.parse(v) : []; }catch(e){ EXT_LIST = []; }
  extLoaded = true;
}
// بتتنادى تلقائي بعد تحميل النظام — مرة واحدة في اليوم لكل مصنع، في الخلفية
async function maybeExternalBackup(force){
  if(!EXT_BK || EXT_BUSY) return false;
  EXT_BUSY = true;
  try{
    const d = today();
    let idx = [];
    try{ const v = await extGet(extPrefix()+'index'); idx = v? JSON.parse(v) : []; }catch(e){ return false; } // لو مش قادرين نقرأ الفهرس، منكتبش حاجة
    if(!force && idx.some(x=>x.date===d)) return false;
    const txt = JSON.stringify(buildSnapshot());
    const parts = []; for(let i=0;i<txt.length;i+=EXT_CHUNK) parts.push(txt.slice(i,i+EXT_CHUNK));
    for(let i=0;i<parts.length;i++){ if(!await extSet(extPrefix()+d+':p'+i, parts[i])) throw new Error('فشل حفظ جزء '+(i+1)); }
    // الفهرس بيتكتب في الآخر خالص — كده أي نسخة ظاهرة في القايمة مضمون إنها كاملة
    const entry = { date:d, parts:parts.length, items:S.items.length, recipes:S.recipes.length, moves:S.moves.length, takenAt:new Date().toISOString() };
    idx = [entry, ...idx.filter(x=>x.date!==d)];
    const keep = idx.slice(0,EXT_KEEP), drop = idx.slice(EXT_KEEP);
    await extSet(extPrefix()+'index', JSON.stringify(keep));
    for(const o of drop){ for(let i=0;i<(o.parts||0);i++) await extDel(extPrefix()+o.date+':p'+i); }
    EXT_LIST = keep; extLoaded = true;
    return true;
  }catch(e){ return false; }
  finally{ EXT_BUSY = false; }
}
async function extLoadSnapshot(date){
  const e = EXT_LIST.find(x=>x.date===date); if(!e) throw new Error('النسخة مش موجودة');
  let txt=''; for(let i=0;i<e.parts;i++){ const p = await extGet(extPrefix()+date+':p'+i); if(p==null) throw new Error('جزء ناقص من النسخة ('+(i+1)+')'); txt+=p; }
  return JSON.parse(txt);
}
async function applySnapshot(snap){
  if(!snap || !Array.isArray(snap.items)) throw new Error('الملف مش نسخة احتياطية صالحة');
  if(snap.factory && snap.factory!==FACTORY && !confirm(`النسخة دي تبع مصنع تاني (${snap.factory}). متأكد إنك عايز تسترجعها هنا؟`)) return false;
  S.items=snap.items||[]; S.recipes=snap.recipes||[]; S.moves=snap.moves||[]; S.counts=snap.counts||{}; S.runs=snap.runs||[];
  await saveMain(); await saveTx(); if(DB.on) await pushAll(true);
  return true;
}

        كمان تقدر تنزّل نسخة على جهازك كملف، أو تسترجع من ملف نزّلته قبل كده.</div>

    ${EXT_BK?`<div class="tblwrap"><table class="gridcols">

        <td><button class="btn sm danger" data-act="ext-restore" data-date="${esc(b.date)}">استرجاع</button></td></tr>`).join('')
        : `<tr><td colspan="6" class="empty">${extLoaded?'لسه مفيش نسخ — أول نسخة هتتاخد تلقائي، أو دوس "خد نسخة دلوقتي"':'جاري التحميل...'}</td></tr>`}</tbody>

// اقتراحات شراء تلقائية: أي صنف رصيده الدفتري تحت الحد الأدنى، ومالوش طلب شراء مفتوح (معلّق أو موافق عليه).
// الكمية المقترحة بترجّع الرصيد لضعف الحد الأدنى، ولو الصنف ليه وحدة بديلة (كرتونة مثلًا) بنقرّبها لعدد عبوات كامل.
function purchaseSuggestions(){
  const open = new Set(PURCHASE_REQUESTS.filter(r=>r.status==='pending'||r.status==='approved').map(r=>r.itemId));
  return S.items.filter(it=>+it.min>0 && !open.has(it.id)).map(it=>{
    const book = calc(it).book;
    if(book >= +it.min) return null;
    let qty = n2(Math.max(+it.min*2 - book, +it.min));
    let packNote = '';
    if(it.packSize>0 && it.packUnit){
      const packs = Math.ceil(qty/it.packSize);
      qty = n2(packs*it.packSize);
      packNote = `${packs} ${it.packUnit}`;
    }
    return { it, book, qty, packNote };
  }).filter(Boolean).sort((a,b)=>(a.book/a.it.min)-(b.book/b.it.min));
}

function parseInRecoverySheet(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {rows:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
  const looksLikeHeader = /تاريخ|صنف|date|item/i.test(firstCells.join(' '));
  const start = looksLikeHeader ? 1 : 0;

  const norm = s => String(s||'').trim().toLowerCase();
  const rows = []; const errors = [];
  for(let i=start;i<lines.length;i++){
    const c = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const [rawDate, name, qty, price, party] = c;
    if(!name) continue;
    const date = parseDateFlexible(rawDate);
    if(!date){ errors.push(`سطر ${i+1}: تاريخ غير مفهوم (${rawDate})`); continue; }
    const q = +qty;
    if(!(q>0)){ errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); continue; }
    const match = S.items.find(it=>norm(it.name)===norm(name));
    // لو الشيت مفيهوش سعر لهذا الصف، نستخدم سعر الصنف المسجل عندك في الكارت بدل ما نسجّله صفر
    const sheetPrice = +price;
    const finalPrice = sheetPrice>0 ? sheetPrice : (match ? +match.price||0 : 0);
    rows.push({ date, name, qty:q, price:finalPrice, party:party||'', match });
  }
  return {rows, errors};
}

function renderInRecoveryPreview(){
  const text = ($('#iri-text')||{value:''}).value;
  const wrap = $('#iri-preview'); if(!wrap) return;
  if(!text.trim()){ wrap.innerHTML = '<div class="warnbar" style="margin:0">الصق البيانات الأول أو ارفع ملف</div>'; return; }

  const {rows, errors} = parseInRecoverySheet(text);
  IRI_PARSED = rows;
  const matched = rows.filter(r=>r.match).length;
  const unmatched = rows.length - matched;
  const totalValue = n2(rows.reduce((s,r)=>s+r.qty*r.price,0));

  let html = `<div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))">

    ${unmatched?`<div class="card"><div class="k">مالهاش تطابق</div><div class="v" style="color:var(--red)">${unmatched}</div><div class="s">هتتخطى</div></div>`:''}
  </div>`;
  if(errors.length) html += `<div class="warnbar" style="margin-top:10px">${errors.slice(0,8).map(esc).join('<br>')}${errors.length>8?`<br>… و${errors.length-8} كمان`:''}</div>`;
  if(rows.length){
    html += `<div class="tblwrap" style="margin-top:10px;max-height:280px"><table class="gridcols">
      <thead><tr><th>التاريخ</th><th>الصنف</th><th class="n">الكمية</th><th class="n">السعر</th><th>المورد</th><th>الحالة</th></tr></thead>

        <td>${r.match?'<span class="chip g">متطابق</span>':'<span class="chip r">مالوش تطابق</span>'}</td>
      </tr>`).join('')}</tbody></table></div>
      <button class="btn p" data-act="iri-apply" style="width:100%;margin-top:12px" ${!matched?'disabled':''}>استيراد ${matched} حركة وارد</button>`;
  }
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset));
}

function bind(){
  const root=$('#root');
  root.querySelectorAll('[data-tabgroup]').forEach(b=>b.onclick=()=>{
    const g = TAB_GROUPS.find(x=>x.name===b.dataset.tabgroup);
    if(!g) return;
    // لو المجموعة فيها تبويب مفتوح بالفعل نسيبه، وإلا نفتح أول تبويب متاح فيها
    if(g.tabs.some(t=>t[0]===tab)) return;
    const first = g.tabs.find(t=>canOpen(t[0])) || g.tabs[0];
    const k = first[0];
    if(!canOpen(k)){ ui.modal=unlockModal(k); return render(); }
    tab=k; ui.q=''; ui.only='الكل'; render();
    if(k==='inbox') loadMyInbox();
  });
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tab;
    if(!canOpen(k)){ ui.modal=unlockModal(k); return render(); }
    tab=k;ui.q='';ui.only='الكل';render();
    if(k==='inbox') loadMyInbox();
  });
  const mCat=$('#m-cat'); if(mCat) mCat.onchange=e=>{ui.moveCat=e.target.value; render();};
  const mReason=$('#m-reason'); if(mReason) mReason.onchange=e=>{ui.moveReason=e.target.value; render();};
  const bReason=$('#b-reason'); if(bReason) bReason.onchange=e=>{readBulkHeader(); ui.bulk.reason=e.target.value; render();};
  const bParty=$('#b-party'); if(bParty) bParty.onchange=readBulkHeader;
  const bDate=$('#b-date'); if(bDate) bDate.onchange=readBulkHeader;
  const bQ=$('#b-q'); if(bQ){ bQ.oninput=e=>{ui.bulk.q=e.target.value; const p=e.target.selectionStart; readBulkHeader(); render(); const n=$('#b-q'); n.focus(); n.setSelectionRange(p,p);}; }
  root.querySelectorAll('[data-bulkqty]').forEach(inp=>{
    inp.onchange=e=>{
      const id=e.target.dataset.bulkqty, v=e.target.value;
      if(v===''||v===null||+v<=0) delete ui.bulk.qty[id]; else ui.bulk.qty[id]=v;
      readBulkHeader(); render();
    };
    inp.onkeydown=e=>{
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Enter') return;
      e.preventDefault();
      const row=+e.target.dataset.row, next=row+(e.key==='ArrowUp'?-1:1);
      e.target.blur();
      setTimeout(()=>{
        const t=document.querySelector(`[data-bulkqty][data-row="${next}"]`);
        if(t){ t.focus(); t.select(); }
      },40);
    };
  });
  root.querySelectorAll('[data-bulkinqty]').forEach(inp=>{
    inp.onchange=e=>{
      const id=e.target.dataset.bulkinqty, v=e.target.value;
      if(v===''||v===null||+v<=0) delete ui.bulkIn.qty[id]; else ui.bulkIn.qty[id]=v;
      readBulkInHeader(); render();
    };
    inp.onkeydown=e=>{
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Enter') return;
      e.preventDefault();
      const row=+e.target.dataset.row, next=row+(e.key==='ArrowUp'?-1:1);
      e.target.blur();
      setTimeout(()=>{
        const nx=document.querySelector(`[data-bulkinqty][data-row="${next}"]`);
        if(nx){ nx.focus(); nx.select(); }
      },40);
    };
  });
  root.querySelectorAll('[data-bulkinprice]').forEach(inp=>{
    inp.onchange=e=>{
      const id=e.target.dataset.bulkinprice, v=e.target.value;
      if(v==='') delete ui.bulkIn.price[id]; else ui.bulkIn.price[id]=v;
      readBulkInHeader(); render();
    };
  });
  const biQ=$('#bi-q'); if(biQ){ biQ.oninput=e=>{ui.bulkIn.q=e.target.value; const p=e.target.selectionStart; readBulkInHeader(); render(); const n=$('#bi-q'); if(n){n.focus(); n.setSelectionRange(p,p);}}; }
  const rd=$('#restrict-dispatch'); if(rd) rd.onchange=async e=>{
    S.restrictDispatchTo=e.target.value;
    if(!S.restrictDispatchTo) S.dispatchOnlyMode=false;
    await saveMain();
    toast(S.restrictDispatchTo?'اتقفل الصرف لمصنع تاني على مصنع واحد بس':'اتشال القيد');
    render();
  };
  const aiFile=$('#ai-file'); if(aiFile) aiFile.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const name = (f.name||'').toLowerCase();
    const isExcel = /\.(xlsx?|xlsm)$/.test(name);
    const ta=$('#ai-text');
    if(isExcel){
      // ملفات إكسل الحقيقية (.xls القديمة أو .xlsx) ملفات ثنائية، مينفعش تتقرا كنص عادي —
      // لازم تتحلل بمكتبة SheetJS الأول وبعدين تتحول لجدول نصي يقدر المحلل يفهمه
      if(typeof XLSX==='undefined'){ toast('مكتبة قراءة إكسل ما اتحمّلتش، جرب تاني أو الصق البيانات يدوي',1); return; }
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const wb = XLSX.read(rd.result, {type:'array', cellDates:true});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          // dateNF بيخلي أي خانة تاريخ تتحول لصيغة موحدة زي 2026-09-10 بدل رقم إكسل الداخلي
          const csv = XLSX.utils.sheet_to_csv(sheet, {FS:'\t', dateNF:'yyyy-mm-dd'});
          if(ta){ ta.value=csv; renderDispenseImportPreview(); }
        }catch(err){ toast('تعذرت قراءة ملف الإكسل: '+err.message,1); }
      };
      rd.readAsArrayBuffer(f);
    } else {
      const rd=new FileReader();
      rd.onload=()=>{ if(ta){ ta.value=String(rd.result||''); renderDispenseImportPreview(); } };
      rd.readAsText(f,'utf-8');
    }
  };
  const aiText=$('#ai-text'); if(aiText) aiText.onblur=()=>renderDispenseImportPreview();
  const cmpQ=$('#cmp-q'); if(cmpQ) cmpQ.oninput=e=>{
    CMP_Q=e.target.value; const p=e.target.selectionStart; render();
    const n=$('#cmp-q'); if(n){ n.focus(); n.setSelectionRange(p,p); }
  };
  const riFile=$('#ri-file'); if(riFile) riFile.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{ const ta=$('#ri-text'); if(ta){ ta.value=String(rd.result||''); renderRecipeImportPreview(); } };
    rd.readAsText(f,'utf-8');
  };
  const riText=$('#ri-text'); if(riText) riText.onblur=()=>renderRecipeImportPreview();
  const iriFile=$('#iri-file'); if(iriFile) iriFile.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const name=(f.name||'').toLowerCase();
    const isExcel = /\.(xlsx?|xlsm)$/.test(name);
    const ta=$('#iri-text');
    if(isExcel){
      if(typeof XLSX==='undefined'){ toast('مكتبة قراءة إكسل ما اتحمّلتش، جرب تاني أو الصق البيانات يدوي',1); return; }
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const wb = XLSX.read(rd.result, {type:'array', cellDates:true});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const csv = XLSX.utils.sheet_to_csv(sheet, {FS:'\t', dateNF:'yyyy-mm-dd'});
          if(ta){ ta.value=csv; renderInRecoveryPreview(); }
        }catch(err){ toast('تعذرت قراءة ملف الإكسل: '+err.message,1); }
      };
      rd.readAsArrayBuffer(f);
    } else {
      const rd=new FileReader();
      rd.onload=()=>{ if(ta){ ta.value=String(rd.result||''); renderInRecoveryPreview(); } };
      rd.readAsText(f,'utf-8');
    }
  };
  const frr=$('#file-recipes-restore'); if(frr) frr.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{ try{ const snap=JSON.parse(String(rd.result||''));
        await importRecipes(snap.recipes||[], 'الملف "'+f.name+'"', snap.items||[]); render();
      }catch(err){ toast('الملف مش سليم: '+err.message,1); } };
    rd.readAsText(f,'utf-8');
  };
  const fbr=$('#file-backup-restore'); if(fbr) fbr.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{ try{ const snap=JSON.parse(String(rd.result||''));
        if(!confirm(`استرجاع من الملف "${f.name}"؟\n\n(${(snap.items||[]).length} صنف، ${(snap.recipes||[]).length} وصفة، ${(snap.moves||[]).length} حركة)\n\nهيستبدل البيانات الحالية.`)) return;
        if(prompt('للتأكيد اكتب "استرجاع"')!=='استرجاع') return toast('اتلغت العملية',1);
        if(await applySnapshot(snap)) toast('تم الاسترجاع من الملف'); render();
      }catch(err){ toast('الملف مش سليم: '+err.message,1); } };
    rd.readAsText(f,'utf-8');
  };
  const finF=$('#fin-from'); if(finF) finF.onchange=e=>{ FIN.from=e.target.value; render(); };
  const finT=$('#fin-to'); if(finT) finT.onchange=e=>{ FIN.to=e.target.value; render(); };
  const spcQ=$('#spc-q'); if(spcQ) spcQ.oninput=e=>{ SPC_Q=e.target.value; const p=e.target.selectionStart; render(); const n=$('#spc-q'); if(n){ n.focus(); n.setSelectionRange(p,p); } };
  const iriText=$('#iri-text'); if(iriText) iriText.onblur=()=>renderInRecoveryPreview();
  const baiName=$('#bai-name'); if(baiName) baiName.oninput=()=>{
    const norm=s=>String(s||'').trim().toLowerCase();
    const m = S.items.find(i=>norm(i.name)===norm(baiName.value));
    const hint=$('#bai-hint'), unitEl=$('#bai-unit');
    if(m){ if(hint) hint.innerHTML=`<span style="color:var(--green)">متطابق مع كارت الأصناف — ${esc(m.cat)} · ${esc(m.unit)}</span>`; if(unitEl && !unitEl.value) unitEl.value=m.unit; }
    else if(hint) hint.textContent = baiName.value.trim() ? 'مش متطابق مع أي صنف عندك — هيتضاف بالاسم ده في طلبية الفرع بس' : '';
  };
  const iciFile=$('#ici-file'); if(iciFile) iciFile.onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    const name=(f.name||'').toLowerCase();
    const isExcel = /\.(xlsx?|xlsm)$/.test(name);
    const ta=$('#ici-text');
    if(isExcel){
      if(typeof XLSX==='undefined'){ toast('مكتبة قراءة إكسل ما اتحمّلتش، جرب تاني أو الصق البيانات يدوي',1); return; }
      const rd=new FileReader();
      rd.onload=()=>{
        try{
          const wb = XLSX.read(rd.result, {type:'array', cellDates:true});
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const csv = XLSX.utils.sheet_to_csv(sheet, {FS:'\t'});
          if(ta){ ta.value=csv; renderItemCatalogImportPreview(); }
        }catch(err){ toast('تعذرت قراءة ملف الإكسل: '+err.message,1); }
      };
      rd.readAsArrayBuffer(f);
    } else {
      const rd=new FileReader();
      rd.onload=()=>{ if(ta){ ta.value=String(rd.result||''); renderItemCatalogImportPreview(); } };
      rd.readAsText(f,'utf-8');
    }
  };
  const iciText=$('#ici-text'); if(iciText) iciText.onblur=()=>renderItemCatalogImportPreview();
  const langSel=$('#lang-select'); if(langSel) langSel.onchange=e=>{ setLang(e.target.value); };
  const dom=$('#dispatch-only-mode'); if(dom) dom.onchange=async e=>{
    S.dispatchOnlyMode=e.target.checked;
    await saveMain();
    toast(S.dispatchOnlyMode?'المصنع بقى مخصص للتوريد لمصنع واحد بس':'رجعت كل خيارات الصرف');
    render();
  };
  const mItem=$('#m-item');
  if(mItem){
    const refreshUnitMode=()=>{
      const it=item(mItem.value);
      const sel=$('#m-unitmode'); if(!sel) return;
      if(!it){ sel.innerHTML='<option value="1">وحدة</option>'; }
      else if(it.packSize>0){
        sel.innerHTML=`<option value="1">${esc(it.unit)}</option><option value="${it.packSize}" selected>${esc(it.packUnit||'عبوة')} (${fmt(it.packSize)} ${esc(it.unit)})</option>`;
      } else { sel.innerHTML=`<option value="1">${esc(it.unit)}</option>`; }
      updateConv();
    };
    const updateConv=()=>{
      const it=item(mItem.value); const mul=+($('#m-unitmode')?.value||1); const packs=+($('#m-packs')?.value||0);
      const total = n2(packs*mul);
      const qEl=$('#m-qty'); if(qEl) qEl.value = total||'';
      const cv=$('#m-conv');
      if(cv) cv.textContent = it? `= ${fmt(total)} ${it.unit}` : '';
    };
    // تعبئة سعر الوحدة تلقائي من كارت الأصناف، عشان متروحش تدوّر عليه كل مرة — وتقدر تعدّله لو السعر اتغيّر
    const refreshPrice=()=>{
      // سعر المرتجع كمان بيتعبّى تلقائي من آخر سعر شراء، عشان قيمة المرتجع تبقى صح
      const rEl=$('#m-retprice');
      if(rEl){
        const rit=item(mItem.value);
        const rHint=$('#m-retprice-hint');
        if(rit){
          const lastBuy = S.moves.filter(m=>m.dir==='in' && m.itemId===rit.id && +m.price>0)
                                 .sort((a,b)=> String(b.date).localeCompare(String(a.date)))[0];
          const p = lastBuy? +lastBuy.price : (+rit.price||0);
          rEl.value = p>0? p : '';
          if(rHint) rHint.innerHTML = p>0
            ? (lastBuy? `آخر سعر شراء: <b>${fmt(p)}</b> بتاريخ ${lastBuy.date}` : `سعر الصنف المسجل: <b>${fmt(p)}</b>`)
            : 'الصنف من غير سعر — اكتب سعر المرتجع';
        } else { rEl.value=''; if(rHint) rHint.textContent=''; }
      }
      const pEl=$('#m-price'); if(!pEl) return; // في المنصرف مفيش خانة سعر
      const it=item(mItem.value);
      const hint=$('#m-price-hint');
      const lbl=$('#m-price-label');
      const mul=+($('#m-unitmode')?.value||1); // معامل التحويل الحالي: 1 لو الوحدة الأساسية، أو حجم الشدّ لو مختار الوحدة البديلة (كرتونة مثلًا)
      const modeUnit = (it && mul>1) ? (it.packUnit||'عبوة') : (it? it.unit : '');
      if(lbl) lbl.textContent = modeUnit ? `سعر الـ${modeUnit}` : t('unit_price');
      if(!it){ pEl.value=''; if(hint) hint.textContent=''; return; }
      const lastIn = S.moves.filter(m=>m.dir==='in' && m.itemId===it.id && +m.price>0)
                            .sort((a,b)=> String(b.date).localeCompare(String(a.date)))[0];
      const known = (+it.price>0) ? +it.price : (lastIn? +lastIn.price : 0); // ده دايمًا سعر الوحدة الأساسية (زي ما متسجل في كارت الأصناف)
      const shown = n2(known*mul); // لو الوضع بالكرتونة، نوري سعر الكرتونة كاملة (سعر الوحدة × حجم الشدّ) بدل سعر الحبة
      pEl.value = shown>0 ? shown : '';
      if(hint){
        if(known>0){
          const base = mul>1 ? ` (سعر ${it.unit} الواحدة = ${fmt(known)})` : '';
          hint.innerHTML = lastIn && Math.abs(+lastIn.price-known)<0.005
            ? `آخر سعر شراء: <b>${fmt(known)}</b> لكل ${esc(it.unit)} بتاريخ ${lastIn.date}${base?'':''} — عدّله لو اتغيّر`
            : `السعر المسجل في كارت الأصناف: <b>${fmt(known)}</b> لكل ${esc(it.unit)}${base} — عدّله لو اتغيّر`;
        } else {
          hint.textContent = mul>1
            ? `الصنف ده لسه من غير سعر — اكتب سعر الـ${modeUnit} كامل وهيتحول لسعر ${it.unit} تلقائي`
            : 'الصنف ده لسه من غير سعر — اكتب سعر الوحدة وهيتسجل تلقائي في كارت الأصناف';
        }
      }
    };
    mItem.onchange=()=>{ refreshUnitMode(); refreshPrice(); syncSearchBox(); };
    // خانة البحث السريع: اكتب اسم الصنف وهو يختاره تلقائي من القايمة
    const searchBox=$('#m-item-search'), sHint=$('#m-item-hint');
    const norm = s => String(s||'').trim().toLowerCase();
    function syncSearchBox(){
      const it=item(mItem.value);
      if(searchBox) searchBox.value = it? it.name : '';
      if(sHint) sHint.textContent = it? `${it.cat} · الوحدة: ${it.unit}` : 'اكتب فوق للبحث السريع، أو اختار من القايمة';
    }
    if(searchBox){
      searchBox.oninput=()=>{
        const v=norm(searchBox.value);
        if(!v){ if(sHint){ sHint.textContent='اكتب فوق للبحث السريع، أو اختار من القايمة'; sHint.style.color=''; } return; }
        const hit=S.items.find(i=>norm(i.name)===v);
        if(hit){
          mItem.value=hit.id; refreshUnitMode(); refreshPrice();
          if(sHint){ sHint.textContent=`${hit.cat} · الوحدة: ${hit.unit}`; sHint.style.color=''; }
          const packs=$('#m-packs'); if(packs){ packs.focus(); packs.select(); }
        } else if(sHint){
          const near=S.items.filter(i=>norm(i.name).includes(v)).length;
          sHint.textContent = near? `${near} صنف مطابق — كمّل الكتابة أو اختار من الاقتراحات` : 'مفيش صنف بالاسم ده';
          sHint.style.color = near? '' : 'var(--red)';
        }
      };
    }
    syncSearchBox();
    refreshUnitMode(); refreshPrice();
    const mp=$('#m-packs'); if(mp) mp.oninput=updateConv;
    const mu=$('#m-unitmode'); if(mu) mu.onchange=()=>{ updateConv(); refreshPrice(); };
  }
  root.querySelectorAll('[data-bocell]').forEach(inp=>inp.onchange=async e=>{
    const raw=e.target.dataset.bocell;
    const sep=raw.indexOf(':');
    const oi=+raw.slice(0,sep), itemName=raw.slice(sep+1);
    const order=BO.orders[oi]; if(!order) return;
    if(!order.items) order.items=[];
    const v=e.target.value;
    const ji=order.items.findIndex(x=>x.name===itemName);
    const backup = ji>=0 ? {...order.items[ji]} : null;

    if(v===''||parseFloat(v)<=0){
      if(ji>=0) order.items.splice(ji,1); else return; // مفيش تغيير
    } else {
      const q=parseFloat(v);
      if(isNaN(q)||q<0){ toast('اكتب كمية صحيحة',1); return render(); }
      if(ji>=0) order.items[ji].qty=n2(q);
      else {
        // صنف جديد للفرع ده: بناخد وحدته من أي طلبية تانية فيها نفس الصنف، وإلا نسيبها فاضية
        let unit='';
        for(const o of BO.orders){ const f=(o.items||[]).find(x=>x.name===itemName); if(f){ unit=f.unit; break; } }
        order.items.push({name:itemName, unit, qty:n2(q)});
      }
    }
    const ok=await boSaveOrder(order);
    if(!ok){
      if(backup){ const cur=order.items.findIndex(x=>x.name===itemName); if(cur>=0) order.items[cur]=backup; else order.items.push(backup); }
      else { const cur=order.items.findIndex(x=>x.name===itemName); if(cur>=0) order.items.splice(cur,1); }
    } else toast(`اتحدثت طلبية ${order.branch}`);
    render();
  });
  root.querySelectorAll('[data-boqty]').forEach(inp=>inp.onchange=async e=>{
    const [oi,ji]=e.target.dataset.boqty.split(':').map(Number);
    const order=BO.orders[oi]; if(!order||!order.items||!order.items[ji]) return;
    const v=parseFloat(e.target.value);
    if(isNaN(v)||v<0){ toast('اكتب كمية صحيحة',1); return render(); }
    const old=order.items[ji].qty;
    order.items[ji].qty=n2(v);
    const ok=await boSaveOrder(order);
    if(!ok){ order.items[ji].qty=old; }
    else toast(`اتعدلت كمية "${order.items[ji].name}" عند فرع ${order.branch}`);
    render();
  });
  root.querySelectorAll('[data-boitemdel]').forEach(b=>b.onclick=async ()=>{
    const [oi,ji]=b.dataset.boitemdel.split(':').map(Number);
    const order=BO.orders[oi]; if(!order||!order.items||!order.items[ji]) return;
    const nm=order.items[ji].name;
    if(!confirm(`حذف "${nm}" من طلبية فرع ${order.branch}؟ ده هيتشال فعليًا من طلبية الفرع.`)) return;
    const removed=order.items.splice(ji,1);
    const ok=await boSaveOrder(order);
    if(!ok){ order.items.splice(ji,0,removed[0]); }
    else toast(`اتشال "${nm}" من الطلبية`);
    render();
  });
  root.querySelectorAll('[data-boview]').forEach(b=>b.onclick=()=>{ BO.view=b.dataset.boview; BO.openOrder=null; render(); });
  root.querySelectorAll('[data-boorder]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.boorder;
    BO.openOrder = BO.openOrder===i ? null : i;
    render();
  });
  const bmq=$('#bo-matrix-q'); if(bmq) bmq.oninput=e=>{
    BO.matrixQ=e.target.value; const p=e.target.selectionStart; render();
    const n2el=$('#bo-matrix-q'); if(n2el){ n2el.focus(); n2el.setSelectionRange(p,p); }
  };
  root.querySelectorAll('[data-reasonon]').forEach(cb=>cb.onchange=async e=>{
    const r=e.target.dataset.reasonon, on=e.target.checked;
    let cur = Array.isArray(S.allowedReasons) && S.allowedReasons.length ? S.allowedReasons.slice() : OUT_REASONS.slice();
    if(on){ if(!cur.includes(r)) cur.push(r); }
    else {
      cur = cur.filter(x=>x!==r);

function readLines(){
  const box=$('#rlines'); if(!box) return;
  const norm = s => String(s||'').trim().toLowerCase();
  ui.rlines = [...box.querySelectorAll('.rline')].map(el=>{
    const nameEl = el.querySelector('[data-rl]');
    const qtyEl  = el.querySelector('[data-rq]');
    const it = nameEl ? S.items.find(i=>norm(i.name)===norm(nameEl.value)) : null;
    return { itemId: it? it.id : '', qty: qtyEl? qtyEl.value : '', raw: nameEl? nameEl.value : '' };
  });
}

function dispenseOut(itemId, qty, date, party, reason, force=false){
  // بيسجل حركة منصرف لصنف واحد، وبيشغّل وصفته تلقائيًا لو موجودة. لو الرصيد مش كفاية (للصنف نفسه أو لأي خامة في وصفته)، بيرفض ومايسجّلش أي حاجة خالص —
  // إلا لو force=true (بتُستخدم في أدوات المطابقة مع الصرف الفعلي، لأن الشيت بيمثل حقيقة مؤكدة حصلت فعلاً حتى لو الخامات عندنا رصيدها ناقص)
  const r=S.recipes.find(x=>x.outItemId===itemId);
  if(r && r.outQty>0){
    const b = qty / r.outQty;
    const shortages=[];
    for(const l of r.lines){
      const need = n2(l.qty*b);
      const li = item(l.itemId);
      const bal = li ? calc(li).book : 0;
      if(need > bal){
        if(!force) return {move:null, auto:false, error:`الرصيد مش كفاية لخامة "${li?li.name:'غير معروفة'}" (متاح ${fmt(bal)}، مطلوب ${fmt(need)})`};
        shortages.push({name: li?li.name:'غير معروفة', need, bal});
      }
    }
    const runId=uid('run');
    for(const l of r.lines) S.moves.push({id:uid('m'),dir:'out',itemId:l.itemId,qty:n2(l.qty*b),date,price:0,party:r.name,reason:'صرف للإنتاج (تلقائي)',runId});
    const cost=recipeCost(r)*b, outQty=n2(r.outQty*b);
    S.moves.push({id:uid('m'),dir:'in',itemId:r.outItemId,qty:outQty,date,price: outQty? n2(cost/outQty):0,party:'إنتاج تلقائي: '+r.name,runId});
    S.runs=S.runs||[]; S.runs.push({id:runId,date,name:r.name,batches:n2(b),outQty,cost,auto:true});
    const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
    S.moves.push(m);
    return {move:m, auto:true, shortages: shortages.length?shortages:undefined};
  }
  const it=item(itemId);
  const bal = it ? calc(it).book : 0;
  if(qty > bal){
    if(!force) return {move:null, auto:false, error:`الرصيد مش كفاية (متاح ${fmt(bal)} بس، والمطلوب ${fmt(qty)})`};
  }
  const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
  S.moves.push(m);
  return {move:m, auto:false, shortages: (qty>bal && force)?[{name:it?it.name:'غير معروف', need:qty, bal}]:undefined};
}

// جدول فروع × أصناف قابل للتعديل، بنفس شكل شيت الإكسل الأصلي
// بيحسب المواد الخام اللازمة لتلبية إجمالي طلبيات الفروع كلها، بناءً على الوصفات المسجلة
function buildProductionPlan(){
  const products = [];   // كل منتج مطلوب: المطلوب، الجاهز، المحتاج إنتاجه، عدد التشغيلات، التكلفة
  const needed = {};      // rawItemId -> { it, qty }
  const unmatched = [];

  Object.values(BO.totals).forEach(r=>{
    const match = findMatchingLocalItem(r.name);
    if(!match){ unmatched.push({name:r.name, qty:r.qty, unit:r.unit, reason:'مالوش صنف مطابق في المخزن'}); return; }

    // لازم نحوّل كمية الفرع لوحدة المصنع الأول، وإلا الحساب كله هيطلع غلط
    const cf = convFactorOf(r.name);
    if(cf===null){ unmatched.push({name:r.name, qty:r.qty, unit:r.unit, reason:`وحدة الفرع (${r.unit}) مختلفة عن وحدة المصنع (${match.unit}) — حدد معامل التحويل`}); return; }
    const demand = n2(r.qty * cf);

    const onHand = calc(match).book;                    // المخزون الجاهز من المنتج ده
    const toProduce = n2(Math.max(0, demand - onHand)); // المحتاج إنتاجه فعلًا = المطلوب − الجاهز
    const rec = S.recipes.find(x=>x.outItemId===match.id);

    if(!rec || !(rec.outQty>0)){
      // مفيش وصفة: يا إما جاهز في المخزن (يتصرف مباشرة) يا إما ناقص ومحتاج توريد
      products.push({ name:r.name, item:match, demand, onHand, toProduce, batches:null, cost:0, rec:null,
                      status: toProduce>0 ? 'no_recipe_short' : 'ready' });
      if(toProduce>0) unmatched.push({name:r.name, qty:toProduce, unit:r.unit, reason:'مالوش وصفة إنتاج — لازم يتورّد جاهز'});
      return;
    }

    const batches = toProduce>0 ? toProduce/rec.outQty : 0;
    const cost = n2(recipeCost(rec) * batches);
    products.push({ name:r.name, item:match, demand, onHand, toProduce, batches:n2(batches), cost, rec,
                    status: toProduce>0 ? 'produce' : 'ready' });

    if(batches>0){
      rec.lines.forEach(l=>{
        const li = item(l.itemId); if(!li) return;
        if(!needed[l.itemId]) needed[l.itemId]={it:li, qty:0};
        needed[l.itemId].qty = n2(needed[l.itemId].qty + l.qty*batches);
      });
    }
  });

  const rows = Object.values(needed).map(n=>{
    const bal = calc(n.it).book;
    const short = n2(Math.max(0, n.qty-bal));
    return {...n, bal, short, shortCost: n2(short*(n.it.price||0)) };
  }).sort((a,b)=> b.short - a.short || a.it.name.localeCompare(b.it.name,'ar'));

  products.sort((a,b)=> b.toProduce - a.toProduce);
  return {products, rows, unmatched};
}

/* ================= مقارنة الصرف الفعلي (استيراد شيت مبيعات/صرف مجمّع) ================= */
// الشيت المتوقع: تاريخ | اسم الصنف | الوحدة | الكمية — كل سطر عملية واحدة، ومفيش عمود فرع،
// فبنجمع كل الأسطر بنفس اسم الصنف عشان نطلع الإجمالي الفعلي، ونقارنه بالمطلوب والمسجل عندنا
let ACTUAL_PARSED = null; // {byBranchItem, hasBranch, branches, dateFrom, dateTo, rowsCount, errors}
let CMP_Q = ''; // بحث في شاشة المقارنة

function parseDateFlexible(s){
  s = String(s||'').trim();
  s = s.split(/[T ]/)[0]; // نشيل أي وقت ملحق بالتاريخ (زي "9/10/2026 0:00:00" أو "2026-09-10 00:00:00")
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); // M/D/YYYY
  if(m) return `${m[3]}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); // YYYY-M-D
  if(m) return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/); // D-M-YYYY
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}

// كلمات مفتاحية للتعرف على كل عمود من اسمه، بغض النظر عن ترتيبه في الشيت
const COL_KEYWORDS = {
  branch: ['فرع','account','branch'],
  date:   ['تاريخ','date','issue'],
  name:   ['صنف','منتج','item','name','product'],
  unit:   ['وحده','وحدة','unit'],
  qty:    ['كميه','كمية','qty','quantity'],
};
function detectColumnMap(headerCells){
  const map = {};
  headerCells.forEach((cell,i)=>{
    const norm = String(cell||'').trim().toLowerCase();
    if(!norm) return;
    for(const [field,keywords] of Object.entries(COL_KEYWORDS)){
      if(map[field]!==undefined) continue; // أول عمود يطابق الكلمة المفتاحية بس اللي بياخده
      if(keywords.some(k=>norm.includes(k))){ map[field]=i; break; }
    }
  });
  // لازم نلاقي على الأقل صنف وكمية عشان نعتبره صف عناوين حقيقي
  return (map.name!==undefined && map.qty!==undefined) ? map : null;
}

// نسخة async بتعالج على دفعات صغيرة (بدل حلقة واحدة طويلة) عشان المتصفح يفضل مستجيب مهما كان حجم البيانات،
// وبتنادي onProgress كل دفعة عشان نعرض تقدّم حقيقي بدل رسالة ثابتة
async function parseActualDispenseSheetAsync(text, onProgress){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));

  // وقف أمان: لو الشيت فيه صفوف أكتر بكتير من المعقول (زي بقايا تنسيق قديمة في ملفات إكسل)، نحذّر بدل ما نعالج آلاف الصفوف الفاضية
  if(lines.length > 100000){
    return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[],
      errors:[`الشيت فيه ${lines.length.toLocaleString('en-US')} سطر — ده أكتر من المتوقع بكتير وممكن يبقى فيه بيانات فاضية زيادة من الملف. راجع الملف الأول.`]};
  }

  let colMap = detectColumnMap(firstCells);
  let start = colMap ? 1 : 0;
  if(!colMap){
    const hasBranch = firstCells.length>=5 && !parseDateFlexible(firstCells[0]) && parseDateFlexible(firstCells[1])!=='';
    colMap = hasBranch ? {branch:0,date:1,name:2,unit:3,qty:4} : {date:0,name:1,unit:2,qty:3};
    start = parseDateFlexible(firstCells[colMap.date]) ? 0 : 1;
  }

  const hasBranch = colMap.branch!==undefined;
  const byBranchItem = {};
  const byDateBranchItem = {};
  const branchesSet = new Set();
  const errors = [];
  let dateFrom='', dateTo='';
  let rowsCount=0;

  const CHUNK = 500; // نعالج 500 سطر ونوقف نلحق نفَس للمتصفح، بدل ما نكمل مليون سطر مرة واحدة
  const t0 = Date.now();
  const HARD_LIMIT_MS = 30000; // لو المعالجة عدت 30 ثانية، نوقف بدل ما نسيب المتصفح معلّق للأبد

  for(let i=start;i<lines.length;i++){
    const cells = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const branch = hasBranch ? (cells[colMap.branch]||'—') : '—';
    const rawDate = colMap.date!==undefined ? cells[colMap.date] : '';
    const name    = cells[colMap.name];
    const unit    = colMap.unit!==undefined ? cells[colMap.unit] : '';
    const qty     = cells[colMap.qty];
    if(name){
      const date = parseDateFlexible(rawDate);
      const q = +qty;
      if(!(q>0)){ if(errors.length<20) errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); }
      else{
        branchesSet.add(branch);
        if(!byBranchItem[branch]) byBranchItem[branch]={};
        if(!byBranchItem[branch][name]) byBranchItem[branch][name] = { name, unit: unit||'', qty:0, rows:0 };
        byBranchItem[branch][name].qty = n2(byBranchItem[branch][name].qty + q);
        byBranchItem[branch][name].rows++;
        rowsCount++;
        if(date){
          if(!byDateBranchItem[date]) byDateBranchItem[date]={};
          if(!byDateBranchItem[date][branch]) byDateBranchItem[date][branch]={};
          if(!byDateBranchItem[date][branch][name]) byDateBranchItem[date][branch][name]={name,unit:unit||'',qty:0};
          byDateBranchItem[date][branch][name].qty = n2(byDateBranchItem[date][branch][name].qty + q);
          if(!dateFrom || date<dateFrom) dateFrom=date; if(!dateTo || date>dateTo) dateTo=date;
        }
      }
    }

    if(i % CHUNK === 0){
      if(Date.now()-t0 > HARD_LIMIT_MS){
        errors.push(`⚠️ المعالجة وقفت بعد 30 ثانية عشان ماتجمّدش المتصفح — اتعالج ${i} من ${lines.length} سطر بس. الشيت كبير جدًا، جرّب تقسمه لأجزاء أصغر.`);
        break;
      }
      if(onProgress) onProgress(Math.round((i/lines.length)*100));
      await new Promise(r=>setTimeout(r,0)); // نسيب نفَس للمتصفح يرسم ويستجيب قبل ما نكمل الدفعة اللي بعدها
    }
  }
  if(onProgress) onProgress(100);
  return {byBranchItem, byDateBranchItem, hasBranch, branches:[...branchesSet].sort((a,b)=>a.localeCompare(b,'ar')), dateFrom, dateTo, rowsCount, errors};
}
// النسخة القديمة المتزامنة لسه موجودة لأي استخدام تاني في النظام محتاجها بشكل مباشر
function parseActualDispenseSheet(text){
  const lines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return {byBranchItem:{}, byDateBranchItem:{}, hasBranch:false, dateFrom:'', dateTo:'', rowsCount:0, branches:[], errors:['الشيت فاضي']};
  const splitRow = l => l.includes('\t') ? l.split('\t') : l.split(',');
  const firstCells = splitRow(lines[0]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));

  // أولوية أولى: نحاول نتعرف على الأعمدة من عناوينها (بيشتغل مهما كان ترتيب الأعمدة في الشيت)
  let colMap = detectColumnMap(firstCells);
  let start = colMap ? 1 : 0;

  // لو مفيش صف عناوين واضح، نرجع للتخمين بالترتيب القديم كحل بديل (توافق مع شيتات قديمة)
  if(!colMap){
    const hasBranch = firstCells.length>=5 && !parseDateFlexible(firstCells[0]) && parseDateFlexible(firstCells[1])!=='';
    colMap = hasBranch ? {branch:0,date:1,name:2,unit:3,qty:4} : {date:0,name:1,unit:2,qty:3};
    const dateColIdx = colMap.date;
    start = parseDateFlexible(firstCells[dateColIdx]) ? 0 : 1;
  }

  const hasBranch = colMap.branch!==undefined;
  const byBranchItem = {}; // branch -> { itemName -> {name,unit,qty,rows} }
  const byDateBranchItem = {}; // date -> branch -> itemName -> {name,unit,qty}
  const branchesSet = new Set();
  const errors = [];
  let dateFrom='', dateTo='';
  let rowsCount=0;

  for(let i=start;i<lines.length;i++){
    const cells = splitRow(lines[i]).map(x=>String(x||'').trim().replace(/^"|"$/g,''));
    const branch = hasBranch ? (cells[colMap.branch]||'—') : '—';
    const rawDate = colMap.date!==undefined ? cells[colMap.date] : '';
    const name    = cells[colMap.name];
    const unit    = colMap.unit!==undefined ? cells[colMap.unit] : '';
    const qty     = cells[colMap.qty];
    if(!name) continue;
    const date = parseDateFlexible(rawDate);
    const q = +qty;
    if(!(q>0)){ if(errors.length<20) errors.push(`سطر ${i+1}: كمية غير صحيحة (${qty})`); continue; }
    branchesSet.add(branch);
    if(!byBranchItem[branch]) byBranchItem[branch]={};
    if(!byBranchItem[branch][name]) byBranchItem[branch][name] = { name, unit: unit||'', qty:0, rows:0 };
    byBranchItem[branch][name].qty = n2(byBranchItem[branch][name].qty + q);
    byBranchItem[branch][name].rows++;
    rowsCount++;
    // بنحافظ على تفاصيل كل يوم لوحده كمان (مش بس الإجمالي)، عشان عملية "الاستبدال الكامل" تقدر تسجّل كل يوم بتاريخه الحقيقي
    if(date){
      if(!byDateBranchItem[date]) byDateBranchItem[date]={};
      if(!byDateBranchItem[date][branch]) byDateBranchItem[date][branch]={};
      if(!byDateBranchItem[date][branch][name]) byDateBranchItem[date][branch][name]={name,unit:unit||'',qty:0};
      byDateBranchItem[date][branch][name].qty = n2(byDateBranchItem[date][branch][name].qty + q);
    }
    if(date){ if(!dateFrom || date<dateFrom) dateFrom=date; if(!dateTo || date>dateTo) dateTo=date; }
  }
  return {byBranchItem, byDateBranchItem, hasBranch, branches:[...branchesSet].sort((a,b)=>a.localeCompare(b,'ar')), dateFrom, dateTo, rowsCount, errors};
}

function buildDispenseComparison(){
  if(!ACTUAL_PARSED) return null;
  const {byBranchItem, hasBranch, branches, dateFrom, dateTo} = ACTUAL_PARSED;
  const norm = s => String(s||'').trim().toLowerCase();

  // المسجل فعليًا عندنا في المصنع (صرف للفروع) في نفس مدى التواريخ، مقسّم بالفرع (m.party) والصنف
  const recordedByBranchItem = {};
  if(dateFrom && dateTo){
    S.moves.filter(m=>m.dir==='out' && m.reason==='صرف للفروع' && m.date>=dateFrom && m.date<=dateTo).forEach(m=>{
      const it=item(m.itemId); if(!it) return;
      const br = hasBranch ? (m.party||'—') : '—';
      if(!recordedByBranchItem[br]) recordedByBranchItem[br]={};
      recordedByBranchItem[br][it.name] = n2((recordedByBranchItem[br][it.name]||0) + (+m.qty||0));
    });
  }

  // المطلوب من طلبيات الفروع — لو عندنا تفاصيل الطلبيات بالفرع (BO.orders) نطابق بالفرع، وإلا نرجع للإجمالي العام بس
  const findRequested = (branch, itemName) => {
    if(hasBranch && BO.orders && BO.orders.length){
      const order = BO.orders.find(o=>norm(o.branch)===norm(branch));
      if(order){ const line=(order.items||[]).find(x=>norm(x.name)===norm(itemName)); return line ? +line.qty : null; }
      return null;
    }
    const entry = Object.entries(BO.totals||{}).find(([n])=>norm(n)===norm(itemName));
    return entry ? entry[1].qty : null;
  };

  const rows = [];
  Object.entries(byBranchItem).forEach(([branch, items])=>{
    Object.values(items).forEach(actual=>{
      const match = findMatchingLocalItem(actual.name);
      const recorded = match ? ((recordedByBranchItem[branch]||{})[match.name]||0) : 0;
      const requested = findRequested(branch, actual.name);
      const diff = n2(actual.qty - recorded);
      rows.push({ branch, ...actual, match, recorded, requested, diff });
    });
  });
  rows.sort((a,b)=> Math.abs(b.diff)-Math.abs(a.diff));

  return { rows, hasBranch, branches, dateFrom, dateTo };
}

function extraItemsList(){
  const norm = s => String(s||'').trim().toLowerCase();
  const known = new Set([...CORE_ITEMS, ...APPETIZER_ITEMS, ...NADER_SAUCES].map(x=>norm(x.name)));
  const seen = new Set(); const list = [];
  BO.orders.forEach(o=>(o.items||[]).forEach(it=>{
    const n = norm(it.name);
    if(known.has(n) || seen.has(n)) return;
    seen.add(n);
    list.push({ label: it.name, name: it.name });
  }));
  return list.sort((a,b)=>a.label.localeCompare(b.label,'ar'));
}

    body += `<tr><td><div class="iname">${esc(br)}</div></td>`;
    showCols.forEach(ci=>{
      const ji = (o.items||[]).findIndex(x=>x.name===ci.name);
