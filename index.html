<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#E8ECEE; --surface:#fff; --ink:#14181C; --brand:#14181C; --brand-bg:#EEF1F3; --muted:#69747E; --line:#CFD8DD;
  --green:#2E6B4F; --amber:#A96A0E; --red:#B23B2E; --blue:#23506E;
  --greenbg:#E4EFE8; --amberbg:#F7EDDC; --redbg:#F6E4E1; --bluebg:#E3EBF1;
  --r:10px;
}
*{box-sizing:border-box}
#root{
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; padding:0 0 60px;
  font-size:14px; line-height:1.5;
}
.boot{padding:40px;text-align:center;color:var(--muted)}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; direction:ltr; display:inline-block}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
 
/* ---------- header ---------- */
header{background:var(--brand);color:#fff;padding:14px 0 0}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px}
.warnbar{background:#B87514;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:8px;margin-bottom:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#93A0AA;letter-spacing:0}
.hstat{margin-inline-start:auto;display:flex;gap:22px;flex-wrap:wrap}
.hstat div{text-align:center}
.hstat b{display:block;font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr}
.hstat span{font-size:11px;color:#93A0AA}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:rgba(255,255,255,.72);padding:10px 14px;border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:13.5px}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#fff;background:rgba(255,255,255,.08)}
nav .lk{font-size:11px;margin-inline-end:5px;opacity:.85}
nav .lk.open{opacity:.5}
.lockrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #EDF1F3;flex-wrap:wrap}
.lockrow:last-child{border-bottom:0}
.lockrow .nm{font-weight:500;flex:1 1 150px}
 
/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.panel>h2{font-size:14.5px;font-weight:700;padding:12px 14px;border-bottom:2px solid var(--brand-bg);background:#F6F8F9;display:flex;align-items:center;gap:10px}
.panel>h2 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.pad{padding:14px}
 
/* ---------- ledger strip (signature) ---------- */
.ledger{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;flex-wrap:wrap}
.ledger .cell{flex:1 1 110px;padding:10px 12px;border-inline-start:1px solid var(--line);min-width:0}
.ledger .cell:first-child{border-inline-start:0}
.ledger .op{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;background:#F6F8F9;border-inline-start:1px solid var(--line)}
.ledger .k{font-size:11px;color:var(--muted);white-space:nowrap}
.ledger .v{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:start}
.ledger .cell.book{background:var(--bluebg)}
.ledger .cell.real{background:#F6F8F9}
.ledger .cell.diff.ok{background:var(--greenbg)} .ledger .cell.diff.ok .v{color:var(--green)}
.ledger .cell.diff.bad{background:var(--redbg)} .ledger .cell.diff.bad .v{color:var(--red)}
 
/* ---------- table ---------- */
.tblwrap{overflow:auto;max-height:min(66vh,720px)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#F6F8F9;text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:7px 10px;border-bottom:1px solid #EDF1F3;vertical-align:middle}
tbody tr:hover{background:#FAFCFC}
tr.catrow td{background:#EEF2F4;color:var(--muted);font-weight:600;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.catrow:hover td{background:#EEF2F4}
input.cell.syncing{background:#FCF6EA;border-color:#EDD9AE}
input.cell.sync-err{background:#F6E4E1;border-color:#E6C6C1}
td.n{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
th.n{text-align:end}
/* فواصل رأسية للأعمدة الرقمية عشان كل رقم يبان تحت عنوانه بالظبط */
table.gridcols th, table.gridcols td{border-inline-start:1px solid #EDF1F3}
table.gridcols th:first-child, table.gridcols td:first-child{border-inline-start:none}
table.gridcols td.n{padding-inline:14px}
table.gridcols th.n{padding-inline:14px}
table.gridcols td.hl{background:#F7FAFB;font-weight:700}
table.gridcols tbody tr:hover td.hl{background:#EEF4F6}
.iname{font-weight:500}
.idesc{font-size:11px;color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:#EEF2F4;color:var(--muted);white-space:nowrap}
.chip.g{background:var(--greenbg);color:var(--green)} .chip.a{background:var(--amberbg);color:var(--amber)}
.chip.r{background:var(--redbg);color:var(--red)} .chip.b{background:var(--brand-bg);color:var(--brand)}
.lowrow{background:var(--redbg)}
.pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--muted)}
 
/* ---------- controls ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFDFD}
.cattabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.cattab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--muted)}
.cattab:hover{background:var(--brand-bg)}
.cattab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.cattab .ct-n{opacity:.75;font-weight:400}
input[type=text],input[type=number],input[type=date],select{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
input.cell{width:88px;text-align:start;font-family:'IBM Plex Mono',monospace;direction:ltr;padding:5px 7px}
input.cell.filled{border-color:var(--green);background:#F4FAF6}
.grow{flex:1 1 180px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;color:var(--ink)}
.btn:hover{background:#F2F6F7}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.p:hover{background:#2A333B}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#E6C6C1}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:12px;font-weight:600;color:var(--ink);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
 
/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:23px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;margin-top:3px}
.card .s{font-size:11.5px;color:var(--muted);margin-top:2px}
 
/* ---------- toast / modal ---------- */
#toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--brand);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(15,22,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line);background:#FAFCFC}
.rlines{display:flex;flex-direction:column;gap:7px}
.rline{display:flex;gap:7px;align-items:center}
.rline select{flex:1 1 auto;min-width:0}
@media(max-width:640px){
  .hstat{width:100%;margin:0;gap:14px;justify-content:space-between}
  .ledger .cell{flex:1 1 84px;padding:8px} .ledger .v{font-size:16px}
}
@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;top:0;left:0;width:100%;padding:20px}
  .modal{position:static;background:none;padding:0}
  .modal .box{box-shadow:none;max-width:100%}
  .foot,.modal h3{display:none}
}
</style>

/* ---------- storage ---------- */
let MODE = 'memory';   // cloud | browser | memory
const MEM = {};
const hasStore = () => typeof window!=='undefined' && window.storage && typeof window.storage.set==='function';
function lsOK(){ try{ const k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } }
 
async function sget(k){
  if(hasStore()){
    try{ const r=await window.storage.get(k); if(r&&r.value){ MODE='cloud'; return JSON.parse(r.value); } }catch(e){}
  }
  if(lsOK()){
    try{ const v=window.localStorage.getItem(k); if(v){ if(MODE!=='cloud') MODE='browser'; return JSON.parse(v); } }catch(e){}
  }
  return MEM[k]!==undefined? MEM[k] : null;
}
async function sset(k,v){
  MEM[k]=v; const txt=JSON.stringify(v); let saved=false;
  if(hasStore()){ try{ await window.storage.set(k,txt); MODE='cloud'; saved=true; }catch(e){} }
  if(!saved && lsOK()){ try{ window.localStorage.setItem(k,txt); MODE='browser'; saved=true; }catch(e){} }
  if(!saved){ const was=MODE; MODE='memory'; if(was!=='memory' && $('#root') && $('#root').dataset.ready) render(); }
  return saved;
}

async function sb(path,opts={}){
  const base=DB.url.replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:{apikey:DB.key,Authorization:'Bearer '+DB.key,'Content-Type':'application/json',
             Prefer:opts.prefer||'return=minimal'},
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,180)||('HTTP '+r.status)); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
const UPSERT={method:'POST',prefer:'resolution=merge-duplicates,return=minimal'};

}

/* ---------- calculations ---------- */
function calc(it){
  let inQ=0,outQ=0,inVal=0;
  for(const m of S.moves){
    if(m.itemId!==it.id) continue;
    if(m.dir==='in'){ inQ+=m.qty; inVal+=m.qty*(m.price||0); } else outQ+=m.qty;
  }
  const book = n2(it.opening + inQ - outQ);
  const counted = S.counts[it.id];
  const has = counted!==undefined && counted!==null && counted!=='';
  const real = has? +counted : null;
  return { inQ:n2(inQ), outQ:n2(outQ), inVal, book, real, has, diff: has? n2(real-book):null,
           value: n2((has?real:book)*(it.price||0)) };
}
function totals(){
  let value=0, counted=0, low=0, gain=0, loss=0, lossVal=0;
  for(const it of S.items){
    const c=calc(it); value+=c.value; if(c.has) counted++;
    const onhand = c.has?c.real:c.book;
    if(it.min>0 && onhand<=it.min) low++;
    if(c.has&&c.diff>0) gain+=1;
    if(c.has&&c.diff<0){ loss+=1; lossVal += Math.abs(c.diff)*(it.price||0); }
  }
  return {value,counted,low,gain,loss,lossVal,total:S.items.length};
}
function recipeCost(r){
  return r.lines.reduce((s,l)=>{const it=item(l.itemId); return s + (it? (it.price||0)*l.qty : 0);},0);
}

/* ---------- filters ---------- */
const CATEGORY_ORDER = ['خامات','منتجات جديدة','تعبئة وتغليف'];
const catRank = c => { const i=CATEGORY_ORDER.indexOf(c); return i===-1?999:i; };
function sortItemsList(list){
  return list.slice().sort((a,b)=>{
    const ra=catRank(a.cat), rb=catRank(b.cat);
    if(ra!==rb) return ra-rb;
    if(a.cat!==b.cat) return a.cat.localeCompare(b.cat,'ar');
    return String(a.id).localeCompare(String(b.id));
  });
}
function filtered(){
  const q=ui.q.trim().toLowerCase();
  const list = S.items.filter(it=>{
    if(ui.cat!=='الكل' && it.cat!==ui.cat) return false;
    if(q && !(it.name.toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q))) return false;
    if(ui.only!=='الكل'){
      const c=calc(it);
      if(ui.only==='ناقص' && !(c.has&&c.diff<0)) return false;
      if(ui.only==='زيادة' && !(c.has&&c.diff>0)) return false;
      if(ui.only==='لسه' && c.has) return false;
      if(ui.only==='تحت الحد' && !(it.min>0 && (c.has?c.real:c.book)<=it.min)) return false;
    }
    return true;
  });
  return sortItemsList(list);
}
const cats = ()=>['الكل',...[...new Set(S.items.map(i=>i.cat))].sort((a,b)=>{
  const ra=catRank(a), rb=catRank(b); return ra!==rb? ra-rb : a.localeCompare(b,'ar');
})];
function filterBar(withOnly){
  return `<div class="bar">
    <input type="text" class="grow" id="q" placeholder="دور على صنف…" value="${esc(ui.q)}">
    <select id="cat">${cats().map(c=>`<option ${ui.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    ${withOnly?`<select id="only">${['الكل','لسه','ناقص','زيادة','تحت الحد'].map(c=>`<option ${ui.only===c?'selected':''}>${c}</option>`).join('')}</select>`:''}
  </div>`;
}

// نفس بيانات الاتصال المستخدمة في تطبيق الفروج بالظبط، عشان نقرأ منه بس (قراءة فقط، مفيش أي كتابة أو تعديل هناك)
const FAROOJ_GSCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMNYT0w8XeiPSXW9_of3gA7fyS6EqCw842-YA5MfVMRdppDbkz_w5Wr9xZCviXSaJw/exec";
const FAROOJ_SECRET_TOKEN = "B_pS9joBTY2q0lCXopjE5xMegt4fCEl9sTsyNqSGFI0";

async function faroojRequest(params){
  const res = await fetch(FAROOJ_GSCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: new URLSearchParams({...params, token: FAROOJ_SECRET_TOKEN}).toString()
  });
  if(!res.ok) throw new Error('تعذر الاتصال بتطبيق الفروج');
  const data = await res.json();
  if(!data.success && data.error && data.error !== 'not_found') throw new Error(data.error);
  return data;
}
async function faroojList(prefix){
  const r = await faroojRequest({action:'list', prefix});
  return r.success ? (r.keys||[]) : [];
}
async function faroojGet(key){
  const r = await faroojRequest({action:'get', key});
  return r.success ? r.value : null;
}
// الجسر بقى ليه صلاحية كتابة كمان، عشان تعديل الطلبية من المصنع يوصل فعليًا لطلبية الفرع
async function faroojSet(key, value){
  const r = await faroojRequest({action:'set', key, value});
  return !!r.success;
}
function faroojDateRange(from, to){
  const dates=[]; let d=new Date(from+'T00:00:00'); const end=new Date(to+'T00:00:00'); let g=0;
  while(d<=end && g<60){ dates.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`); d.setDate(d.getDate()+1); g++; }
  return dates;
}

let BO = { from:'', to:'', loading:false, err:'', totals:{}, orders:[], ordersCount:0, branchesCount:0, view:'totals', openOrder:null, changes:[], changesCount:0 };

async function fetchBranchOrders(){
  BO.loading=true; BO.err=''; render();
  try{
    const dates = faroojDateRange(BO.from, BO.to);
    const listResults = await Promise.all(dates.map(d=>faroojList(`inv_factory_order:${d}:`)));
    const allKeys = listResults.flat();
    const results = await Promise.all(allKeys.map(k=>faroojGet(k).catch(()=>null)));
    const totals={}; const branches=new Set(); const orders=[]; let ordersCount=0;
    results.forEach((v,i)=>{
      if(!v) return;
      let data; try{ data=JSON.parse(v); }catch(e){ return; }
      ordersCount++; branches.add(data.branch);
      orders.push({...data, _key: allKeys[i]}); // بنحتفظ بمفتاح السجل عشان نقدر نكتب فيه التعديل
      (data.items||[]).forEach(it=>{
        if(!totals[it.name]) totals[it.name]={name:it.name, unit:it.unit, qty:0};
        totals[it.name].qty = n2(totals[it.name].qty + (+it.qty||0));
      });
    });
    orders.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    BO.totals=totals; BO.orders=orders; BO.ordersCount=ordersCount; BO.branchesCount=branches.size;
  }catch(e){ BO.err=e.message; }
  await fetchFactoryChangeRequests();
  BO.loading=false; render();
}

async function fetchFactoryChangeRequests(){
  try{
    const idxVal = await faroojGet('inv_factory_order_change:index');
    const index = idxVal ? JSON.parse(idxVal) : [];
    const sorted = index.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
    const details = await Promise.all(sorted.map(r=>faroojGet(`inv_factory_order_change:${r.id}`).catch(()=>null)));
    BO.changes = sorted.map((r,i)=>{
      let note='-';
      try{ if(details[i]) note = JSON.parse(details[i]).note || '-'; }catch(e){}
      return {...r, note};
    });
    BO.changesCount = BO.changes.filter(r=>r.status==='pending').length;
  }catch(e){ BO.changes=[]; BO.changesCount=0; }
}

async function decideFactoryChangeRequest(id, decision){
  try{
    const idxVal = await faroojGet('inv_factory_order_change:index');
    let index = idxVal ? JSON.parse(idxVal) : [];
    const idx = index.findIndex(r=>r.id===id);
    if(idx===-1) return;
    index[idx].status = decision;
    const ok = await faroojSet('inv_factory_order_change:index', JSON.stringify(index));
    if(!ok) throw new Error();
    try{
      const fullVal = await faroojGet(`inv_factory_order_change:${id}`);
      if(fullVal){ const obj=JSON.parse(fullVal); obj.status=decision; await faroojSet(`inv_factory_order_change:${id}`, JSON.stringify(obj)); }
    }catch(e){}
    toast(decision==='done' ? 'اتعلّم الطلب إنه اتعمل' : 'اترفض الطلب');
    await fetchFactoryChangeRequests();
    render();
  }catch(e){ toast('حصل خطأ أثناء تحديث الحالة، حاول تاني',1); }
}

/* ================= 1. الجرد الشهري ================= */
function viewCount(){
  if(ROLE==='manager') return viewCountManager();
  const t=totals(), list=filtered();
  const sumOpen=S.items.reduce((s,i)=>s+i.opening*(i.price||0),0);
  let sumIn=0,sumOut=0;
  for(const it of S.items){const c=calc(it); sumIn+=c.inVal; sumOut+=c.outQ*(it.price||0);}
  const book=sumOpen+sumIn-sumOut, real=t.value, d=n2(real-book);
  return `
  <div class="panel"><div class="pad">
    <div class="ledger">
      <div class="cell"><div class="k">أول المدة</div><div class="v">${money(sumOpen)}</div></div>
      <div class="op">+</div>
      <div class="cell"><div class="k">وارد</div><div class="v">${money(sumIn)}</div></div>
      <div class="op">−</div>
      <div class="cell"><div class="k">منصرف</div><div class="v">${money(sumOut)}</div></div>
      <div class="op">=</div>
      <div class="cell book"><div class="k">الرصيد الدفتري</div><div class="v">${money(book)}</div></div>
      <div class="op">⟷</div>
      <div class="cell real"><div class="k">الجرد الفعلي</div><div class="v">${money(real)}</div></div>
      <div class="cell diff ${d<0?'bad':'ok'}"><div class="k">الفرق</div><div class="v">${d>0?'+':''}${money(d)}</div></div>
    </div>
    <div class="hint" style="margin-top:9px">القيم بالدرهم. اكتب الكمية اللي عدّيتها في المخزن في عمود «الفعلي» — الفرق بيتحسب لوحده. اضغط ↓ أو Enter بعد ما تكتب الرقم عشان تنتقل للصنف اللي بعده على طول من غير ما تلمس الماوس.</div>
  </div></div>
 
  <div class="panel">
    <h2>ورقة الجرد <em>${t.counted} من ${t.total} صنف اتعدّوا</em>
      ${DB.on?`<span class="chip ${DB.err?'r':'b'}" style="margin-inline-start:auto">${DB.busy?'بيحدّث…':DB.err?'خطأ اتصال':'آخر تحديث من المدير: '+(DB.last||'—')}</span>
      <button class="btn sm" data-act="db-pull-quiet">تحديث دلوقتي</button>`:'<span style="margin-inline-start:auto"></span>'}
      <button class="btn sm" data-act="fill-book">اعتبر كل اللي فاضي مطابق للدفتري</button></h2>
    ${filterBar(true)}
    <div class="tblwrap"><table>
      <thead><tr><th>الصنف</th><th>الوحدة</th><th>أول المدة</th><th>وارد</th><th>منصرف</th><th>دفتري</th><th>الفعلي</th><th>الفرق</th><th>قيمة الفرق</th></tr></thead>
      <tbody>${(()=>{let lastCat=null; return list.map((it,idx)=>{const c=calc(it);
        const hdr = it.cat!==lastCat ? (lastCat=it.cat, `<tr class="catrow"><td colspan="9">${esc(it.cat)}</td></tr>`) : '';
        return hdr+`<tr>
          <td><div class="iname">${esc(it.name)}</div><div class="idesc">${esc(it.desc)}</div></td>
          <td><span class="chip">${esc(it.unit)}</span></td>
          <td class="n">${fmt(it.opening)}</td>
          <td class="n pos">${c.inQ?'+'+fmt(c.inQ):'—'}</td>
          <td class="n neg">${c.outQ?'−'+fmt(c.outQ):'—'}</td>
          <td class="n"><b>${fmt(c.book)}</b></td>
          <td><input type="number" step="any" class="cell${c.has?' filled':''}" data-count="${it.id}" data-row="${idx}" value="${c.has?c.real:''}" placeholder="—"></td>
          <td class="n ${c.has?(c.diff>0?'pos':c.diff<0?'neg':'zero'):''}">${c.has?(c.diff>0?'+':'')+fmt(c.diff):'—'}</td>
          <td class="n ${c.has&&c.diff<0?'neg':''}">${c.has&&it.price?money(c.diff*it.price):'—'}</td>
        </tr>`;}).join('');})()||`<tr><td colspan="9" class="empty">مفيش أصناف بالفلتر ده</td></tr>`}
      </tbody></table></div>
  </div>`;
}

        <td><div class="iname">${esc(it.name)}</div>${m.runId?'<span class="hint"> (خط إنتاج تلقائي)</span>':''}</td>

        <td>${ui.mvEdit?`<input type="date" value="${m.prodDate||''}" data-mvprod="${m.id}" style="padding:4px 6px;font-size:12px">`:(m.prodDate?`<span class="n">${m.prodDate}</span>`:'<span class="hint">—</span>')}</td>
        <td class="n">${ui.mvEdit?`<input type="number" step="any" value="${m.temp!=null&&m.temp!==''?m.temp:''}" data-mvtemp="${m.id}" placeholder="—" style="padding:4px 6px;font-size:12px;width:58px;text-align:center">`:(m.temp!=null&&m.temp!==''?`${m.temp}\u00B0`:'<span class="hint">—</span>')}</td>
        ${isIn?`<td class="n">${ui.mvEdit && ROLE==='owner'?`<input type="number" step="any" min="0" value="${m.price||0}" data-mvprice="${m.id}" style="padding:4px 6px;font-size:12px;width:70px;text-align:center">`:money(m.price||0)}</td><td class="n hl">${money(m.qty*(m.price||0))}</td><td>${esc(m.party||'—')}</td>`
              :`<td><span class="chip ${m.reason==='هالك / تالف'?'r':'b'}">${esc(m.reason||'—')}</span></td><td>${esc(m.party||'—')}</td>`}
        <td style="white-space:nowrap"><button class="btn sm" data-act="print-move" data-print="${m.id}">🖨️</button> <button class="btn sm danger" data-del="${m.id}">حذف</button></td></tr>`;}).join('')
        ||`<tr><td colspan="${ui.mvEdit?10:9}" class="empty">${rows.length?'مفيش حركات مطابقة للفلتر':'لسه مفيش حركات '+(isIn?'وارد':'منصرف')+' الشهر ده'}</td></tr>`}
      </tbody>
      ${shownMoves.length?`<tfoot><tr style="font-weight:700">
        <td colspan="${ui.mvEdit?3:2}">الإجمالي</td>
        <td class="n">${fmt(shownMoves.reduce((s,m)=>s+ +m.qty,0))}</td>
        <td colspan="2"></td>
        ${isIn?`<td></td><td class="n hl">${money(shownMoves.reduce((s,m)=>s+m.qty*(m.price||0),0))}</td><td></td>`:'<td colspan="2"></td>'}
        <td></td></tr></tfoot>`:''}
    </table></div>
  </div>`;
}

      <td>${r.id?`<button class="btn sm danger" data-act="del-run" data-id="${r.id}">تراجع</button>`:''}</td></tr>`).join('')

/* ================= 6. التقارير والإقفال ================= */
function viewRep(){
  const t=totals();
  const byCat={};
  for(const it of S.items){const c=calc(it); byCat[it.cat]=(byCat[it.cat]||0)+c.value;}
  const varis=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.c.has&&x.c.diff!==0&&x.it.price>0)
    .sort((a,b)=>Math.abs(b.c.diff*b.it.price)-Math.abs(a.c.diff*a.it.price)).slice(0,12);
  const low=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.it.min>0&&(x.c.has?x.c.real:x.c.book)<=x.it.min);
  const noPrice=S.items.filter(i=>!i.price).length;
  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">قيمة المخزون</div><div class="v">${money(t.value)}</div><div class="s">درهم إماراتي</div></div>
    <div class="card"><div class="k">عجز الجرد</div><div class="v" style="color:var(--red)">${money(t.lossVal)}</div><div class="s">${t.loss} صنف ناقص</div></div>
    <div class="card"><div class="k">أصناف زيادة</div><div class="v" style="color:var(--green)">${t.gain}</div><div class="s">أكتر من الدفتري</div></div>
    <div class="card"><div class="k">تحت الحد الأدنى</div><div class="v" style="color:var(--amber)">${t.low}</div><div class="s">محتاجة طلبية</div></div>
    <div class="card"><div class="k">من غير سعر</div><div class="v">${noPrice}</div><div class="s">مش داخلة في القيمة</div></div>
  </div></div></div>
 
  <div class="panel"><h2>قيمة المخزون حسب القسم</h2><div class="pad">
    ${Object.entries(byCat).map(([c,v])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(c)}</span><span class="num">${money(v)}</span></div>
      <div style="height:7px;background:#EEF2F4;border-radius:5px;overflow:hidden;margin-top:3px">
        <div style="height:100%;width:${t.value?Math.max(2,v/t.value*100):0}%;background:var(--blue)"></div></div></div>`).join('')}
  </div></div>
 
  <div class="panel"><h2>أكبر فروقات الجرد <em>بالقيمة</em></h2>
    ${varis.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>دفتري</th><th>فعلي</th><th>الفرق</th><th>قيمة الفرق</th></tr></thead>
    <tbody>${varis.map(({it,c})=>`<tr><td>${esc(it.name)}</td><td class="n">${fmt(c.book)}</td><td class="n">${fmt(c.real)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}">${c.diff>0?'+':''}${fmt(c.diff)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}"><b>${money(c.diff*it.price)}</b></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">لما تدخل الجرد الفعلي والأسعار، الفروقات هتظهر هنا مرتبة بالقيمة.</div>`}
  </div>
 
  <div class="panel"><h2>أصناف محتاجة طلبية</h2>
    ${low.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>الرصيد</th><th>الحد الأدنى</th><th>الناقص</th></tr></thead>
    <tbody>${low.map(({it,c})=>{const oh=c.has?c.real:c.book;return `<tr><td>${esc(it.name)}</td><td class="n">${fmt(oh)} ${esc(it.unit)}</td><td class="n">${fmt(it.min)}</td><td class="n neg">${fmt(it.min-oh)}</td></tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">مفيش صنف تحت الحد الأدنى — أو لسه محددتش الحدود الدنيا في كارت الأصناف.</div>`}
  </div>
 
  <div class="panel"><h2>إقفال الشهر</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">الإقفال بيخلي <b>الجرد الفعلي</b> هو رصيد أول المدة للشهر الجاي، ويحفظ نسخة من ${periodLabel(S.period)} في الأرشيف، ويفضّي الوارد والمنصرف. الأصناف اللي متجردتش هتاخد رصيدها الدفتري.</div>
    <div class="hint" style="margin-bottom:10px;background:#FCF6EA;border:1px solid #EDD9AE;border-radius:8px;padding:9px">
      <b>عشان بياناتك متضيعش خالص:</b> النظام بيحفظ لوحده جوا المتصفح، بس ده مش مضمون ١٠٠٪.
      خليك دايمًا فاتح <b>نفس الملف بالظبط</b> من نفس المكان (متنزّلش نسخة جديدة كل مرة)، من نفس المتصفح، من غير تصفح خفي.
      وكل ما تخلص شغل، دوس <b>«حفظ نسخة»</b> فوق واحفظ الملف اللي بينزل في مكان ثابت — ده أضمن حاجة عندك، مش أي حفظ تلقائي.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn p" data-act="close-month">إقفال ${periodLabel(S.period)}</button>
      ${S.closed.length?`<button class="btn danger" data-act="undo-close">تراجع عن آخر إقفال (${periodLabel(S.closed[S.closed.length-1].period)})</button>`:''}
      <button class="btn" data-act="export">تنزيل الجرد CSV</button>
      <button class="btn g" data-act="backup">تنزيل نسخة احتياطية${BK.dirty>0?` (${BK.dirty} تعديل من غير حفظ)`:''}</button>
      <label class="btn" style="display:inline-flex;align-items:center">استرجاع نسخة
        <input type="file" id="restore" accept=".json,application/json" style="display:none"></label>
      <button class="btn danger" data-act="reset">إعادة ضبط كل البيانات</button>
    </div>
    ${S.closed.length?`<div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">الشهور المقفولة</div>
      ${S.closed.slice().reverse().map(p=>`<span class="chip b" style="margin-inline-end:6px">${periodLabel(p.period)} · ${money(p.value)} د.إ</span>`).join('')}</div>`:''}
  </div></div>`;
}

/* ================= 8. الصلاحيات والأقفال ================= */

  const nL=TABS.filter(t=>isLocked(t[0])).length;
  return `
  <div class="panel">
    <h2>أقفال التبويبات <em>${nL} من ${TABS.length} مقفول</em></h2>
    <div class="pad" style="border-bottom:1px solid var(--line)">
      <div class="hint">حط باسورد لأي تبويب عشان محدش يفتحه غيرك. لما حد يضغط عليه هيتطلب منه الباسورد، ولما يدخله يفضل مفتوح لحد ما تضغط <b>«قفل الجلسة»</b> أو تقفل الصفحة.</div>
    </div>
    ${TABS.map(([k,v])=>{
      const L=isLocked(k), open=canOpen(k);
      return `<div class="lockrow">
        <span class="nm">${v}</span>
        ${L?`<span class="chip ${open?'g':'r'}">${open?'مفتوح دلوقتي':'مقفول'}</span>`:`<span class="chip">من غير باسورد</span>`}
        ${(!L||open)?`

/* ================================================================
   EVENTS

function bind(){
  const root=$('#root');
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tab;
    if(!canOpen(k)){ ui.modal=unlockModal(k); return render(); }
    tab=k;ui.q='';ui.only='الكل';render();});
  const mCat=$('#m-cat'); if(mCat) mCat.onchange=e=>{ui.moveCat=e.target.value; render();};
  const mReason=$('#m-reason'); if(mReason) mReason.onchange=e=>{ui.moveReason=e.target.value; render();};
  const bReason=$('#b-reason'); if(bReason) bReason.onchange=e=>{readBulkHeader(); ui.bulk.reason=e.target.value; render();};
  const bParty=$('#b-party'); if(bParty) bParty.onchange=readBulkHeader;
  const bDate=$('#b-date'); if(bDate) bDate.onchange=readBulkHeader;
  const bQ=$('#b-q'); if(bQ){ bQ.oninput=e=>{ui.bulk.q=e.target.value; const p=e.target.selectionStart; readBulkHeader(); render(); const n=$('#b-q'); n.focus(); n.setSelectionRange(p,p);}; }
  root.querySelectorAll('[data-bulkqty]').forEach(inp=>{
    inp.onchange=e=>{
      const id=e.target.dataset.bulkqty, v=e.target.value;
      if(v===''||v===null||+v<=0) delete ui.bulk.qty[id]; else ui.bulk.qty[id]=v;
      readBulkHeader(); render();
    };
    inp.onkeydown=e=>{
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Enter') return;
      e.preventDefault();
      const row=+e.target.dataset.row, next=row+(e.key==='ArrowUp'?-1:1);
      e.target.blur();
      setTimeout(()=>{
        const t=document.querySelector(`[data-bulkqty][data-row="${next}"]`);
        if(t){ t.focus(); t.select(); }
      },40);
    };
  });
  const mItem=$('#m-item');
  if(mItem){
    const refreshUnitMode=()=>{
      const it=item(mItem.value);
      const sel=$('#m-unitmode'); if(!sel) return;
      if(!it){ sel.innerHTML='<option value="1">وحدة</option>'; }
      else if(it.packSize>0){
        sel.innerHTML=`<option value="1">${esc(it.unit)}</option><option value="${it.packSize}" selected>${esc(it.packUnit||'عبوة')} (${fmt(it.packSize)} ${esc(it.unit)})</option>`;
      } else { sel.innerHTML=`<option value="1">${esc(it.unit)}</option>`; }
      updateConv();
    };
    const updateConv=()=>{
      const it=item(mItem.value); const mul=+($('#m-unitmode')?.value||1); const packs=+($('#m-packs')?.value||0);
      const total = n2(packs*mul);
      const qEl=$('#m-qty'); if(qEl) qEl.value = total||'';
      const cv=$('#m-conv');
      if(cv) cv.textContent = it? `= ${fmt(total)} ${it.unit}` : '';
    };
    mItem.onchange=refreshUnitMode; refreshUnitMode();
    const mp=$('#m-packs'); if(mp) mp.oninput=updateConv;
    const mu=$('#m-unitmode'); if(mu) mu.onchange=updateConv;
  }
  root.querySelectorAll('[data-bocell]').forEach(inp=>inp.onchange=async e=>{
    const raw=e.target.dataset.bocell;
    const sep=raw.indexOf(':');
    const oi=+raw.slice(0,sep), itemName=raw.slice(sep+1);
    const order=BO.orders[oi]; if(!order) return;
    if(!order.items) order.items=[];
    const v=e.target.value;
    const ji=order.items.findIndex(x=>x.name===itemName);
    const backup = ji>=0 ? {...order.items[ji]} : null;

    if(v===''||parseFloat(v)<=0){
      if(ji>=0) order.items.splice(ji,1); else return; // مفيش تغيير
    } else {
      const q=parseFloat(v);
      if(isNaN(q)||q<0){ toast('اكتب كمية صحيحة',1); return render(); }
      if(ji>=0) order.items[ji].qty=n2(q);
      else {
        // صنف جديد للفرع ده: بناخد وحدته من أي طلبية تانية فيها نفس الصنف، وإلا نسيبها فاضية
        let unit='';
        for(const o of BO.orders){ const f=(o.items||[]).find(x=>x.name===itemName); if(f){ unit=f.unit; break; } }
        order.items.push({name:itemName, unit, qty:n2(q)});
      }
    }
    const ok=await boSaveOrder(order);
    if(!ok){
      if(backup){ const cur=order.items.findIndex(x=>x.name===itemName); if(cur>=0) order.items[cur]=backup; else order.items.push(backup); }
      else { const cur=order.items.findIndex(x=>x.name===itemName); if(cur>=0) order.items.splice(cur,1); }
    } else toast(`اتحدثت طلبية ${order.branch}`);
    render();
  });
  root.querySelectorAll('[data-boqty]').forEach(inp=>inp.onchange=async e=>{
    const [oi,ji]=e.target.dataset.boqty.split(':').map(Number);
    const order=BO.orders[oi]; if(!order||!order.items||!order.items[ji]) return;
    const v=parseFloat(e.target.value);
    if(isNaN(v)||v<0){ toast('اكتب كمية صحيحة',1); return render(); }
    const old=order.items[ji].qty;
    order.items[ji].qty=n2(v);
    const ok=await boSaveOrder(order);
    if(!ok){ order.items[ji].qty=old; }
    else toast(`اتعدلت كمية "${order.items[ji].name}" عند فرع ${order.branch}`);
    render();
  });
  root.querySelectorAll('[data-boitemdel]').forEach(b=>b.onclick=async ()=>{
    const [oi,ji]=b.dataset.boitemdel.split(':').map(Number);
    const order=BO.orders[oi]; if(!order||!order.items||!order.items[ji]) return;
    const nm=order.items[ji].name;
    if(!confirm(`حذف "${nm}" من طلبية فرع ${order.branch}؟ ده هيتشال فعليًا من طلبية الفرع.`)) return;
    const removed=order.items.splice(ji,1);
    const ok=await boSaveOrder(order);
    if(!ok){ order.items.splice(ji,0,removed[0]); }
    else toast(`اتشال "${nm}" من الطلبية`);
    render();
  });
  root.querySelectorAll('[data-boview]').forEach(b=>b.onclick=()=>{ BO.view=b.dataset.boview; BO.openOrder=null; render(); });
  root.querySelectorAll('[data-boorder]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.boorder;
    BO.openOrder = BO.openOrder===i ? null : i;
    render();
  });
  root.querySelectorAll('[data-bomap]').forEach(sel=>{
    sel.onchange=async e=>{

function dispenseOut(itemId, qty, date, party, reason){
  // بيسجل حركة منصرف لصنف واحد، وبيشغّل وصفته تلقائيًا لو موجودة. لو الرصيد مش كفاية (للصنف نفسه أو لأي خامة في وصفته)، بيرفض ومايسجّلش أي حاجة خالص.
  const r=S.recipes.find(x=>x.outItemId===itemId);
  if(r && r.outQty>0){
    const b = qty / r.outQty;
    for(const l of r.lines){
      const need = n2(l.qty*b);
      const li = item(l.itemId);
      const bal = li ? calc(li).book : 0;
      if(need > bal){
        return {move:null, auto:false, error:`الرصيد مش كفاية لخامة "${li?li.name:'غير معروفة'}" (متاح ${fmt(bal)}، مطلوب ${fmt(need)})`};
      }
    }
    const runId=uid('run');
    for(const l of r.lines) S.moves.push({id:uid('m'),dir:'out',itemId:l.itemId,qty:n2(l.qty*b),date,price:0,party:r.name,reason:'صرف للإنتاج (تلقائي)',runId});
    const cost=recipeCost(r)*b, outQty=n2(r.outQty*b);
    S.moves.push({id:uid('m'),dir:'in',itemId:r.outItemId,qty:outQty,date,price: outQty? n2(cost/outQty):0,party:'إنتاج تلقائي: '+r.name,runId});
    S.runs=S.runs||[]; S.runs.push({id:runId,date,name:r.name,batches:n2(b),outQty,cost,auto:true});
    const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
    S.moves.push(m);
    return {move:m, auto:true};
  }
  const it=item(itemId);
  const bal = it ? calc(it).book : 0;
  if(qty > bal){
    return {move:null, auto:false, error:`الرصيد مش كفاية (متاح ${fmt(bal)} بس، والمطلوب ${fmt(qty)})`};
  }
  const m={id:uid('m'),dir:'out',itemId,qty,date,price:0,party,reason};
  S.moves.push(m);
  return {move:m, auto:false};
}
async function boSaveOrder(order){

  const totals={};
  BO.orders.forEach(o=>(o.items||[]).forEach(it=>{

    totals[it.name].qty = n2(totals[it.name].qty + (+it.qty||0));

  BO.totals=totals;

}

// جدول فروع × أصناف قابل للتعديل، بنفس شكل شيت الإكسل الأصلي
// بيحسب المواد الخام اللازمة لتلبية إجمالي طلبيات الفروع كلها، بناءً على الوصفات المسجلة
function buildProductionPlan(){
  const needed = {}; // rawItemId -> { it, qty }
  const unmatched = []; // أصناف من الفروج مالهاش صنف مطابق أو مالهاش وصفة
  Object.values(BO.totals).forEach(r=>{
    const match = findMatchingLocalItem(r.name);
    if(!match){ unmatched.push({name:r.name, reason:'مالوش صنف مطابق في المخزن'}); return; }
    const rec = S.recipes.find(x=>x.outItemId===match.id);
    if(!rec || !(rec.outQty>0)){ unmatched.push({name:r.name, reason:'الصنف مالوش وصفة إنتاج مسجلة'}); return; }
    const b = r.qty / rec.outQty;
    rec.lines.forEach(l=>{
      const li = item(l.itemId); if(!li) return;
      if(!needed[l.itemId]) needed[l.itemId]={it:li, qty:0};
      needed[l.itemId].qty = n2(needed[l.itemId].qty + l.qty*b);
    });
  });
  const rows = Object.values(needed).map(n=>{
    const bal = calc(n.it).book;
    return {...n, bal, short: n2(n.qty-bal)};
  }).sort((a,b)=>a.it.name.localeCompare(b.it.name,'ar'));
  return {rows, unmatched};
}

async function act(a,d){
  if(a==='mv-toggle-edit'){ ui.mvEdit=!ui.mvEdit; if(!ui.mvEdit) mvSel.clear(); return render(); }
  if(a==='mv-export'){
    const isIn=d.dir==='in';
    const rowsAll=S.moves.filter(m=>m.dir===d.dir).slice().reverse();
    const mq=(ui.mvQ||'').trim().toLowerCase();
    const list=rowsAll.filter(m=>{
      if(ui.mvReason && m.reason!==ui.mvReason) return false;
      if(ui.mvParty && m.party!==ui.mvParty) return false;
      if(mq){ const it=item(m.itemId)||{name:''}; if(!(it.name.toLowerCase().includes(mq)||String(m.party||'').toLowerCase().includes(mq))) return false; }
      return true;
    });
    if(!list.length) return toast('مفيش حركات للتصدير',1);
    const head=['التاريخ','الصنف','الوحدة','الكمية','تاريخ الإنتاج','الحرارة'];
    head.push(...(isIn?['سعر الوحدة','الإجمالي','المورد']:['جهة الصرف','الفرع / ملاحظة']));
    const out=[head];
    list.forEach(m=>{const it=item(m.itemId)||{name:'—',unit:''};
      const r=[m.date,it.name,it.unit,m.qty,m.prodDate||'',(m.temp!=null&&m.temp!=='')?m.temp:''];
      if(isIn) r.push(m.price||0, n2(m.qty*(m.price||0)), m.party||'');
      else r.push(m.reason||'', m.party||'');
      out.push(r);
    });
    const csv='\uFEFF'+out.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const el=document.createElement('a'); el.href=url; el.download=`${isIn?'وارد':'منصرف'}-${S.period}.csv`; el.click(); URL.revokeObjectURL(url);
    return toast('تم التصدير');
  }
  if(a==='mv-clear-sel'){ mvSel.clear(); return render(); }
  if(a==='mv-sel-all'){
    const dir = tab==='in'?'in':'out';
    const mq=(ui.mvQ||'').trim().toLowerCase();
    const ids = S.moves.filter(m=>{
      if(m.dir!==dir) return false;
      if(ui.mvReason && m.reason!==ui.mvReason) return false;
      if(ui.mvParty && m.party!==ui.mvParty) return false;
      if(mq){ const it=item(m.itemId)||{name:''}; if(!(it.name.toLowerCase().includes(mq)||String(m.party||'').toLowerCase().includes(mq))) return false; }
      return true;
    }).map(m=>m.id);
    if(ids.every(id=>mvSel.has(id))) ids.forEach(id=>mvSel.delete(id)); else ids.forEach(id=>mvSel.add(id));
    return render();
  }
  if(a==='mv-bulk-date'){
    const el=$('#mv-bulk-date'); const nd=el?el.value:'';
    if(!nd) return toast('اختار التاريخ الأول',1);
    if(!mvSel.size) return toast('محددش أي حركة',1);
    let n=0;
    S.moves.forEach(m=>{ if(mvSel.has(m.id)){ m.date=nd; n++; } });
    mvSel.clear();
    await saveTx();
    toast(`تم تغيير تاريخ ${n} حركة إلى ${nd}`);
    return render();
  }
  if(a==='ds-export'){
    const q = ui.q.trim().toLowerCase();
    const rows=[['الصنف','الوحدة','وارد','منصرف','الرصيد الحالي','السعر','القيمة','الحد الأدنى','الحالة']];
    let tv=0;
    S.items
      .filter(it=>it.cat==='الجرد اليومي')
      .filter(it=>!q || it.name.toLowerCase().includes(q) || (it.desc||'').toLowerCase().includes(q))
      .forEach(it=>{
        const c=calc(it), value=c.book*(it.price||0); tv+=value;
        const out=c.book<=0, low=it.min>0&&c.book<=it.min;
        rows.push([it.name,it.unit,c.inQ,c.outQ,c.book,it.price||0,n2(value),it.min||'',out?'خلص':(low?'تحت الحد':'متاح')]);

  if(a==='reset'){
    if(!confirm('هيتم مسح كل الحركات والأسعار والرجوع لبيانات جرد شهر 7 الأصلية. متأكد؟')) return;
    try{ await window.storage.delete(KEY_MAIN); await window.storage.delete(KEY_TX); await window.storage.delete(KEY_HIST);}catch(e){}
    S={items:[],recipes:[],period:'',closed:[],moves:[],counts:{}}; await load(); toast('اترجع للأصل'); return render();
  }
}
 
async function boot(){
  try{ await load(); }
  catch(e){
    console.error(e);
    STORAGE_OK=false;
    if(ROLE!=='manager' && (!S.items || !S.items.length)){
      S.items = SEED.map(x=>({...x, opening:x.qty, price:x.price||0, min:0}));
      S.recipes=[]; S.locks={}; S.period='2026-07';
    }
  }
  try{ render(); }
  catch(e){ console.error(e); document.getElementById('root').innerHTML='<div class="boot">مشكلة في العرض: '+esc(e.message)+'</div>'; }
  if(ROLE==='owner' && DB.on){
    setInterval(async ()=>{
      const typing = document.activeElement && document.activeElement.hasAttribute('data-count');
      if(tab==='count' && !typing && !DB.busy && !ui.modal){ await pullAll(true); render(); }
    }, 25000);
  }
}
boot();
window.addEventListener('beforeunload', e => {
  if(PENDING_SYNCS>0 || (BK.dirty>0 && MODE!=='cloud' && !DB.on)){
    e.preventDefault(); e.returnValue = '';
  }
});
</script>
