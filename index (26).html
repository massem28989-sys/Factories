<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<div id="root" dir="rtl">
  <div class="boot">جاري تحميل بيانات المخزن…</div>

<style>
:root{
  --bg:#E8ECEE; --surface:#fff; --ink:#14181C; --muted:#69747E; --line:#CFD8DD;
  --green:#2E6B4F; --amber:#A96A0E; --red:#B23B2E; --blue:#23506E;
  --greenbg:#E4EFE8; --amberbg:#F7EDDC; --redbg:#F6E4E1; --bluebg:#E3EBF1;
  --r:10px;
}
*{box-sizing:border-box}
#root{
  font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',sans-serif;
  color:var(--ink); background:var(--bg); min-height:100vh; padding:0 0 60px;
  font-size:14px; line-height:1.5;
}
.boot{padding:40px;text-align:center;color:var(--muted)}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums; direction:ltr; display:inline-block}
h1,h2,h3{margin:0;font-weight:700}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{background:var(--ink);color:#fff;padding:14px 0 0}
.hrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:14px}
.warnbar{background:#B87514;color:#fff;font-size:12.5px;padding:7px 12px;border-radius:8px;margin-bottom:12px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.2px}
.brand small{display:block;font-weight:400;font-size:11.5px;color:#93A0AA;letter-spacing:0}
.hstat{margin-inline-start:auto;display:flex;gap:22px;flex-wrap:wrap}
.hstat div{text-align:center}
.hstat b{display:block;font-size:17px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr}
.hstat span{font-size:11px;color:#93A0AA}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#9AA7B1;padding:10px 14px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:#fff}
nav .lk{font-size:11px;margin-inline-end:5px;opacity:.85}
nav .lk.open{opacity:.5}
.lockrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid #EDF1F3;flex-wrap:wrap}
.lockrow:last-child{border-bottom:0}
.lockrow .nm{font-weight:500;flex:1 1 150px}

/* ---------- panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:16px;overflow:hidden}
.panel>h2{font-size:14px;padding:11px 14px;border-bottom:1px solid var(--line);background:#F6F8F9;display:flex;align-items:center;gap:10px}
.panel>h2 em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px}
.pad{padding:14px}

/* ---------- ledger strip (signature) ---------- */
.ledger{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;flex-wrap:wrap}
.ledger .cell{flex:1 1 110px;padding:10px 12px;border-inline-start:1px solid var(--line);min-width:0}
.ledger .cell:first-child{border-inline-start:0}
.ledger .op{flex:0 0 26px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:16px;background:#F6F8F9;border-inline-start:1px solid var(--line)}
.ledger .k{font-size:11px;color:var(--muted);white-space:nowrap}
.ledger .v{font-size:19px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:start}
.ledger .cell.book{background:var(--bluebg)}
.ledger .cell.real{background:#F6F8F9}
.ledger .cell.diff.ok{background:var(--greenbg)} .ledger .cell.diff.ok .v{color:var(--green)}
.ledger .cell.diff.bad{background:var(--redbg)} .ledger .cell.diff.bad .v{color:var(--red)}

/* ---------- table ---------- */
.tblwrap{overflow:auto;max-height:min(66vh,720px)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#F6F8F9;text-align:start;font-size:11.5px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
td{padding:7px 10px;border-bottom:1px solid #EDF1F3;vertical-align:middle}
tbody tr:hover{background:#FAFCFC}
tr.catrow td{background:#EEF2F4;color:var(--muted);font-weight:600;font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line)}
tr.catrow:hover td{background:#EEF2F4}
input.cell.syncing{background:#FCF6EA;border-color:#EDD9AE}
input.cell.sync-err{background:#F6E4E1;border-color:#E6C6C1}
td.n{font-family:'IBM Plex Mono',monospace;direction:ltr;text-align:start;font-variant-numeric:tabular-nums;white-space:nowrap}
.iname{font-weight:500}
.idesc{font-size:11px;color:var(--muted)}
.chip{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:20px;background:#EEF2F4;color:var(--muted);white-space:nowrap}
.chip.g{background:var(--greenbg);color:var(--green)} .chip.a{background:var(--amberbg);color:var(--amber)}
.chip.r{background:var(--redbg);color:var(--red)} .chip.b{background:var(--bluebg);color:var(--blue)}
.pos{color:var(--green)} .neg{color:var(--red)} .zero{color:var(--muted)}

/* ---------- controls ---------- */
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#FCFDFD}
input[type=text],input[type=number],input[type=date],select{
  border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
input.cell{width:88px;text-align:start;font-family:'IBM Plex Mono',monospace;direction:ltr;padding:5px 7px}
input.cell.filled{border-color:var(--green);background:#F4FAF6}
.grow{flex:1 1 180px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-weight:500;color:var(--ink)}
.btn:hover{background:#F2F6F7}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.p:hover{background:#2A333B}
.btn.g{background:var(--green);color:#fff;border-color:var(--green)}
.btn.danger{color:var(--red);border-color:#E6C6C1}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.f{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* ---------- cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px}
.card .k{font-size:11.5px;color:var(--muted)}
.card .v{font-size:23px;font-weight:600;font-family:'IBM Plex Mono',monospace;direction:ltr;margin-top:3px}
.card .s{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- toast / modal ---------- */
#toast{position:fixed;inset-inline-start:50%;transform:translateX(50%);bottom:22px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:9px 16px;border-radius:22px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.22)}
.toast.err{background:var(--red)}
.modal{position:fixed;inset:0;background:rgba(15,22,28,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.modal h3{padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.foot{display:flex;gap:8px;justify-content:flex-start;padding:12px 16px;border-top:1px solid var(--line);background:#FAFCFC}
.rlines{display:flex;flex-direction:column;gap:7px}
.rline{display:flex;gap:7px;align-items:center}
.rline select{flex:1 1 auto;min-width:0}
@media(max-width:640px){
  .hstat{width:100%;margin:0;gap:14px;justify-content:space-between}
  .ledger .cell{flex:1 1 84px;padding:8px} .ledger .v{font-size:16px}
}
</style>

/* ---------- storage ---------- */
let MODE = 'memory';   // cloud | browser | memory
const MEM = {};
const hasStore = () => typeof window!=='undefined' && window.storage && typeof window.storage.set==='function';
function lsOK(){ try{ const k='__t'; window.localStorage.setItem(k,'1'); window.localStorage.removeItem(k); return true; }catch(e){ return false; } }

async function sget(k){
  if(hasStore()){
    try{ const r=await window.storage.get(k); if(r&&r.value){ MODE='cloud'; return JSON.parse(r.value); } }catch(e){}
  }
  if(lsOK()){
    try{ const v=window.localStorage.getItem(k); if(v){ if(MODE!=='cloud') MODE='browser'; return JSON.parse(v); } }catch(e){}
  }
  return MEM[k]!==undefined? MEM[k] : null;
}
async function sset(k,v){
  MEM[k]=v; const txt=JSON.stringify(v); let saved=false;
  if(hasStore()){ try{ await window.storage.set(k,txt); MODE='cloud'; saved=true; }catch(e){} }
  if(!saved && lsOK()){ try{ window.localStorage.setItem(k,txt); MODE='browser'; saved=true; }catch(e){} }
  if(!saved){ const was=MODE; MODE='memory'; if(was!=='memory' && $('#root') && $('#root').dataset.ready) render(); }
  return saved;
}

async function sb(path,opts={}){
  const base=DB.url.replace(/\/+$/,'');
  const r=await fetch(base+'/rest/v1/'+path,{
    method:opts.method||'GET',
    headers:{apikey:DB.key,Authorization:'Bearer '+DB.key,'Content-Type':'application/json',
             Prefer:opts.prefer||'return=minimal'},
    body:opts.body?JSON.stringify(opts.body):undefined});
  if(!r.ok){ const t=await r.text(); throw new Error(t.slice(0,180)||('HTTP '+r.status)); }
  const t=await r.text(); return t?JSON.parse(t):null;
}
const UPSERT={method:'POST',prefer:'resolution=merge-duplicates,return=minimal'};
let PENDING_SYNCS = 0;
async function syncOneCount(itemId, qty){
  if(!DB.on) return false;
  PENDING_SYNCS++;
  try{
    if(qty===null){
      await sb('stock_counts?'+fEq()+'&period=eq.'+encodeURIComponent(S.period)+'&item_id=eq.'+encodeURIComponent(itemId), {method:'DELETE'});
    }else{
      await sb('stock_counts', {...UPSERT, body:[{factory:FACTORY, period:S.period, item_id:itemId, qty:qty}]});
    }
    return true;
  }catch(e){ return false; }
  finally{ PENDING_SYNCS--; }
}
const fEq = ()=>'factory=eq.'+encodeURIComponent(FACTORY);

async function connectDB(){
  if(!DB_CONFIGURED){ DB.on=false; DB.err='لسه محتاج تحط رابط ومفتاح Supabase في الملف (تعليمات في تبويب المصانع)'; return false; }
  DB.busy=true;
  try{
    await sb('stock_items?select=id&limit=1',{prefer:'return=representation'});
    DB.on=true; DB.err='';
  }catch(e){ DB.on=false; DB.err='الاتصال فشل: '+e.message; }
  DB.busy=false; return DB.on;
}

function schedulePush(){
  if(!DB.on) return;

  pushTimer=setTimeout(()=>pushAll(true),1500);

async function pushAll(quiet){

      opening:+i.opening||0,price:+i.price||0,min_qty:+i.min||0,note:i.note||'',
      pack_unit:i.packUnit||'',pack_size:+i.packSize||0}))});

    await sb('stock_moves?'+fEq()+'&period=eq.'+encodeURIComponent(P),{method:'DELETE'});
    if(S.moves.length) await sb('stock_moves',{method:'POST',body:S.moves.map(m=>({
      id:m.id,factory:F,period:P,dir:m.dir,item_id:m.itemId,qty:+m.qty||0,price:+m.price||0,
      party:m.party||'',reason:m.reason||'',move_date:m.date}))});

    await sb('stock_counts?'+fEq()+'&period=eq.'+encodeURIComponent(P),{method:'DELETE'});
    const cs=Object.entries(S.counts).map(([k,v])=>({factory:F,period:P,item_id:k,qty:+v||0}));

      id:F+'-'+P+'-'+i,factory:F,period:P,run_date:r.date,name:r.name,batches:+r.batches||0,out_qty:+r.outQty||0,cost:+r.cost||0}))});

/* ---------- calculations ---------- */
function calc(it){
  let inQ=0,outQ=0,inVal=0;
  for(const m of S.moves){
    if(m.itemId!==it.id) continue;
    if(m.dir==='in'){ inQ+=m.qty; inVal+=m.qty*(m.price||0); } else outQ+=m.qty;
  }
  const book = n2(it.opening + inQ - outQ);
  const counted = S.counts[it.id];
  const has = counted!==undefined && counted!==null && counted!=='';
  const real = has? +counted : null;
  return { inQ:n2(inQ), outQ:n2(outQ), inVal, book, real, has, diff: has? n2(real-book):null,
           value: n2((has?real:book)*(it.price||0)) };
}
function totals(){
  let value=0, counted=0, low=0, gain=0, loss=0, lossVal=0;
  for(const it of S.items){
    const c=calc(it); value+=c.value; if(c.has) counted++;
    const onhand = c.has?c.real:c.book;
    if(it.min>0 && onhand<=it.min) low++;
    if(c.has&&c.diff>0) gain+=1;
    if(c.has&&c.diff<0){ loss+=1; lossVal += Math.abs(c.diff)*(it.price||0); }
  }
  return {value,counted,low,gain,loss,lossVal,total:S.items.length};
}
function recipeCost(r){
  return r.lines.reduce((s,l)=>{const it=item(l.itemId); return s + (it? (it.price||0)*l.qty : 0);},0);
}

/* ---------- filters ---------- */
const CATEGORY_ORDER = ['خامات','منتجات جديدة','تعبئة وتغليف'];
const catRank = c => { const i=CATEGORY_ORDER.indexOf(c); return i===-1?999:i; };
function sortItemsList(list){
  return list.slice().sort((a,b)=>{
    const ra=catRank(a.cat), rb=catRank(b.cat);
    if(ra!==rb) return ra-rb;
    if(a.cat!==b.cat) return a.cat.localeCompare(b.cat,'ar');
    return String(a.id).localeCompare(String(b.id));
  });
}
function filtered(){
  const q=ui.q.trim().toLowerCase();
  const list = S.items.filter(it=>{
    if(ui.cat!=='الكل' && it.cat!==ui.cat) return false;
    if(q && !(it.name.toLowerCase().includes(q)||(it.desc||'').toLowerCase().includes(q))) return false;
    if(ui.only!=='الكل'){
      const c=calc(it);
      if(ui.only==='ناقص' && !(c.has&&c.diff<0)) return false;
      if(ui.only==='زيادة' && !(c.has&&c.diff>0)) return false;
      if(ui.only==='لسه' && c.has) return false;
      if(ui.only==='تحت الحد' && !(it.min>0 && (c.has?c.real:c.book)<=it.min)) return false;
    }
    return true;
  });
  return sortItemsList(list);
}
const cats = ()=>['الكل',...[...new Set(S.items.map(i=>i.cat))].sort((a,b)=>{
  const ra=catRank(a), rb=catRank(b); return ra!==rb? ra-rb : a.localeCompare(b,'ar');
})];
function filterBar(withOnly){
  return `<div class="bar">
    <input type="text" class="grow" id="q" placeholder="دور على صنف…" value="${esc(ui.q)}">
    <select id="cat">${cats().map(c=>`<option ${ui.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    ${withOnly?`<select id="only">${['الكل','لسه','ناقص','زيادة','تحت الحد'].map(c=>`<option ${ui.only===c?'selected':''}>${c}</option>`).join('')}</select>`:''}
  </div>`;
}

        const hdr = it.cat!==lastCat ? (lastCat=it.cat, `<tr class="catrow"><td colspan="9">${esc(it.cat)}</td></tr>`) : '';
        return hdr+`<tr>
        <td><div class="iname">${esc(it.name)}</div><div class="idesc">${esc(it.desc)}${it.note?' · <span style="color:var(--amber)">'+esc(it.note)+'</span>':''}</div></td>

        <td><span class="chip">${esc(it.unit)}</span></td>
        <td>${it.packSize?`<span class="chip b">${esc(it.packUnit||'عبوة')} = ${fmt(it.packSize)} ${esc(it.unit)}</span>`:'<span class="hint">—</span>'}</td>
        <td class="n">${fmt(onhand)} ${low?'<span class="chip a">تحت الحد</span>':''}</td>
        <td><input type="number" step="any" class="cell" data-price="${it.id}" value="${it.price||''}" placeholder="0"></td>
        <td><input type="number" step="any" class="cell" data-min="${it.id}" value="${it.min||''}" placeholder="0"></td>
        <td class="n"><b>${money(c.value)}</b></td>
        <td><button class="btn sm" data-edit="${it.id}">تعديل</button></td></tr>`;}).join('');})()
        ||`<tr><td colspan="9" class="empty">مفيش نتايج</td></tr>`}
      </tbody></table></div>
  </div>`;
}

/* ================= 6. التقارير والإقفال ================= */
function viewRep(){
  const t=totals();
  const byCat={};
  for(const it of S.items){const c=calc(it); byCat[it.cat]=(byCat[it.cat]||0)+c.value;}
  const varis=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.c.has&&x.c.diff!==0&&x.it.price>0)
    .sort((a,b)=>Math.abs(b.c.diff*b.it.price)-Math.abs(a.c.diff*a.it.price)).slice(0,12);
  const low=S.items.map(it=>({it,c:calc(it)})).filter(x=>x.it.min>0&&(x.c.has?x.c.real:x.c.book)<=x.it.min);
  const noPrice=S.items.filter(i=>!i.price).length;
  return `
  <div class="panel"><div class="pad"><div class="cards">
    <div class="card"><div class="k">قيمة المخزون</div><div class="v">${money(t.value)}</div><div class="s">درهم إماراتي</div></div>
    <div class="card"><div class="k">عجز الجرد</div><div class="v" style="color:var(--red)">${money(t.lossVal)}</div><div class="s">${t.loss} صنف ناقص</div></div>
    <div class="card"><div class="k">أصناف زيادة</div><div class="v" style="color:var(--green)">${t.gain}</div><div class="s">أكتر من الدفتري</div></div>
    <div class="card"><div class="k">تحت الحد الأدنى</div><div class="v" style="color:var(--amber)">${t.low}</div><div class="s">محتاجة طلبية</div></div>
    <div class="card"><div class="k">من غير سعر</div><div class="v">${noPrice}</div><div class="s">مش داخلة في القيمة</div></div>
  </div></div></div>

  <div class="panel"><h2>قيمة المخزون حسب القسم</h2><div class="pad">
    ${Object.entries(byCat).map(([c,v])=>`<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span>${esc(c)}</span><span class="num">${money(v)}</span></div>
      <div style="height:7px;background:#EEF2F4;border-radius:5px;overflow:hidden;margin-top:3px">
        <div style="height:100%;width:${t.value?Math.max(2,v/t.value*100):0}%;background:var(--blue)"></div></div></div>`).join('')}
  </div></div>

  <div class="panel"><h2>أكبر فروقات الجرد <em>بالقيمة</em></h2>
    ${varis.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>دفتري</th><th>فعلي</th><th>الفرق</th><th>قيمة الفرق</th></tr></thead>
    <tbody>${varis.map(({it,c})=>`<tr><td>${esc(it.name)}</td><td class="n">${fmt(c.book)}</td><td class="n">${fmt(c.real)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}">${c.diff>0?'+':''}${fmt(c.diff)}</td>
      <td class="n ${c.diff<0?'neg':'pos'}"><b>${money(c.diff*it.price)}</b></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">لما تدخل الجرد الفعلي والأسعار، الفروقات هتظهر هنا مرتبة بالقيمة.</div>`}
  </div>

  <div class="panel"><h2>أصناف محتاجة طلبية</h2>
    ${low.length?`<div class="tblwrap"><table><thead><tr><th>الصنف</th><th>الرصيد</th><th>الحد الأدنى</th><th>الناقص</th></tr></thead>
    <tbody>${low.map(({it,c})=>{const oh=c.has?c.real:c.book;return `<tr><td>${esc(it.name)}</td><td class="n">${fmt(oh)} ${esc(it.unit)}</td><td class="n">${fmt(it.min)}</td><td class="n neg">${fmt(it.min-oh)}</td></tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">مفيش صنف تحت الحد الأدنى — أو لسه محددتش الحدود الدنيا في كارت الأصناف.</div>`}
  </div>

  <div class="panel"><h2>إقفال الشهر</h2><div class="pad">
    <div class="hint" style="margin-bottom:10px">الإقفال بيخلي <b>الجرد الفعلي</b> هو رصيد أول المدة للشهر الجاي، ويحفظ نسخة من ${periodLabel(S.period)} في الأرشيف، ويفضّي الوارد والمنصرف. الأصناف اللي متجردتش هتاخد رصيدها الدفتري.</div>
    <div class="hint" style="margin-bottom:10px;background:#FCF6EA;border:1px solid #EDD9AE;border-radius:8px;padding:9px">
      <b>عشان بياناتك متضيعش خالص:</b> النظام بيحفظ لوحده جوا المتصفح، بس ده مش مضمون ١٠٠٪.
      خليك دايمًا فاتح <b>نفس الملف بالظبط</b> من نفس المكان (متنزّلش نسخة جديدة كل مرة)، من نفس المتصفح، من غير تصفح خفي.
      وكل ما تخلص شغل، دوس <b>«حفظ نسخة»</b> فوق واحفظ الملف اللي بينزل في مكان ثابت — ده أضمن حاجة عندك، مش أي حفظ تلقائي.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn p" data-act="close-month">إقفال ${periodLabel(S.period)}</button>
      <button class="btn" data-act="export">تنزيل الجرد CSV</button>
      <button class="btn g" data-act="backup">تنزيل نسخة احتياطية${BK.dirty>0?` (${BK.dirty} تعديل من غير حفظ)`:''}</button>
      <label class="btn" style="display:inline-flex;align-items:center">استرجاع نسخة
        <input type="file" id="restore" accept=".json,application/json" style="display:none"></label>
      <button class="btn danger" data-act="reset">إعادة ضبط كل البيانات</button>
    </div>
    ${S.closed.length?`<div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">الشهور المقفولة</div>
      ${S.closed.slice().reverse().map(p=>`<span class="chip b" style="margin-inline-end:6px">${periodLabel(p.period)} · ${money(p.value)} د.إ</span>`).join('')}</div>`:''}
  </div></div>`;
}

    <h3>تشغيل: ${esc(r.name)}</h3>
    <div class="pad">
      <label class="f">عدد التشغيلات</label>
      <input type="number" step="any" id="run-b" value="1" style="width:100%">
      <div class="hint" style="margin-top:10px">التشغيلة الواحدة بتنتج <b>${fmt(r.outQty)} ${esc((item(r.outItemId)||{}).unit||'')}</b> بتكلفة <b>${money(recipeCost(r))} د.إ</b> وبتستهلك:</div>
      <div style="margin-top:6px">${r.lines.map(l=>`<span class="chip" style="margin:2px">${esc((item(l.itemId)||{}).name||'?')} · ${fmt(l.qty)}</span>`).join('')}</div>
    </div>
    <div class="foot"><button class="btn g" data-act="do-run" data-id="${r.id}">سجّل الإنتاج</button><button class="btn" data-close="1">إلغاء</button></div>
  </div></div>`;
}

/* ================================================================
   EVENTS
   ================================================================ */
function bind(){
  const root=$('#root');
  root.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.tab;
    if(!canOpen(k)){ ui.modal=unlockModal(k); return render(); }
    tab=k;ui.q='';ui.only='الكل';render();});
  const mItem=$('#m-item');
  if(mItem){
    const refreshUnitMode=()=>{
      const it=item(mItem.value);
      const sel=$('#m-unitmode'); if(!sel) return;
      if(!it){ sel.innerHTML='<option value="1">وحدة</option>'; }
      else if(it.packSize>0){
        sel.innerHTML=`<option value="1">${esc(it.unit)}</option><option value="${it.packSize}" selected>${esc(it.packUnit||'عبوة')} (${fmt(it.packSize)} ${esc(it.unit)})</option>`;
      } else { sel.innerHTML=`<option value="1">${esc(it.unit)}</option>`; }
      updateConv();
    };
    const updateConv=()=>{
      const it=item(mItem.value); const mul=+($('#m-unitmode')?.value||1); const packs=+($('#m-packs')?.value||0);
      const total = n2(packs*mul);
      const qEl=$('#m-qty'); if(qEl) qEl.value = total||'';
      const cv=$('#m-conv');
      if(cv) cv.textContent = it? `= ${fmt(total)} ${it.unit}` : '';
    };
    mItem.onchange=refreshUnitMode; refreshUnitMode();
    const mp=$('#m-packs'); if(mp) mp.oninput=updateConv;
    const mu=$('#m-unitmode'); if(mu) mu.onchange=updateConv;
  }
  const q=$('#q'); if(q){ q.oninput=e=>{ui.q=e.target.value; const p=e.target.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(p,p);}; }
  const c=$('#cat'); if(c) c.onchange=e=>{ui.cat=e.target.value;render();};
  const o=$('#only'); if(o) o.onchange=e=>{ui.only=e.target.value;render();};

  root.querySelectorAll('[data-count]').forEach(inp=>{
    inp.onchange=e=>{
      const id=e.target.dataset.count, v=e.target.value;
      const qty = (v===''||v===null) ? null : +v;
      if(qty===null) delete S.counts[id]; else S.counts[id]=qty;
      saveTx();
      render();
      syncOneCount(id, qty).then(ok=>{
        if(!ok && DB.on) toast('رقم صنف متسجّلش، دخله تاني',1);
      });
    };
    inp.onkeydown=e=>{
      if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Enter') return;
      e.preventDefault();
      const row=+e.target.dataset.row, next=row+(e.key==='ArrowUp'?-1:1);
      e.target.blur();
      setTimeout(()=>{
        const t=document.querySelector(`[data-count][data-row="${next}"]`);
        if(t){ t.focus(); t.select(); }
      },40);
    };
  });
  root.querySelectorAll('[data-price]').forEach(inp=>inp.onchange=async e=>{
    const it=item(e.target.dataset.price); it.price=+e.target.value||0; await saveMain(); render();});
  root.querySelectorAll('[data-min]').forEach(inp=>inp.onchange=async e=>{
    const it=item(e.target.dataset.min); it.min=+e.target.value||0; await saveMain(); render();});
  root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ui.modal=itemModal(item(b.dataset.edit));render();});
  root.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    S.moves=S.moves.filter(m=>m.id!==b.dataset.del); await saveTx(); toast('اتحذفت الحركة'); render();});
  root.querySelectorAll('[data-delr]').forEach(b=>b.onclick=async()=>{
    S.recipes=S.recipes.filter(r=>r.id!==b.dataset.delr); await saveMain(); render();});
  root.querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>{ui.modal=runModal(S.recipes.find(r=>r.id===b.dataset.run));render();});
  root.querySelectorAll('[data-close]').forEach(el=>el.onclick=e=>{if(e.target===el){ui.modal=null;render();}});
  root.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=()=>{readLines();ui.rlines.splice(+b.dataset.rdel,1);if(!ui.rlines.length)ui.rlines=[{itemId:'',qty:''}];ui.modal=recipeModal();render();});
  root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset));
  const rf=$('#restore');
  if(rf) rf.onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    const fr=new FileReader();
    fr.onload=async()=>{
      try{
        const d=JSON.parse(fr.result);
        if(!d.items||!Array.isArray(d.items)) throw new Error('الملف مش نسخة احتياطية صحيحة');
        if(!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. متأكد؟')) return;
        S.items=d.items; S.recipes=d.recipes||[]; S.locks=d.locks||{}; S.period=d.period||S.period;
        S.moves=d.moves||[]; S.counts=d.counts||{}; S.runs=d.runs||[]; S.closed=d.closed||[];
        SESS={}; await saveMain(); await saveTx(); await sset(KEY_HIST,{periods:S.closed});
        BK.dirty=0; toast('النسخة اترجّعت'); render();
      }catch(err){ toast('الملف مش سليم: '+err.message,1); }
    };
    fr.readAsText(f);
  };
  const upw=$('#u-pw'); if(upw){ upw.focus();
    upw.onkeydown=e=>{ if(e.key==='Enter'){ const btn=root.querySelector('[data-act="try-unlock"]'); act('try-unlock',btn.dataset); } }; }
  root.querySelectorAll('[data-pw]').forEach(el=>el.onkeydown=e=>{ if(e.key==='Enter') act('set-lock',{k:el.dataset.pw}); });
}
function readLines(){
  const box=$('#rlines'); if(!box) return;
  ui.rlines = [...box.querySelectorAll('.rline')].map(el=>({
    itemId: el.querySelector('select').value, qty: el.querySelector('input').value }));
}

async function act(a,d){
  if(a==='set-lock'){
    const el=document.querySelector(`[data-pw="${d.k}"]`); const v=(el?el.value:'').trim();
    if(v.length<3) return toast('الباسورد لازم يكون 3 حروف على الأقل',1);
    S.locks[d.k]=hsh(v); SESS[d.k]=true; await saveMain(); toast('التبويب اتقفل'); return render();
  }
  if(a==='remove-lock'){ delete S.locks[d.k]; delete SESS[d.k]; await saveMain(); toast('القفل اتشال'); return render(); }
  if(a==='ask-unlock'){ ui.modal=unlockModal(d.k); return render(); }
  if(a==='try-unlock'){
    const v=$('#u-pw').value;
    if(hsh(v)!==S.locks[d.k]) return toast('الباسورد غلط',1);
    SESS[d.k]=true; ui.modal=null; tab=d.k; ui.q=''; ui.only='الكل'; toast('اتفتح'); return render();
  }
  if(a==='lock-all'){
    SESS={}; if(isLocked(tab)) tab='count';
    toast('كل التبويبات المقفولة رجعت مقفولة'); return render();
  }
  if(a==='new-item'){ ui.modal=itemModal(null); return render(); }
  if(a==='new-recipe'){ ui.rlines=[{itemId:'',qty:''}]; ui.modal=recipeModal(); return render(); }
  if(a==='add-line'){ readLines(); ui.rlines.push({itemId:'',qty:''}); ui.modal=recipeModal(); return render(); }

  if(a==='save-item'){
    const name=$('#f-name').value.trim(); if(!name) return toast('اكتب اسم الصنف',1);
    const rec={name, desc:$('#f-desc').value.trim(), unit:$('#f-unit').value, cat:$('#f-cat').value,
      opening:+$('#f-open').value||0, price:+$('#f-price').value||0, min:+$('#f-min').value||0,
      packUnit:$('#f-packunit').value.trim(), packSize:+$('#f-packsize').value||0};
    if(d.id){ Object.assign(item(d.id),rec); } else { S.items.push({id:uid('i'),note:'',...rec}); }
    await saveMain(); ui.modal=null; toast('اتحفظ'); return render();
  }
  if(a==='del-item'){
    S.items=S.items.filter(i=>i.id!==d.id); S.moves=S.moves.filter(m=>m.itemId!==d.id); delete S.counts[d.id];
    await saveMain(); await saveTx(); ui.modal=null; toast('الصنف اتحذف'); return render();
  }
  if(a==='add-supplier'){
    const name=prompt('اسم المورد الجديد:'); if(!name||!name.trim()) return;
    if(!S.suppliers.includes(name.trim())) S.suppliers.push(name.trim());
    await saveMain(); toast('اتضاف المورد'); return render();
  }
  if(a==='add-move'){
    const id=$('#m-item').value, qty=+$('#m-qty').value;
    if(!id) return toast('اختار الصنف',1);
    if(!qty||qty<=0) return toast('اكتب كمية صحيحة',1);
    const isIn=d.dir==='in', it=item(id);
    if(!isIn){ const c=calc(it); if(qty>c.book) toast(`تحذير: الرصيد الدفتري ${fmt(c.book)} بس`,1); }
    const m={id:uid('m'),dir:d.dir,itemId:id,qty,date:$('#m-date').value||today(),
      price:isIn?(+$('#m-price').value||0):0, party:$('#m-party')?$('#m-party').value.trim():'',
      reason:isIn?'':$('#m-reason').value};
    S.moves.push(m);
    if(isIn && m.price>0){ it.price=m.price; await saveMain(); }
    await saveTx(); toast(isIn?'الوارد اتسجل':'المنصرف اتسجل'); return render();
  }
  if(a==='save-recipe'){
    readLines();
    const name=$('#r-name').value.trim(), outId=$('#r-out').value, outQty=+$('#r-outqty').value;
    if(!name||!outId||!outQty) return toast('اكتب اسم الوصفة والمنتج والكمية',1);
    const lines=ui.rlines.filter(l=>l.itemId&&+l.qty>0).map(l=>({itemId:l.itemId,qty:+l.qty}));
    if(!lines.length) return toast('ضيف خامة واحدة على الأقل',1);
    S.recipes.push({id:uid('r'),name,outItemId:outId,outQty,lines});
    await saveMain(); ui.modal=null; toast('الوصفة اتحفظت'); return render();
  }
  if(a==='do-run'){
    const r=S.recipes.find(x=>x.id===d.id), b=+$('#run-b').value||0;
    if(b<=0) return toast('اكتب عدد التشغيلات',1);
    const date=today();
    for(const l of r.lines) S.moves.push({id:uid('m'),dir:'out',itemId:l.itemId,qty:n2(l.qty*b),date,price:0,party:r.name,reason:'صرف للإنتاج'});
    const cost=recipeCost(r)*b, outQty=n2(r.outQty*b);
    S.moves.push({id:uid('m'),dir:'in',itemId:r.outItemId,qty:outQty,date,price: outQty? n2(cost/outQty):0,party:'إنتاج: '+r.name});
    S.runs=S.runs||[]; S.runs.push({date,name:r.name,batches:b,outQty,cost});
    await saveTx(); ui.modal=null; toast('الإنتاج اتسجل والخامات اتخصمت'); return render();
  }
  if(a==='fill-book'){
    for(const it of S.items){ if(S.counts[it.id]===undefined) S.counts[it.id]=calc(it).book; }
    await saveTx(); toast('كل الأصناف الفاضية اتسجلت مطابقة'); return render();
  }
  if(a==='close-month'){
    if(!confirm(`إقفال ${periodLabel(S.period)}؟ الجرد الفعلي هيبقى أول المدة للشهر الجاي.`)) return;
    const t=totals();
    S.closed.push({period:S.period,value:t.value,date:today(),
      items:S.items.map(i=>({id:i.id,name:i.name,closing:(S.counts[i.id]!==undefined?+S.counts[i.id]:calc(i).book),price:i.price}))});
    for(const it of S.items){ const c=calc(it); it.opening = c.has? c.real : c.book; }
    S.moves=[]; S.counts={}; S.runs=[];
    const [y,m]=S.period.split('-').map(Number); const nd=new Date(y,m,1);
    S.period=`${nd.getFullYear()}-${String(nd.getMonth()+1).padStart(2,'0')}`;
    await saveMain(); await saveTx(); await sset(KEY_HIST,{periods:S.closed});
    toast('الشهر اتقفل — بدأنا '+periodLabel(S.period)); return render();
  }
  if(a==='db-retry'){
    DB.busy=true; render();
    const ok=await connectDB();
    if(ok){ await loadFactories(); await pullAll(true); }
    DB.busy=false; render();
    return toast(ok?'الاتصال تمام':'لسه مش شغال',!ok);
  }
  if(a==='db-push'){ return void pushAll(false); }
  if(a==='switch-fac'){
    location.search = (QS.get('manager')!==null?'?manager&':'?') + 'factory=' + encodeURIComponent(d.id);
    return;
  }
  if(a==='add-fac'){
    const name=$('#new-fac-name').value.trim();
    if(!name) return toast('اكتب اسم المصنع',1);
    const id=name.trim().toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g,'-').replace(/^-+|-+$/g,'')||('f'+Date.now());
    if(FACTORIES.some(f=>f.id===id)) return toast('فيه مصنع بنفس الاسم قبل كده',1);
    try{ await addFactory(id,name); toast('اتضاف — بتنقل ليه دلوقتي'); location.search='?factory='+encodeURIComponent(id); }
    catch(e){ toast('فشلت الإضافة: '+e.message,1); }
    return;
  }
  if(a==='copy-link'){
    const el=$('#mgr-link'); el.select();
    try{ await navigator.clipboard.writeText(el.value); toast('اتنسخ الرابط'); }
    catch(e){ document.execCommand('copy'); toast('اتنسخ الرابط'); }
    return;
  }
  if(a==='db-pull-quiet'){ await pullAll(true); return render(); }
  if(a==='mgr-submit'){
    DB.busy=true; render();
    const ok=await pushAll(true);
    DB.busy=false;
    if(ok){
      S.submittedAt=new Date().toLocaleString('en-GB');
      try{ await sb('stock_settings',{...UPSERT,body:[{factory:FACTORY,k:'manager_submission',v:{at:S.submittedAt,period:S.period}}]}); }catch(e){}
      toast('اتبعت الجرد لصاحب المصنع');
    }
    return render();
  }
  if(a==='db-pull'){ if(!confirm('هيتم استبدال البيانات اللي على الجهاز ده باللي في القاعدة. متأكد؟')) return; return void pullAll(); }
  if(a==='backup'){
    const data={v:1,savedAt:new Date().toISOString(),period:S.period,items:S.items,recipes:S.recipes,
      locks:S.locks,moves:S.moves,counts:S.counts,runs:S.runs||[],closed:S.closed};
    const url=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
    const a3=document.createElement('a'); a3.href=url; a3.download=`نسخة-احتياطية-مخزن-${S.period}.json`; a3.click(); URL.revokeObjectURL(url);
    BK.dirty=0; BK.lastAt=new Date().toLocaleString('en-GB');
    toast('النسخة الاحتياطية اتنزّلت — احفظها في مكان ثابت'); return render();
  }
  if(a==='export'){
    const rows=[['الصنف','الوصف','القسم','الوحدة','أول المدة','وارد','منصرف','دفتري','فعلي','الفرق','سعر الوحدة','القيمة']];
    for(const it of S.items){const c=calc(it);
      rows.push([it.name,it.desc,it.cat,it.unit,it.opening,c.inQ,c.outQ,c.book,c.has?c.real:'',c.has?c.diff:'',it.price||0,c.value]);}
    const csv='\uFEFF'+rows.map(r=>r.map(x=>`"${String(x??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a2=document.createElement('a'); a2.href=url; a2.download=`جرد-${S.period}.csv`; a2.click(); URL.revokeObjectURL(url);
    return toast('اتنزّل الملف');
  }
  if(a==='reset'){
    if(!confirm('هيتم مسح كل الحركات والأسعار والرجوع لبيانات جرد شهر 7 الأصلية. متأكد؟')) return;
    try{ await window.storage.delete(KEY_MAIN); await window.storage.delete(KEY_TX); await window.storage.delete(KEY_HIST);}catch(e){}
    S={items:[],recipes:[],period:'',closed:[],moves:[],counts:{}}; await load(); toast('اترجع للأصل'); return render();
  }
}

async function boot(){
  try{ await load(); }
  catch(e){
    console.error(e);
    STORAGE_OK=false;
    if(ROLE!=='manager' && (!S.items || !S.items.length)){
      S.items = SEED.map(x=>({...x, opening:x.qty, price:x.price||0, min:0}));
      S.recipes=[]; S.locks={}; S.period='2026-07';
    }
  }
  try{ render(); }
  catch(e){ console.error(e); document.getElementById('root').innerHTML='<div class="boot">مشكلة في العرض: '+esc(e.message)+'</div>'; }
  if(ROLE==='owner' && DB.on){
    setInterval(async ()=>{
      const typing = document.activeElement && document.activeElement.hasAttribute('data-count');
      if(tab==='count' && !typing && !DB.busy && !ui.modal){ await pullAll(true); render(); }
    }, 25000);
  }
}
boot();
window.addEventListener('beforeunload', e => {
  if(PENDING_SYNCS>0 || (BK.dirty>0 && MODE!=='cloud' && !DB.on)){
    e.preventDefault(); e.returnValue = '';
  }
});
</script>
